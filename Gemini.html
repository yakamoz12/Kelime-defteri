<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Makale Okuyucu">
<title>Makale Okuyucu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f7f7f4;--surface:#ffffff;--surface2:#eef0f2;--ink:#1b2230;--muted:#5d6675;--line:#dfe2e7;
  --accent:#2b4c8c;--accent-soft:#e6ecf7;--on-accent:#ffffff;
  --hl:rgba(255,222,60,.55);--trbg:#f1f5fb;--trbar:#8aa6d8;--danger:#b3261e;
  --shadow:0 12px 32px rgba(20,30,50,.14);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b;--surface:#1a1e26;--surface2:#232834;--ink:#e6e9ef;--muted:#98a1b0;--line:#2c323e;
  --accent:#8fb0f0;--accent-soft:#1f2a40;--on-accent:#0d1424;
  --hl:rgba(255,215,60,.26);--trbg:#182030;--trbar:#4f6fa8;--danger:#f2857b;
  --shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;-webkit-tap-highlight-color:transparent;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#app{height:100%;display:flex;flex-direction:column}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:18px;flex:none}
.pname{border:0;background:none;padding:0;min-height:0;display:block;text-align:left;min-width:0;max-width:100%}
.pname b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:8px;flex:none}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;min-width:22px;text-align:center}

/* Section bar */
.secbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.secbar[hidden]{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 380px;min-width:0;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;min-height:38px;padding:6px 15px;background:var(--surface2);border-color:transparent}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.chip .ok{color:var(--accent);font-weight:700;margin-left:2px}
.chip.on .ok{color:inherit}
.ctrls{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;min-height:36px;padding:4px 13px;border-radius:8px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}

/* Reader */
.main{flex:1;display:flex;min-height:0;position:relative}
.readcol{flex:1;min-width:0;position:relative;display:flex}
#reader{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:30px 28px 150px}
.article{max-width:720px;margin:0 auto}
.sec-head{margin:0 0 24px}
.sec-head .orig{color:var(--muted);font-size:14px;font-style:italic;font-family:var(--serif)}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.2;margin:2px 0 0}
.notice{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.para{margin:0 0 16px}
.blk{position:relative;margin:0 -14px;padding:6px 44px 6px 14px;border-radius:6px;font-family:var(--serif);font-size:19px;line-height:1.66;transition:background-color .25s}
.blk p{margin:0;-webkit-hyphens:auto;hyphens:auto}
.blk.tr{background:var(--trbg);box-shadow:inset 3px 0 0 var(--trbar);margin-top:6px}
.blk.skipped{opacity:.5;font-size:15px}
.blk.noted,.blk.hl-live{background:var(--hl)}
.blk.tr.noted{box-shadow:inset 3px 0 0 var(--trbar)}
.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.addn{position:absolute;right:6px;top:6px;width:32px;height:32px;min-height:0;padding:0;border-radius:50%;font-size:18px;line-height:1;opacity:.5}
.noted .addn{opacity:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
svg.ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#reader.tooling .blk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.showskip{margin:18px 0 0;color:var(--muted);background:transparent}

/* Empty state */
.empty{max-width:560px;margin:6vh auto 0;text-align:left}
.empty h2{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.15;margin:0 0 10px}
.empty p.lead{color:var(--muted);font-size:17px;margin:0 0 24px}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.big{min-height:52px;padding:10px 22px;font-size:16px}
.steps{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.steps li span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}

/* Toolbar */
.toolbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:20px;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
.toolbar[hidden]{display:none}
.tool{flex-direction:column;gap:1px;min-width:60px;min-height:54px;padding:4px 8px;border:0;background:transparent;font-size:11.5px;border-radius:14px}
.tool svg{width:23px;height:23px}
.tool.on{background:var(--accent);color:var(--on-accent)}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--surface);margin:0 2px}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.tsep{width:1px;height:32px;background:var(--line);margin:0 5px}
.selpill{position:absolute;left:50%;transform:translateX(-50%);bottom:94px;z-index:21;box-shadow:var(--shadow)}
.selpill[hidden]{display:none}

/* Notes */
.notes{width:390px;flex:none;border-left:1px solid var(--line);background:var(--bg);display:none;flex-direction:column;min-height:0}
body.notes-open .notes{display:flex}
.nhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.nhead h3{margin:0;flex:1;font-family:var(--serif);font-size:20px;font-weight:600}
#notesList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px}
.note-top{display:flex;align-items:center;gap:8px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.src{flex:1;min-width:0;border:0;background:none;padding:0;min-height:30px;justify-content:flex-start;color:var(--accent);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.src.free{color:var(--muted)}
.nact button{min-height:32px;width:32px;padding:0;border:0;background:transparent;color:var(--muted)}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;font-family:var(--serif);font-size:16px;line-height:1.55;padding:6px 0 0;outline:none;overflow:hidden;min-height:48px}
.cite{color:var(--muted);font-size:13px;margin-top:4px}
.empty-notes{color:var(--muted);text-align:center;padding:30px 10px;font-size:14.5px}
.empty-notes b{color:var(--ink)}
.nclose{display:none}
@media (max-width:1050px){
  .notes{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);display:flex;transform:translateX(105%);transition:transform .28s ease;z-index:30;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.notes-open .notes{transform:none}
  .nclose{display:inline-flex}
}
@media (max-width:640px){
  .tool span{display:none}.tool{min-width:44px}
  .hbtns .lbl{display:none}
  #reader{padding:22px 18px 140px}
  .blk{font-size:18px}
}

/* Overlay canvas, modal, busy, toast */
#ov{position:fixed;left:0;top:0;pointer-events:none;z-index:16}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(620px,100%);padding:22px;margin:auto 0}
.mbox h3{margin:0 0 6px;font-family:var(--serif);font-size:24px;font-weight:600}
.mbox label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 0}
.mbox input,.mbox textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;font-size:16px}
.mbox textarea{resize:vertical;line-height:1.4}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.g2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;margin-top:5px}
.row input{margin-top:0}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.preview{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.preview .pl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.refp{font-family:var(--serif);padding-left:2em;text-indent:-2em;margin:4px 0;line-height:1.5}
.field{margin-top:16px}
.flabel{font-weight:600;font-size:13.5px;margin-bottom:6px}
.seg.wide{display:flex}.seg.wide button{flex:1;white-space:normal}
.libitem{border-top:1px solid var(--line);padding:14px 0}
.libitem:first-of-type{border-top:0}
.libmeta{color:var(--muted);font-size:13px;margin:4px 0 8px}
.libact{display:flex;gap:8px;flex-wrap:wrap}
.docprev{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg);font-family:"Times New Roman",var(--serif);font-size:15px;line-height:1.55;margin-top:12px}
.docprev h4{text-align:center;margin:6px 0 12px;font-size:16px}
.docprev .n{padding-left:1.6em;text-indent:-1.6em;margin:0 0 10px}
.busy{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font-weight:600;text-align:center;padding:20px}
.busy[hidden]{display:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;max-width:min(560px,92vw);display:flex;align-items:center;gap:12px;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
.toast button{min-height:34px;background:transparent;color:inherit;border-color:currentColor}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">M</div>
      <button class="pname" id="pname"><b>Makale Okuyucu</b><small>Makale seçilmedi</small></button>
    </div>
    <div class="hbtns">
      <button id="bLib" title="Kütüphane"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7"/></svg><span class="lbl">Kütüphane</span></button>
      <label class="btn primary" for="file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">PDF ekle</span></label>
      <button id="bNotes"><span class="lbl">Notlar</span><span class="badge" id="noteCount">0</span></button>
      <button id="bSet" title="Ayarlar" aria-label="Ayarlar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <input type="file" id="file" class="vh" accept="application/pdf,.pdf">
  </header>
  <div class="secbar" id="secbar" hidden></div>
  <div class="main">
    <div class="readcol">
      <div id="reader"></div>
      <button id="bSel" class="selpill primary" hidden>Seçimi notlara ekle</button>
      <div class="toolbar" id="toolbar" hidden>
        <button class="tool on" data-tool="select" title="Seç ve kaydır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><span>Seç</span></button>
        <button class="tool" data-tool="highlight" title="Fosforlu: paragrafı notlara ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-5 5v3h3l5-5"/><path d="M14.5 4.5l5 5-7 7-5-5z"/><path d="M3 22h8" stroke-width="3"/></svg><span>Fosforlu</span></button>
        <button class="tool" data-tool="pen" title="Kalem: serbest çizim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20H4v-4z"/><path d="M14 6l4 4"/></svg><span>Kalem</span></button>
        <button class="tool" data-tool="erase" title="Silgi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h12"/><path d="M3.5 14.5l9-9a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11 19H7.5z"/><path d="M8 10l6 6"/></svg><span>Silgi</span></button>
        <span class="tsep"></span>
        <button class="sw on" data-color="#d9342b" style="background:#d9342b" aria-label="Kırmızı"></button>
        <button class="sw" data-color="#2f6fde" style="background:#2f6fde" aria-label="Mavi"></button>
        <button class="sw" data-color="#1f9d55" style="background:#1f9d55" aria-label="Yeşil"></button>
        <button class="sw" data-color="#e8890c" style="background:#e8890c" aria-label="Turuncu"></button>
        <span class="tsep"></span>
        <button class="tool" id="bUndo" title="Son çizimi geri al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Geri al</span></button>
      </div>
    </div>
    <aside class="notes" id="notes">
      <div class="nhead">
        <h3>Notlar</h3>
        <button id="bFree" title="Kendi notunu yaz">+ Not</button>
        <button id="bExport" class="primary">Word’e aktar</button>
        <button id="bCloseNotes" class="nclose" aria-label="Notları kapat">✕</button>
      </div>
      <div id="notesList"></div>
    </aside>
  </div>
</div>
<canvas id="ov"></canvas>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="busy" id="busy" hidden><div class="spin"></div><div id="busyText"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const PUNCT_END = /[.!?:]["”’)\]]?$/;

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DB = {
  db: null, mem: new Map(),
  open() { return new Promise((res, rej) => { const r = indexedDB.open('makale-okuyucu', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },

function joinT(a, b) {

async function extractPdf(file, onProg) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const paras = [];
  for (let pn = 1; pn <= pdf.numPages; pn++) {
    onProg(pn, pdf.numPages);
    const page = await pdf.getPage(pn);
    const tc = await page.getTextContent();
    const lines = []; let cur = null;
    const push = () => { if (cur && cur.text.trim()) lines.push(cur); cur = null; };
    for (const it of tc.items) {
      if (typeof it.str !== 'string') continue;
      const tf = it.transform, x = tf[4], y = tf[5];
      const h = Math.hypot(tf[2], tf[3]) || it.height || 10;
      if (it.str.length) {
        if (cur && Math.abs(y - cur.y) > Math.max(h, cur.h) * 0.5) push();
        if (!cur) cur = { text: '', x, y, h, xEnd: x };
        if (cur.text && !/\s$/.test(cur.text) && !/^\s/.test(it.str) && x - cur.xEnd > h * 0.15) cur.text += ' ';
        cur.text += it.str;
        cur.xEnd = Math.max(cur.xEnd, x + (it.width || 0));
        cur.x = Math.min(cur.x, x);
        if (h > cur.h) cur.h = h;
      }
      if (it.hasEOL) push();
    }
    push();
    const gaps = [];
    for (let i = 1; i < lines.length; i++) { const g = lines[i - 1].y - lines[i].y; if (g > 0 && g < lines[i].h * 2.5) gaps.push(g); }
    gaps.sort((a, b) => a - b);

    const ws = lines.map(l => l.xEnd - l.x).sort((a, b) => a - b);
    const wide = ws.length ? ws[Math.floor(ws.length * 0.85)] : 400;
    const pageParas = []; let para = null, prev = null;
    for (const L of lines) {
      const t = L.text.replace(/\s+/g, ' ').trim(); if (!t) continue;
      let brk = !para;
      if (!brk) {
        const g = prev.y - L.y;
        if (Math.abs(L.h - prev.h) > Math.max(L.h, prev.h) * 0.18) brk = true;
        else if (g > med * 1.45) brk = true;
        else if ((prev.xEnd - prev.x) < wide * 0.72 && PUNCT_END.test(prev.text.trim())) brk = true;
      }
      if (brk) { if (para) pageParas.push(para); para = { t, pg: pn }; }
      else para.t = joinT(para.t, t);

    }
    if (para) pageParas.push(para);

function parseJSON(txt) {
  let s = String(txt).replace(/```json|```/g, '').trim();
  try { return JSON.parse(s); } catch {}
  const a = s.indexOf('['), o = s.indexOf('{');
  const start = (a >= 0 && (o < 0 || a < o)) ? a : o;
  const end = Math.max(s.lastIndexOf(']'), s.lastIndexOf('}'));
  if (start >= 0 && end > start) return JSON.parse(s.slice(start, end + 1));
  throw new Error('Gemini yanıtı okunamadı.');
}
async function gemini(prompt, { json = true, temperature = 0.2 } = {}) {
  const key = String(S.settings.key || '').trim(); if (!key) throw new Error('NOKEY');
  const model = String(S.settings.model || '').trim() || 'gemini-2.5-flash';
  const gc = { temperature };
  if (json) gc.responseMimeType = 'application/json';
  if (/2\.5-flash/.test(model)) gc.thinkingConfig = { thinkingBudget: 0 };
  let last = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: gc })
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 429 || r.status === 503 || r.status === 500) {
      last = new Error((data.error && data.error.message) || ('HTTP ' + r.status + ' RESOURCE_EXHAUSTED'));
      await sleep(5000 * (attempt + 1)); continue;
    }
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    const c = data.candidates && data.candidates[0];
    const txt = ((c && c.content && c.content.parts) || []).map(p => p.text || '').join('');
    if (!txt) throw new Error('Gemini boş yanıt döndürdü' + (c && c.finishReason ? ` (${c.finishReason})` : '') + '.');
    return json ? parseJSON(txt) : txt;
  }
  throw last || new Error('Gemini yanıt vermedi.');
}
function errMsg(e) {
  const m = String((e && e.message) || e);
  if (m === 'NOKEY') return 'Gemini API anahtarı eklenmemiş. Ayarlar’dan ekle.';
  if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return 'API anahtarı geçersiz. Ayarlar’dan kontrol et.';
  if (/429|quota|RESOURCE_EXHAUSTED|rate/i.test(m)) return 'Ücretsiz kullanım sınırına ulaşıldı. Bir dakika bekleyip tekrar dene.';
  if (/not found|is not supported|404/i.test(m)) return 'Model bulunamadı. Ayarlar’dan başka bir model seç.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol et.';
  return 'Hata: ' + m;
}

const TOOL_HINTS = {

  pen: 'Kalem: Metnin üstüne çiz. Parmağınla kaydırmaya devam edebilirsin.',

};

  R.classList.toggle('tooling', t !== 'select');

let drawing = null, raf = 0;
const inkPointer = e => e.pointerType === 'pen' || e.pointerType === 'mouse';

  for (const el of $$('.blk', R)) {
    const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) continue;
    const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
    const dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
    const d = dy * 3 + dx; if (d < bd) { bd = d; best = el; }
  }

}
function stopStylusTouch(e) {
  if (S.tool === 'select' || !curPaper()) return;
  if (e.target.closest && e.target.closest('button,label,input,textarea')) return;
  for (const t of e.touches) if (t.touchType === 'stylus') { e.preventDefault(); return; }
}
R.addEventListener('touchstart', stopStylusTouch, { passive: false });
R.addEventListener('touchmove', stopStylusTouch, { passive: false });

function sched() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawOv(); }); }
function drawOv() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  if (!drawing) return;
  const P = drawing.pts;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (drawing.tool === 'erase') {
    const [x, y] = P[P.length - 1];
    ctx.strokeStyle = 'rgba(120,130,150,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke(); return;
  }
  if (drawing.tool === 'highlight') { ctx.strokeStyle = 'rgba(255,205,0,.4)'; ctx.lineWidth = 22; }
  else { ctx.strokeStyle = S.color; ctx.lineWidth = 2.6; }

  } else if (drawing.tool === 'erase') eraseAt(x, y);
}
R.addEventListener('pointerdown', e => {
  if (S.tool === 'select' || !inkPointer(e) || !curPaper()) return;
  if (e.target.closest('button,a,input,textarea,label')) return;

});

  return out;
}

function finish(e) {

  const p = curPaper(); if (!p) return;
  if (d.tool === 'highlight') {
    const [x0, y0] = d.pts[0]; const moved = d.pts.some(([x, y]) => Math.hypot(x - x0, y - y0) > 14);
    const blks = [...d.touched]; blks.forEach(b => b.classList.remove('hl-live'));
    if (!moved || !blks.length) return;
    blks.sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
    let added = 0; for (const b of blks) if (addNoteFromBlk(p, b)) added++;
    if (added) { saveNotes(); renderNotes(); refreshNoted(); renderHeader(); pulseNotes(); toast(added === 1 ? 'Paragraf notlara eklendi.' : `${added} paragraf notlara eklendi.`); }

    const b = d.start || nearestBlk(d.pts[0][0], d.pts[0][1]); if (!b || !b.isConnected) return;
    const r = b.getBoundingClientRect(); if (!r.width || !r.height) return;
    const key = b.dataset.p + ':' + b.dataset.l;
    const stroke = { c: S.color, w: 2.6, pts: simplify(d.pts).map(([x, y]) => [+((x - r.left) / r.width).toFixed(4), +((y - r.top) / r.height).toFixed(4)]) };

R.addEventListener('pointerup', finish);
R.addEventListener('pointercancel', finish);
function eraseAt(x, y) {

    const key = b.dataset.p + ':' + b.dataset.l; const arr = p.strokes[key]; if (!arr || !arr.length) continue;
    const r = b.getBoundingClientRect(); if (y < r.top - 120 || y > r.bottom + 120) continue;
    for (let k = arr.length - 1; k >= 0; k--) {

  const p = S.papers[u.pid]; if (!p) return;
  const arr = p.strokes[u.key] = p.strokes[u.key] || [];
  if (u.type === 'add') { const k = arr.indexOf(u.stroke); if (k >= 0) arr.splice(k, 1); } else arr.push(u.stroke);
  savePaper(p, 300);
  const [pi, l] = u.key.split(':');
  const b = R.querySelector(`.blk[data-p="${pi}"][data-l="${l}"]`); if (b) drawInk(b, p);
}

$('#file').addEventListener('change', async e => {

    let res = null;

  });

  modal(`<h3>Künye</h3>
    <p class="hint">${fresh ? 'Gemini’nin bulduğu bilgileri kontrol et. ' : ''}Kaynakça bu bilgilerle APA 7’ye göre yazılır. Her satıra bir yazar, <b>Soyadı, Adı</b> biçiminde.</p>
    <label>Yazarlar<textarea id="mAu" rows="4" autocapitalize="words" spellcheck="false">${esc(au)}</textarea></label>
    <div class="g2"><label>Yıl${inp('mYr', m.year)}</label><label>DOI${inp('mDoi', m.doi)}</label></div>
    <label>Makale başlığı<textarea id="mTi" rows="2">${esc(m.title || '')}</textarea></label>
    <label>Dergi${inp('mJo', m.journal)}</label>
    <div class="g3"><label>Cilt${inp('mVo', m.volume)}</label><label>Sayı${inp('mIs', m.issue)}</label><label>Sayfalar${inp('mPg', m.pages)}</label></div>
    <div class="preview"><div class="pl">Kaynakçada görünüşü</div><div id="mPrev"></div></div>
    <div class="mact"><button data-close>Vazgeç</button><button class="primary" id="mSave">Kaydet</button></div>`, box => {
    const read = () => ({ authors: parseAuthors($('#mAu').value), year: $('#mYr').value.trim(), doi: $('#mDoi').value.trim(), title: $('#mTi').value.trim(), journal: $('#mJo').value.trim(), volume: $('#mVo').value.trim(), issue: $('#mIs').value.trim(), pages: $('#mPg').value.trim() });
    const upd = () => { const tmp = Object.assign({}, p, { meta: read() }); $('#mPrev').innerHTML = `<p class="refp">${refHTML(tmp)}</p><p class="hint">Metin içi atıf: (${esc(inText(tmp))})</p>`; };
    box.addEventListener('input', upd); upd();
    $('#mSave').onclick = () => { p.meta = read(); savePaper(p); closeModal(); renderHeader(); renderNotes(); toast('Künye kaydedildi.'); };
  });
}
function openLib() {
  const list = Object.values(S.papers).sort((a, b) => b.added - a.added); const sm = suffixMap();
  modal(`<h3>Kütüphane</h3>${list.length ? list.map(p => {
    const c = S.notes.filter(n => n.paperId === p.id).length;
    return `<div class="libitem"><p class="refp">${refHTML(p, sm)}</p><div class="libmeta">${c} not, ${p.sections.length} bölüm</div>
      <div class="libact"><button class="primary" data-open="${p.id}">Aç</button><button data-meta="${p.id}">Künyeyi düzenle</button><button class="danger" data-delp="${p.id}">Sil</button></div></div>`;
  }).join('') : '<p class="hint">Henüz makale eklemedin.</p>'}
    <div class="mact"><label class="btn" for="file">PDF ekle</label><button data-close>Kapat</button></div>`, box => {
    box.addEventListener('click', e => {
      const o = e.target.closest('[data-open]'), m = e.target.closest('[data-meta]'), d = e.target.closest('[data-delp]');
      if (o) { closeModal(); S.view = 'orig'; openPaper(o.dataset.open); }
      else if (m) openMeta(m.dataset.meta);
      else if (d) {
        const id = d.dataset.delp; const c = S.notes.filter(n => n.paperId === id).length;
        if (!confirm(c ? `Bu makale ve ondan aldığın ${c} not silinecek. Emin misin?` : 'Bu makale silinecek. Emin misin?')) return;
        delete S.papers[id]; DB.del('paper:' + id); S.notes = S.notes.filter(n => n.paperId !== id); saveNotes();
        if (S.cur === id) { S.cur = null; LS.set('mo:last', null); }
        renderAll(); openLib();
      }
    });
  });
}
function openSettings() {
  let style = S.settings.style;
  modal(`<h3>Ayarlar</h3>
    <label>Gemini API anahtarı<div class="row"><input id="sKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…" value="${esc(S.settings.key)}"><button id="sShow">Göster</button></div></label>
    <p class="hint">Anahtar yalnızca bu cihazda saklanır ve sadece Google’a gönderilir.</p>
    <label>Model<input id="sModel" list="mdl" autocapitalize="off" spellcheck="false" value="${esc(S.settings.model)}"></label>
    <datalist id="mdl"><option value="gemini-2.5-flash"><option value="gemini-2.5-flash-lite"><option value="gemini-2.0-flash"></datalist>
    <p class="hint">Model hatası alırsan listeden başka bir model dene.</p>
    <div class="field"><div class="flabel">Atıf dili (APA 7)</div><div class="seg wide" id="sStyle">
      <button data-style="en" class="${style === 'en' ? 'on' : ''}">İngilizce: “&amp;”, “et al.”</button>
      <button data-style="tr" class="${style === 'tr' ? 'on' : ''}">Türkçe: “ve”, “vd.”</button></div></div>
    <div class="field"><div class="flabel">Yedek</div>
      <p class="hint">Makaleler ve notlar bu iPad’in tarayıcısında saklanır. Uygulamayı ana ekrana ekle ve ara sıra yedek al.</p>
      <div class="row"><button id="sBk">Yedeği indir</button><label class="btn" for="bkIn">Yedeği yükle</label><input type="file" id="bkIn" class="vh" accept="application/json,.json"></div></div>
    <div class="mact"><button id="sTest">Anahtarı test et</button><button class="primary" id="sSave">Kaydet</button></div>`, box => {
    $('#sShow').onclick = () => { const k = $('#sKey'); k.type = k.type === 'password' ? 'text' : 'password'; $('#sShow').textContent = k.type === 'password' ? 'Göster' : 'Gizle'; };
    $('#sStyle').onclick = e => { const b = e.target.closest('[data-style]'); if (!b) return; style = b.dataset.style; $$('#sStyle button').forEach(x => x.classList.toggle('on', x === b)); };
    const apply = () => { S.settings.key = $('#sKey').value.trim(); S.settings.model = $('#sModel').value.trim() || 'gemini-2.5-flash'; S.settings.style = style; saveSettings(); };
    $('#sTest').onclick = async () => {
      apply(); const b = $('#sTest'); b.disabled = true; b.textContent = 'Deneniyor…';
      try { await gemini('Sadece "tamam" yaz.', { json: false }); toast('Anahtar çalışıyor.'); }
      catch (e) { toast(errMsg(e), 'err'); }
      finally { b.disabled = false; b.textContent = 'Anahtarı test et'; }
    };
    $('#sSave').onclick = () => { apply(); closeModal(); renderAll(true); toast('Ayarlar kaydedildi.'); };
    $('#sBk').onclick = () => {
      const data = JSON.stringify({ app: 'makale-okuyucu', v: 1, papers: S.papers, notes: S.notes, style: S.settings.style });
      downloadBlob(new Blob([data], { type: 'application/json' }), `makale-okuyucu-yedek-${new Date().toISOString().slice(0, 10)}.json`);
    };
    $('#bkIn').onchange = async ev => {
      const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
      try {
        const d = JSON.parse(await f.text()); if (!d || d.app !== 'makale-okuyucu') throw new Error('Bu dosya bir Makale Okuyucu yedeği değil.');
        if (!confirm('Yedekteki makaleler ve notlar mevcut verilerine eklenecek. Devam edilsin mi?')) return;
        for (const p of Object.values(d.papers || {})) { S.papers[p.id] = p; await DB.set('paper:' + p.id, p); }
        const ids = new Set(S.notes.map(n => n.id)); for (const n of (d.notes || [])) if (!ids.has(n.id)) S.notes.push(n);
        saveNotes(); closeModal(); renderAll(); toast('Yedek yüklendi.');
      } catch (e) { toast(errMsg(e), 'err'); }
    };
  });
}

/* ---------- Word export ---------- */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function buildDocx() {
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const X = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const run = (t, o = {}) => {
    const rp = (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '') + (o.color ? `<w:color w:val="${o.color}"/>` : '') + (o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : '');
    return `<w:r>${rp ? `<w:rPr>${rp}</w:rPr>` : ''}<w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  };
  const textRuns = t => String(t).split(/\n/).map((ln, k) => (k ? '<w:r><w:br/></w:r>' : '') + run(ln)).join('');
  const para = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 160}" w:line="${o.line || 360}" w:lineRule="auto"/>${o.ind || ''}${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}</w:pPr>${runs}</w:p>`;
  const sm = suffixMap();
  let body = para(run('Notlarım', { b: true, sz: 32 }), { jc: 'center', after: 80 });
  body += para(run(new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }), { color: '666666', sz: 20 }), { jc: 'center', after: 360 });
  S.notes.forEach((n, k) => {
    body += para(run(`${k + 1}.`) + '<w:r><w:tab/></w:r>' + textRuns(noteWithCite(n, sm)), { ind: '<w:ind w:left="425" w:hanging="425"/>', after: 200 });
  });
  const refs = citedPapers();
  if (refs.length) {
    body += para(run('Kaynakça', { b: true }), { jc: 'center', before: 480, after: 240, keep: true });
    for (const p of refs) body += para(refParts(p, sm).map(([t, i]) => run(t, { i })).join(''), { ind: '<w:ind w:left="720" w:hanging="720"/>', line: 480, after: 0 });
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const zip = new JSZip();
  zip.file('[Content_Types].xml', types); zip.file('_rels/.rels', rels);
  zip.file('word/document.xml', doc); zip.file('word/styles.xml', styles); zip.file('word/_rels/document.xml.rels', docRels);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
function openExport() {
  if (!S.notes.some(n => String(n.text || '').trim())) { toast('Önce birkaç not ekle.'); return; }
  if (!window.JSZip) { toast('Word oluşturucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  const sm = suffixMap(); const refs = citedPapers();
  const def = 'Notlarim-' + new Date().toISOString().slice(0, 10);
  modal(`<h3>Word’e aktar</h3><p class="hint">Notların sırasıyla, APA 7 metin içi atıflarıyla yazılır. Kaynakça en sonda alfabetik sıradadır.</p>
    <div class="docprev"><h4>Notlarım</h4>${S.notes.filter(n => String(n.text || '').trim()).map((n, k) => `<p class="n">${k + 1}. ${esc(noteWithCite(n, sm))}</p>`).join('')}
    ${refs.length ? `<h4 style="margin-top:22px">Kaynakça</h4>${refs.map(p => `<p class="refp">${refHTML(p, sm)}</p>`).join('')}` : ''}</div>
    <label>Dosya adı<input id="xName" value="${esc(def)}" autocapitalize="off" spellcheck="false"></label>
    <div class="mact"><button data-close>Kapat</button><button id="xShare">Paylaş</button><button class="primary" id="xDl">İndir (.docx)</button></div>`, () => {
    const saved = S.notes; let blob = null;
    S.notes = saved.filter(n => String(n.text || '').trim());
    const ready = buildDocx().then(b => { blob = b; return b; }).finally(() => { S.notes = saved; });
    const fname = () => ($('#xName').value.trim() || def).replace(/[\\/:*?"<>|]+/g, '-') + '.docx';
    $('#xDl').onclick = async () => { const b = blob || await ready; downloadBlob(b, fname()); toast('Word dosyası indirildi.'); };
    $('#xShare').onclick = async () => {
      const b = blob || await ready;
      const file = new File([b], fname(), { type: b.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: fname() }); } catch (e) { if (e.name !== 'AbortError') toast('Paylaşılamadı. İndir düğmesini kullan.', 'err'); }
      } else { downloadBlob(b, fname()); toast('Paylaşım desteklenmiyor, dosya indirildi.'); }
    };
  });
}

/* ---------- init ---------- */
async function init() {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  try {
    await DB.open();
    for (const k of await DB.keys()) {
      if (String(k).startsWith('paper:')) { const p = await DB.get(k); if (p && p.id) { p.strokes = p.strokes || {}; p.tr = p.tr || {}; S.papers[p.id] = p; } }
    }
    S.notes = (await DB.get('notes')) || [];
  } catch (e) {
    DB.db = null; toast('Tarayıcı depolaması kullanılamıyor. Veriler kaydedilmeyecek.', 'err');
  }
  if (innerWidth > 1050) document.body.classList.add('notes-open');
  resizeOv();
  const last = LS.get('mo:last', null);
  if (last && S.papers[last]) openPaper(last); else renderAll();
}
init();
})();
</script>
