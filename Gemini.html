<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Makale Okuyucu">
<title>Makale Okuyucu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f7f7f4;--surface:#ffffff;--surface2:#eef0f2;--ink:#1b2230;--muted:#5d6675;--line:#dfe2e7;
  --accent:#2b4c8c;--accent-soft:#e6ecf7;--on-accent:#ffffff;
  --hl:rgba(255,222,60,.55);--trbg:#f1f5fb;--trbar:#8aa6d8;--danger:#b3261e;
  --shadow:0 12px 32px rgba(20,30,50,.14);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b;--surface:#1a1e26;--surface2:#232834;--ink:#e6e9ef;--muted:#98a1b0;--line:#2c323e;
  --accent:#8fb0f0;--accent-soft:#1f2a40;--on-accent:#0d1424;
  --hl:rgba(255,215,60,.26);--trbg:#182030;--trbar:#4f6fa8;--danger:#f2857b;
  --shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;-webkit-tap-highlight-color:transparent;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#app{height:100%;display:flex;flex-direction:column}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:18px;flex:none}
.pname{border:0;background:none;padding:0;min-height:0;display:block;text-align:left;min-width:0;max-width:100%}
.pname b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:8px;flex:none}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;min-width:22px;text-align:center}

/* Section bar */
.secbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.secbar[hidden]{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 380px;min-width:0;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;min-height:38px;padding:6px 15px;background:var(--surface2);border-color:transparent}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.chip .ok{color:var(--accent);font-weight:700;margin-left:2px}
.chip.on .ok{color:inherit}
.ctrls{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;min-height:36px;padding:4px 13px;border-radius:8px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}

/* Reader */
.main{flex:1;display:flex;min-height:0;position:relative}
.readcol{flex:1;min-width:0;position:relative;display:flex}
#reader{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:30px 28px 150px}
.article{max-width:720px;margin:0 auto}
.sec-head{margin:0 0 24px}
.sec-head .orig{color:var(--muted);font-size:14px;font-style:italic;font-family:var(--serif)}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.2;margin:2px 0 0}
.notice{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.para{margin:0 0 16px}
.blk{position:relative;margin:0 -14px;padding:6px 44px 6px 14px;border-radius:6px;font-family:var(--serif);font-size:19px;line-height:1.66;transition:background-color .25s}
.blk p{margin:0;-webkit-hyphens:auto;hyphens:auto}
.blk.tr{background:var(--trbg);box-shadow:inset 3px 0 0 var(--trbar);margin-top:6px}
.blk.skipped{opacity:.5;font-size:15px}
.blk.noted,.blk.hl-live{background:var(--hl)}
.blk.tr.noted{box-shadow:inset 3px 0 0 var(--trbar)}
.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.addn{position:absolute;right:6px;top:6px;width:32px;height:32px;min-height:0;padding:0;border-radius:50%;font-size:18px;line-height:1;opacity:.5}
.noted .addn{opacity:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
svg.ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#reader.tooling .blk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.showskip{margin:18px 0 0;color:var(--muted);background:transparent}

/* Empty state */
.empty{max-width:560px;margin:6vh auto 0;text-align:left}
.empty h2{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.15;margin:0 0 10px}
.empty p.lead{color:var(--muted);font-size:17px;margin:0 0 24px}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.big{min-height:52px;padding:10px 22px;font-size:16px}
.steps{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.steps li span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}

/* Toolbar */
.toolbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:20px;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
.toolbar[hidden]{display:none}
.tool{flex-direction:column;gap:1px;min-width:60px;min-height:54px;padding:4px 8px;border:0;background:transparent;font-size:11.5px;border-radius:14px}
.tool svg{width:23px;height:23px}
.tool.on{background:var(--accent);color:var(--on-accent)}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--surface);margin:0 2px}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.tsep{width:1px;height:32px;background:var(--line);margin:0 5px}
.selpill{position:absolute;left:50%;transform:translateX(-50%);bottom:94px;z-index:21;box-shadow:var(--shadow)}
.selpill[hidden]{display:none}

/* Notes */
.notes{width:390px;flex:none;border-left:1px solid var(--line);background:var(--bg);display:none;flex-direction:column;min-height:0}
body.notes-open .notes{display:flex}
.nhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.nhead h3{margin:0;flex:1;font-family:var(--serif);font-size:20px;font-weight:600}
#notesList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px}
.note-top{display:flex;align-items:center;gap:8px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.src{flex:1;min-width:0;border:0;background:none;padding:0;min-height:30px;justify-content:flex-start;color:var(--accent);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.src.free{color:var(--muted)}
.nact button{min-height:32px;width:32px;padding:0;border:0;background:transparent;color:var(--muted)}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;font-family:var(--serif);font-size:16px;line-height:1.55;padding:6px 0 0;outline:none;overflow:hidden;min-height:48px}
.cite{color:var(--muted);font-size:13px;margin-top:4px}
.empty-notes{color:var(--muted);text-align:center;padding:30px 10px;font-size:14.5px}
.empty-notes b{color:var(--ink)}
.nclose{display:none}
@media (max-width:1050px){
  .notes{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);display:flex;transform:translateX(105%);transition:transform .28s ease;z-index:30;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.notes-open .notes{transform:none}
  .nclose{display:inline-flex}
}
@media (max-width:640px){
  .tool span{display:none}.tool{min-width:44px}
  .hbtns .lbl{display:none}
  #reader{padding:22px 18px 140px}
  .blk{font-size:18px}
}

/* Overlay canvas, modal, busy, toast */
#ov{position:fixed;left:0;top:0;pointer-events:none;z-index:16}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(620px,100%);padding:22px;margin:auto 0}
.mbox h3{margin:0 0 6px;font-family:var(--serif);font-size:24px;font-weight:600}
.mbox label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 0}
.mbox label.btn{display:inline-flex;margin:0;font-size:15px;font-weight:400}
.mbox label.btn.primary{font-weight:600}
.mbox label .row button{font-weight:400;font-size:15px}
.mbox input,.mbox textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;font-size:16px}
.mbox textarea{resize:vertical;line-height:1.4}
.hint{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.g2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;margin-top:5px}
.row input{margin-top:0}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.preview{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.preview .pl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.refp{font-family:var(--serif);padding-left:2em;text-indent:-2em;margin:4px 0;line-height:1.5}
.field{margin-top:16px}
.flabel{font-weight:600;font-size:13.5px;margin-bottom:6px}
.seg.wide{display:flex}.seg.wide button{flex:1;white-space:normal}
.libitem{border-top:1px solid var(--line);padding:14px 0}
.libitem:first-of-type{border-top:0}
.libmeta{color:var(--muted);font-size:13px;margin:4px 0 8px}
.libact{display:flex;gap:8px;flex-wrap:wrap}
.docprev{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg);font-family:"Times New Roman",var(--serif);font-size:15px;line-height:1.55;margin-top:12px}
.docprev h4{text-align:center;margin:6px 0 12px;font-size:16px}
.docprev .n{padding-left:1.6em;text-indent:-1.6em;margin:0 0 10px}
.busy{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font-weight:600;text-align:center;padding:20px}
.busy[hidden]{display:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;max-width:min(560px,92vw);display:flex;align-items:center;gap:12px;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
.toast button{min-height:34px;background:transparent;color:inherit;border-color:currentColor}

/* Categories */
.catbar{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none;flex:none}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{min-height:34px;padding:4px 12px;font-size:13.5px;flex:none}
.catbar .chip small{opacity:.65;margin-left:3px;font-weight:600;font-size:12px}
.catbar .chip.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.nfoot{display:flex;align-items:center;gap:8px;margin-top:6px}
.nfoot .cite{flex:1;min-width:0;margin:0}
.cattag{border:0;background:var(--surface2);border-radius:999px;min-height:28px;padding:2px 11px;font-size:12px;font-weight:600;color:var(--muted);flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
.picklist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.picklist button{justify-content:space-between;min-height:54px;padding:10px 16px;font-size:16.5px;text-align:left;white-space:normal}
.picklist button small{color:var(--muted);font-size:13px;font-weight:600;flex:none}
.picklist button.last{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.picklist button:disabled{opacity:1;background:var(--surface2)}
.picklist button:disabled small{color:var(--accent)}
.newcat{display:flex;gap:8px;margin-top:12px}
.mbox .newcat input{margin-top:0}

/* Archive & settings extras */
.mbox select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;font-size:16px;min-height:46px}
.row select{margin-top:0}
.row.wrap{flex-wrap:wrap}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw:empty{display:none}
.kw button{min-height:30px;padding:2px 11px;border-radius:999px;font-size:13px;background:var(--accent-soft);color:var(--accent);border:0;white-space:normal;text-align:left}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;margin:12px 0}
.status button{min-height:36px;padding:4px 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:#1f9d55}
.mbox .check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-weight:600;font-size:14.5px}
.mbox .check input{display:inline-block;width:22px;height:22px;margin:0;flex:none}
.mbox input[type=search]{margin-top:14px}
.count{color:var(--muted);font-size:13px;margin:10px 0 0}
details.setup{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.setup summary{cursor:pointer;font-weight:600;font-size:14px}
details.setup ol{padding-left:20px;margin:10px 0 0;font-size:14px;line-height:1.5}
details.setup li{margin-bottom:6px}
.code{display:block;font-size:13px;word-break:break-all;background:var(--surface2);padding:8px 10px;border-radius:8px;margin-top:6px;font-family:ui-monospace,Menlo,monospace}
.warn{color:var(--danger)}
.fbar{display:flex;gap:6px;overflow-x:auto;margin:2px 0 12px;padding:2px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar .chip{flex:none;min-height:38px;padding:4px 14px;font-size:14px}
.fbar .chip small{opacity:.65;margin-left:4px;font-weight:600;font-size:12px}
.fbar .chip.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.aitem{border-top:1px solid var(--line);padding:14px 0}
.aitem:first-child{border-top:0}
.aname{border:0;background:none;padding:0;min-height:0;display:flex;gap:12px;align-items:flex-start;justify-content:flex-start;text-align:left;white-space:normal;width:100%;border-radius:8px}
.aname b{display:block;font-weight:600;font-size:15.5px;line-height:1.35;word-break:break-word}
.aname small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
.ficon{flex:none;width:34px;height:42px;border-radius:5px 12px 5px 5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.02em}
.ficon.none{background:var(--surface2);color:var(--muted)}
.aitem .kw{margin:8px 0 8px 46px}
.aitem > .libact{margin-left:46px}
.kw button.hit{background:var(--accent);color:var(--on-accent)}
.adet{margin:12px 0 0 46px;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.adet .refp{margin:0 0 10px}
.picklist label.btn{justify-content:flex-start;min-height:54px;padding:10px 16px;font-size:16.5px}
@media (max-width:640px){.aitem .kw,.aitem > .libact,.adet{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">M</div>
      <button class="pname" id="pname"><b>Makale Okuyucu</b><small>Makale seçilmedi</small></button>
    </div>
    <div class="hbtns">
      <button id="bLib" title="Kütüphane"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7"/></svg><span class="lbl">Kütüphane</span></button>
      <button id="bArc" title="Arşiv"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/></svg><span class="lbl">Arşiv</span></button>
      <label class="btn primary" for="file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">PDF ekle</span></label>
      <button id="bNotes"><span class="lbl">Notlar</span><span class="badge" id="noteCount">0</span></button>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const PUNCT_END = /[.!?:]["”’)\]]?$/;

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DB = {
  db: null, mem: new Map(),
  open() { return new Promise((res, rej) => { const r = indexedDB.open('makale-okuyucu', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(mode) { return this.db.transaction('kv', mode).objectStore('kv'); },
  get(k) { if (!this.db) return Promise.resolve(this.mem.get(k)); return new Promise((res, rej) => { const q = this.tx('readonly').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { if (!this.db) { this.mem.set(k, v); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  del(k) { if (!this.db) { this.mem.delete(k); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  keys() { if (!this.db) return Promise.resolve([...this.mem.keys()]); return new Promise((res, rej) => { const q = this.tx('readonly').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};

const S = {
  settings: Object.assign({ key: '', model: 'gemini-2.5-flash', style: 'en', clientId: '' }, LS.get('mo:settings', {})),
  cats: [], catView: LS.get('mo:catView', 'all'), pendingFiles: {}, attachFor: null,
  arcFolder: LS.get('mo:arcFolder', 'all'), arcTarget: null,
  papers: {}, notes: [], cur: null, sec: 0, view: 'orig', tool: 'select', color: '#d9342b',
  undo: [], translating: false, trText: '', showSkipped: false, hinted: {}
};
const curPaper = () => S.papers[S.cur] || null;

const timers = {};
function savePaper(p, delay = 0) {
  clearTimeout(timers[p.id]);
  timers[p.id] = setTimeout(() => { DB.set('paper:' + p.id, p).catch(() => toast('Kaydedilemedi. Depolama dolu olabilir.', 'err')); }, delay);
}

  clearTimeout(timers.notes);
  timers.notes = setTimeout(() => { DB.set('notes', S.notes).catch(() => toast('Notlar kaydedilemedi.', 'err')); }, 250);
}
function saveSettings() { LS.set('mo:settings', S.settings); }
function saveCats() { DB.set('cats', S.cats).catch(() => toast('Kategoriler kaydedilemedi.', 'err')); }
async function flushSaves() {
  clearTimeout(timers.notes);
  const jobs = [DB.set('notes', S.notes), DB.set('cats', S.cats), DB.set('archive', ARC.items)];
  const p = curPaper(); if (p) { clearTimeout(timers[p.id]); jobs.push(DB.set('paper:' + p.id, p)); }
  await Promise.all(jobs).catch(() => {});
}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg, type = '', action = null) {
  const T = $('#toast');
  T.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  T.className = 'toast show ' + type;
  if (action) T.querySelector('button').onclick = () => { action.fn(); T.className = 'toast'; };
  clearTimeout(toastT);
  toastT = setTimeout(() => { T.className = 'toast'; }, action ? 6500 : (type === 'err' ? 5500 : 3000));
}
function busy(text) {
  const B = $('#busy');
  if (text === false) { B.hidden = true; return; }
  $('#busyText').textContent = text; B.hidden = false;
}
function modal(html, onMount) {
  const old = $('#mbox'); const box = old.cloneNode(false); old.replaceWith(box);
  box.innerHTML = html; $('#modal').hidden = false; if (onMount) onMount(box);
}
function closeModal() { $('#modal').hidden = true; $('#mbox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });

/* ---------- APA 7 ---------- */
const authorsOf = p => ((p.meta && p.meta.authors) || []).filter(a => a && (a.family || a.given));
function initials(given) {
  return String(given || '').trim().split(/\s+/).filter(Boolean).map(w =>
    w.split('-').map(part => { const c = part.replace(/[^\p{L}]/gu, '')[0]; return c ? c.toUpperCase() + '.' : ''; }).filter(Boolean).join('-')
  ).filter(Boolean).join(' ');
}
function suffixMap(notes = S.notes) {
  const groups = {};
  const ids = new Set(notes.map(n => n.paperId).filter(id => id && S.papers[id]));
  for (const id of ids) {
    const p = S.papers[id]; const A = authorsOf(p); if (!A.length) continue;
    const k = A.map(a => (a.family + '|' + initials(a.given)).toLocaleLowerCase('tr')).join(';') + '#' + String(p.meta.year || '').trim();
    (groups[k] = groups[k] || []).push(p);
  }
  const m = {};
  for (const g of Object.values(groups)) if (g.length > 1) {
    g.sort((a, b) => String(a.meta.title || '').localeCompare(String(b.meta.title || ''), 'tr'));
    g.forEach((p, i) => { m[p.id] = String.fromCharCode(97 + i); });
  }
  return m;
}
function yearLabel(p, sm) {
  const y = String((p.meta && p.meta.year) || '').trim() || (S.settings.style === 'tr' ? 't.y.' : 'n.d.');
  const suf = (sm || suffixMap())[p.id] || '';
  return y + (suf ? (/^\d/.test(y) ? suf : '-' + suf) : '');
}
function shortTitle(p) {
  const t = String((p.meta && p.meta.title) || p.name || 'Adsız').trim();
  const w = t.split(/\s+/); return '“' + (w.length > 4 ? w.slice(0, 4).join(' ') + '…' : t) + '”';
}
function inTextAuthors(p) {
  const A = authorsOf(p), tr = S.settings.style === 'tr';
  if (!A.length) return shortTitle(p);
  const f = a => a.family || a.given;
  if (A.length === 1) return f(A[0]);
  if (A.length === 2) return `${f(A[0])} ${tr ? 've' : '&'} ${f(A[1])}`;
  return `${f(A[0])} ${tr ? 'vd.' : 'et al.'}`;
}
const inText = (p, sm) => `${inTextAuthors(p)}, ${yearLabel(p, sm)}`;
function refAuthors(p) {
  const A = authorsOf(p).map(a => a.given && a.family ? `${a.family}, ${initials(a.given)}` : (a.family || a.given));
  const amp = S.settings.style === 'tr' ? 've' : '&';
  if (!A.length) return '';
  if (A.length === 1) return A[0];
  if (A.length <= 20) return A.slice(0, -1).join(', ') + `, ${amp} ` + A[A.length - 1];
  return A.slice(0, 19).join(', ') + ', . . . ' + A[A.length - 1];
}
const pagesFmt = s => String(s || '').trim().replace(/\s*[-‐‑–—]+\s*/g, '–');
function doiFmt(s) {
  s = String(s || '').trim(); if (!s) return '';
  const d = s.replace(/^https?:\/\/(dx\.)?doi\.org\//i, '').replace(/^doi:\s*/i, '');
  if (/^10\./.test(d)) return 'https://doi.org/' + d;
  return s;
}
function refParts(p, sm) {
  const m = p.meta || {}; const out = []; const add = (t, i = false) => { if (t) out.push([t, i]); };
  const au = refAuthors(p); const yr = `(${yearLabel(p, sm)}).`;
  let title = String(m.title || '').trim().replace(/\s+/g, ' ');
  if (title && !/[.?!]$/.test(title)) title += '.';
  if (au) { add(au + (/\.$/.test(au) ? '' : '.') + ' ' + yr + ' '); if (title) add(title + ' '); }
  else if (title) add(title + ' ' + yr + ' ');
  else add((p.name || 'Adsız') + '. ' + yr + ' ');
  const jo = String(m.journal || '').trim();
  if (jo) {
    add(jo, true);
    if (String(m.volume || '').trim()) { add(', '); add(String(m.volume).trim(), true); }
    if (String(m.issue || '').trim()) add(`(${String(m.issue).trim()})`);
    if (String(m.pages || '').trim()) add(', ' + pagesFmt(m.pages));
    add('. ');
  }
  const doi = doiFmt(m.doi); if (doi) add(doi);
  if (out.length) { const l = out[out.length - 1]; l[0] = l[0].replace(/\s+$/, ''); }
  return out;
}
const refHTML = (p, sm) => refParts(p, sm).map(([t, i]) => i ? `<i>${esc(t)}</i>` : esc(t)).join('');
const refSortKey = p => (refAuthors(p) || String(p.meta.title || p.name || '')).toLocaleLowerCase('tr');
function citedPapers(notes = S.notes) {
  const sm = suffixMap(notes);
  const ids = [...new Set(notes.filter(n => n.paperId && S.papers[n.paperId]).map(n => n.paperId))];
  return ids.map(id => S.papers[id]).sort((a, b) =>
    refSortKey(a).localeCompare(refSortKey(b), 'tr') || yearLabel(a, sm).localeCompare(yearLabel(b, sm)));
}
function noteWithCite(n, sm) {
  const p = S.papers[n.paperId]; const t = String(n.text || '').trim();
  if (!p) return t;
  const c = `(${inText(p, sm)})`;
  if (/[^.]\.$/.test(t)) return t.slice(0, -1) + ' ' + c + '.';
  return t + ' ' + c;
}

/* ---------- PDF extraction ---------- */
function joinT(a, b) {
  if (/[A-Za-zÀ-ɏ]-$/.test(a) && /^[a-zà-ɏ]/.test(b)) return a.slice(0, -1) + b;
  return a + ' ' + b;
}
async function extractPdf(file, onProg, maxPages = Infinity) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const paras = [];
  const last = Math.min(pdf.numPages, maxPages);
  for (let pn = 1; pn <= last; pn++) {
    onProg(pn, last);
    const page = await pdf.getPage(pn);
    const tc = await page.getTextContent();
    const lines = []; let cur = null;
    const push = () => { if (cur && cur.text.trim()) lines.push(cur); cur = null; };
    for (const it of tc.items) {
      if (typeof it.str !== 'string') continue;
      const tf = it.transform, x = tf[4], y = tf[5];
      const h = Math.hypot(tf[2], tf[3]) || it.height || 10;
      if (it.str.length) {
        if (cur && Math.abs(y - cur.y) > Math.max(h, cur.h) * 0.5) push();
        if (!cur) cur = { text: '', x, y, h, xEnd: x };
        if (cur.text && !/\s$/.test(cur.text) && !/^\s/.test(it.str) && x - cur.xEnd > h * 0.15) cur.text += ' ';
        cur.text += it.str;
        cur.xEnd = Math.max(cur.xEnd, x + (it.width || 0));
        cur.x = Math.min(cur.x, x);
        if (h > cur.h) cur.h = h;
      }
      if (it.hasEOL) push();
    }
    push();
    const gaps = [];
    for (let i = 1; i < lines.length; i++) { const g = lines[i - 1].y - lines[i].y; if (g > 0 && g < lines[i].h * 2.5) gaps.push(g); }
    gaps.sort((a, b) => a - b);
    const med = gaps.length ? gaps[gaps.length >> 1] : 14;
    const ws = lines.map(l => l.xEnd - l.x).sort((a, b) => a - b);
    const wide = ws.length ? ws[Math.floor(ws.length * 0.85)] : 400;
    const pageParas = []; let para = null, prev = null;
    for (const L of lines) {
      const t = L.text.replace(/\s+/g, ' ').trim(); if (!t) continue;
      let brk = !para;
      if (!brk) {
        const g = prev.y - L.y;
        if (Math.abs(L.h - prev.h) > Math.max(L.h, prev.h) * 0.18) brk = true;
        else if (g > med * 1.45) brk = true;
        else if ((prev.xEnd - prev.x) < wide * 0.72 && PUNCT_END.test(prev.text.trim())) brk = true;
      }
      if (brk) { if (para) pageParas.push(para); para = { t, pg: pn }; }
      else para.t = joinT(para.t, t);
      prev = L;
    }
    if (para) pageParas.push(para);
    if (pageParas.length && paras.length) {
      const last = paras[paras.length - 1], first = pageParas[0];
      if (!PUNCT_END.test(last.t) && /^[a-zçğıöşü]/.test(first.t)) { last.t = joinT(last.t, first.t); pageParas.shift(); }
    }
    paras.push(...pageParas);
    if (page.cleanup) page.cleanup();
  }
  const fix = s => s.replace(/ﬁ/g, 'fi').replace(/ﬂ/g, 'fl').replace(/ﬀ/g, 'ff').replace(/ﬃ/g, 'ffi').replace(/ﬄ/g, 'ffl').replace(/\u00AD/g, '').replace(/\s+/g, ' ').trim();
  return paras.map(p => ({ t: fix(p.t), pg: p.pg })).filter(p => p.t && !/^\d{1,4}$/.test(p.t));
}

/* ---------- Gemini ---------- */
function parseJSON(txt) {
  let s = String(txt).replace(/```json|```/g, '').trim();
  try { return JSON.parse(s); } catch {}
  const a = s.indexOf('['), o = s.indexOf('{');
  const start = (a >= 0 && (o < 0 || a < o)) ? a : o;
  const end = Math.max(s.lastIndexOf(']'), s.lastIndexOf('}'));
  if (start >= 0 && end > start) return JSON.parse(s.slice(start, end + 1));
  throw new Error('Gemini yanıtı okunamadı.');
}
async function gemini(prompt, { json = true, temperature = 0.2 } = {}) {
  const parts = Array.isArray(prompt) ? prompt : [{ text: prompt }];
  const key = String(S.settings.key || '').trim(); if (!key) throw new Error('NOKEY');
  const model = String(S.settings.model || '').trim() || 'gemini-2.5-flash';
  const gc = { temperature };
  if (json) gc.responseMimeType = 'application/json';
  if (/2\.5-flash/.test(model)) gc.thinkingConfig = { thinkingBudget: 0 };
  let last = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: gc })
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 429 || r.status === 503 || r.status === 500) {
      last = new Error((data.error && data.error.message) || ('HTTP ' + r.status + ' RESOURCE_EXHAUSTED'));
      await sleep(5000 * (attempt + 1)); continue;
    }
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    const c = data.candidates && data.candidates[0];
    const txt = ((c && c.content && c.content.parts) || []).map(p => p.text || '').join('');
    if (!txt) throw new Error('Gemini boş yanıt döndürdü' + (c && c.finishReason ? ` (${c.finishReason})` : '') + '.');
    return json ? parseJSON(txt) : txt;
  }
  throw last || new Error('Gemini yanıt vermedi.');
}
function errMsg(e) {
  const m = String((e && e.message) || e);
  if (m === 'NOKEY') return 'Gemini API anahtarı eklenmemiş. Ayarlar’dan ekle.';
  if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return 'API anahtarı geçersiz. Ayarlar’dan kontrol et.';
  if (/429|quota|RESOURCE_EXHAUSTED|rate/i.test(m)) return 'Ücretsiz kullanım sınırına ulaşıldı. Bir dakika bekleyip tekrar dene.';
  if (m === 'DRIVE_AUTH') return 'Drive oturumu sona erdi. Arşiv’den ya da Ayarlar’dan tekrar bağlan.';
  if (/^Drive/.test(m)) return m.replace(/^Drive: /, 'Drive hatası: ');
  if (/not found|is not supported|404/i.test(m)) return 'Model bulunamadı. Ayarlar’dan başka bir model seç.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol et.';
  return 'Hata: ' + m;
}

/* ---------- model list ---------- */
const DEFAULT_MODELS = [{ id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash' }, { id: 'gemini-2.5-flash-lite', label: 'Gemini 2.5 Flash-Lite' }];
async function listModels(key) {
  const all = []; let tok = '';
  do {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''), { headers: { 'x-goog-api-key': key } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
    all.push(...(d.models || [])); tok = d.nextPageToken || '';
  } while (tok);
  const notText = /embedding|imagen|veo|tts|image|audio|aqa|live|robotics|computer-use|lyria/i;
  const gem = id => /^gemini/.test(id) ? 1 : 0;
  return all.filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && !notText.test(m.name || ''))
    .map(m => ({ id: String(m.name).replace(/^models\//, ''), label: m.displayName || String(m.name).replace(/^models\//, '') }))
    .sort((a, b) => (gem(b.id) - gem(a.id)) || b.id.localeCompare(a.id, 'en', { numeric: true }));
}

const str = v => String(v ?? '').trim();
function normMeta(m) {

    authors: Array.isArray(m.authors) ? m.authors.filter(a => a && (a.family || a.given)).map(a => ({ family: str(a.family), given: str(a.given) })) : [],

function normKw(k) {

  const seen = new Set();
  return arr.filter(x => { const f = x.toLocaleLowerCase('tr'); if (seen.has(f)) return false; seen.add(f); return true; }).slice(0, 25);
}
const META_JSON = '{"meta":{"authors":[{"family":"Soyadı","given":"Adı"}],"year":"","title":"","journal":"","volume":"","issue":"","pages":"","doi":""},"keywords":["..."]}';
const KW_RULE = 'Anahtar kelimeler: Yayında "Keywords" ya da "Anahtar kelimeler" listesi varsa onu aynen al; yoksa yayının dilinde 5-8 anahtar kelime öner.';
function metaPrompt(src) {
  return `Aşağıda bir akademik yayının ${src}. Görevin APA 7 kaynakçası için künye bilgilerini ve anahtar kelimeleri çıkarmak.
Kurallar: Yazar adlarını yayındaki gibi tam yaz. Başlığı özgün dilinde ve büyük-küçük harf düzenini koruyarak yaz. pages "45-60" biçiminde, doi yalnızca "10." ile başlayan kısım olsun. Bilinmeyen alanları boş bırak.
${KW_RULE}
Yalnızca şu yapıda JSON döndür:
${META_JSON}`;
}
function toB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Dosya okunamadı.')); r.readAsDataURL(file); });
}
async function metaFromPdf(f, onStage) {
  let paras = [];
  try { paras = await extractPdf(f, () => {}, 3); } catch {}
  const text = paras.map(x => x.t).join('\n').slice(0, 14000);
  let res;
  if (text.length >= 300) res = await gemini(metaPrompt('ilk sayfalarından çıkarılmış metin var') + '\n\nMETİN:\n' + text);
  else {
    if (f.size > 18 * 1024 * 1024) throw new Error('Bu PDF taranmış görünüyor ve Gemini’ye gönderilemeyecek kadar büyük.');
    if (onStage) onStage('Taranmış PDF, Gemini sayfaları okuyor…');
    res = await gemini([{ inlineData: { mimeType: 'application/pdf', data: await toB64(f) } }, { text: metaPrompt('PDF dosyası ekte') }]);

}
async function analyze(p) {
  const list = p.paras.map((x, i) => `[${i}] ${i < 25 ? x.t.slice(0, 1500) : x.t.slice(0, 280)}`).join('\n');
  const prompt = `Aşağıda bir akademik makalenin PDF’ten çıkarılmış, numaralandırılmış paragrafları var (uzun paragraflar kısaltıldı).
Görevlerin:
1) Makalenin künye bilgilerini çıkar (APA 7 kaynakçası için).
2) Makalenin ana bölümlerini belirle ve her bölümün başladığı paragraf numarasını ver. Bölüm başlığı ayrı bir paragrafsa bölüm o başlık paragrafından başlasın ve başlık paragrafını "skip" listesine ekle.
3) Okuma akışına ait olmayan paragrafları "skip" listesine ekle: sayfa üst/alt bilgisi, sayfa numarası, dergi adı tekrarları, telif ve lisans satırları, "Downloaded from" satırları.
Bölüm adlarını Türkçe ver (ör. "Başlık ve Künye", "Özet", "Giriş", "Kuramsal Çerçeve", "Yöntem", "Bulgular", "Tartışma", "Sonuç", "Kaynakça", "Ekler"). Alt başlıkları ayrı bölüm yapma. "original" alanına makaledeki özgün başlığı yaz.
Yalnızca şu yapıda JSON döndür:
{"meta":{"authors":[{"family":"Soyadı","given":"Adı"}],"year":"","title":"","journal":"","volume":"","issue":"","pages":"","doi":""},"keywords":["..."],"sections":[{"title":"Özet","original":"Abstract","start":0}],"skip":[0]}

function applyStructure(p, res) {
  const N = p.paras.length;
  p.meta = normMeta(res && res.meta);
  p.keywords = normKw(res && res.keywords);
  let secs = (res && Array.isArray(res.sections) ? res.sections : []).map(s => ({
    title: str(s.title) || 'Bölüm', original: str(s.original), start: Math.max(0, Math.min(N - 1, parseInt(s.start, 10) || 0))
  })).sort((a, b) => a.start - b.start);
  secs = secs.filter((s, i) => i === 0 || s.start !== secs[i - 1].start);
  if (!secs.length) secs = [{ title: 'Tüm Metin', original: '', start: 0 }];
  if (secs[0].start > 0) secs.unshift({ title: 'Başlık ve Künye', original: '', start: 0 });
  secs.forEach((s, i) => { s.end = i < secs.length - 1 ? secs[i + 1].start - 1 : N - 1; });
  p.skip = (res && Array.isArray(res.skip) ? res.skip : []).map(Number).filter(n => Number.isInteger(n) && n >= 0 && n < N);
  const sk = new Set(p.skip);
  const kept = secs.filter(s => { for (let i = s.start; i <= s.end; i++) if (!sk.has(i)) return true; return false; });
  p.sections = kept.length ? kept : secs;
}
async function translateBatch(texts) {
  const prompt = `Aşağıdaki JSON dizisindeki akademik makale paragraflarını akıcı ve akademik bir Türkçeye çevir.
Kurallar: Anlamı birebir koru; özetleme, yorum veya ekleme yapma. Atıfları (ör. "Smith et al., 2020", "[12]"), sayıları, istatistikleri, formülleri ve kısaltmaları olduğu gibi bırak. Yerleşik Türkçe karşılığı olmayan teknik terimlerin yanına parantez içinde özgün terimi yaz. Paragraf zaten Türkçeyse aynen döndür.
Yalnızca girdiyle aynı uzunlukta (${texts.length} öğe) bir JSON dizisi döndür: ["...", "..."]

${JSON.stringify(texts)}`;
  const out = await gemini(prompt);
  const arr = Array.isArray(out) ? out : (out && Array.isArray(out.translations) ? out.translations : null);
  if (arr && arr.length === texts.length) return arr.map(x => String(x ?? ''));
  if (texts.length === 1) return [String((arr && arr[0]) || (typeof out === 'string' ? out : ''))];
  const res = [];
  for (const t of texts) res.push((await translateBatch([t]))[0]);
  return res;
}

function sectionParas(p, k, includeSkipped = S.showSkipped) {

async function translateCurrent() {
  const p = curPaper(); if (!p || S.translating) return;
  if (!S.settings.key) { openSettings(); toast('Önce Gemini API anahtarını ekle.'); return; }
  const todo = sectionParas(p, S.sec, false).filter(i => !p.tr[i] && p.paras[i].t.trim());
  if (!todo.length) return;
  const batches = []; let cur = [], len = 0;
  for (const i of todo) {
    const l = p.paras[i].t.length;
    if (cur.length && (len + l > 4500 || cur.length >= 18)) { batches.push(cur); cur = []; len = 0; }
    cur.push(i); len += l;

  if (cur.length) batches.push(cur);

  S.trText = `Çevriliyor 0/${todo.length}`; renderSectionBar();

const TOOL_HINTS = {
  highlight: 'Fosforlu: Kalemle paragrafın üstünden geç, sonra hangi not kategorisine ekleneceğini seç. Parmağınla kaydırabilirsin.',
  pen: 'Kalem: Metnin üstüne çiz. Parmağınla kaydırmaya devam edebilirsin.',
  erase: 'Silgi: Kalemle çizimin üstünden geç.'
};
function setTool(t) {

  R.classList.toggle('tooling', t !== 'select');

let drawing = null, raf = 0;
const inkPointer = e => e.pointerType === 'pen' || e.pointerType === 'mouse';
function blkAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('#reader .blk') : null; }
function nearestBlk(x, y) {
  const b = blkAt(x, y); if (b) return b;
  let best = null, bd = Infinity;
  for (const el of $$('.blk', R)) {
    const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) continue;
    const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
    const dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
    const d = dy * 3 + dx; if (d < bd) { bd = d; best = el; }
  }
  return best;
}
function stopStylusTouch(e) {
  if (S.tool === 'select' || !curPaper()) return;
  if (e.target.closest && e.target.closest('button,label,input,textarea')) return;
  for (const t of e.touches) if (t.touchType === 'stylus') { e.preventDefault(); return; }
}
R.addEventListener('touchstart', stopStylusTouch, { passive: false });
R.addEventListener('touchmove', stopStylusTouch, { passive: false });

function sched() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawOv(); }); }
function drawOv() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  if (!drawing) return;
  const P = drawing.pts;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (drawing.tool === 'erase') {
    const [x, y] = P[P.length - 1];
    ctx.strokeStyle = 'rgba(120,130,150,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.stroke(); return;
  }
  if (drawing.tool === 'highlight') { ctx.strokeStyle = 'rgba(255,205,0,.4)'; ctx.lineWidth = 22; }
  else { ctx.strokeStyle = S.color; ctx.lineWidth = 2.6; }
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) ctx.lineTo(P[i][0], P[i][1]);
  if (P.length === 1) ctx.lineTo(P[0][0] + 0.1, P[0][1]);
  ctx.stroke();
}
function stepTool(x, y) {
  if (drawing.tool === 'highlight') {
    const b = blkAt(x, y);
    if (b && !drawing.touched.has(b)) { drawing.touched.add(b); b.classList.add('hl-live'); }
  } else if (drawing.tool === 'erase') eraseAt(x, y);
}
R.addEventListener('pointerdown', e => {
  if (S.tool === 'select' || !inkPointer(e) || !curPaper()) return;
  if (e.target.closest('button,a,input,textarea,label')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { R.setPointerCapture(e.pointerId); } catch {}
  drawing = { id: e.pointerId, tool: S.tool, pts: [[e.clientX, e.clientY]], touched: new Set(), start: nearestBlk(e.clientX, e.clientY) };
  stepTool(e.clientX, e.clientY); sched();
});
R.addEventListener('pointermove', e => {
  if (!drawing || e.pointerId !== drawing.id) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (evs.length ? evs : [e])) { drawing.pts.push([ev.clientX, ev.clientY]); if (drawing.tool === 'highlight') stepTool(ev.clientX, ev.clientY); }

});
function simplify(pts) {
  const out = [pts[0]];
  for (const q of pts.slice(1)) { const l = out[out.length - 1]; if (Math.hypot(q[0] - l[0], q[1] - l[1]) >= 1.5) out.push(q); }
  return out;
}
function drawInk(b, p) { const svg = b.querySelector('svg.ink'); if (svg) svg.innerHTML = inkPaths(p, b.dataset.p + ':' + b.dataset.l); }
function finish(e) {
  if (!drawing || e.pointerId !== drawing.id) return;
  const d = drawing; drawing = null; cancelAnimationFrame(raf); raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight);
  const p = curPaper(); if (!p) return;
  if (d.tool === 'highlight') {
    const [x0, y0] = d.pts[0]; const moved = d.pts.some(([x, y]) => Math.hypot(x - x0, y - y0) > 14);
    const blks = [...d.touched]; blks.forEach(b => b.classList.remove('hl-live'));
    if (!moved || !blks.length) return;
    blks.sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
    blks.forEach(b => b.classList.add('hl-live'));
    const clear = () => blks.forEach(b => b.classList.remove('hl-live'));
    pickCategory({ sub: blks.length === 1 ? '1 paragraf seçildi.' : `${blks.length} paragraf seçildi.` }, cat => {
      clear();
      let added = 0; for (const b of blks) if (addNoteFromBlk(p, b, null, cat)) added++;
      if (added) { notesChanged(); pulseNotes(); toast(`${added === 1 ? 'Paragraf' : added + ' paragraf'} “${catName(cat)}” notlarına eklendi.`); }
      else toast(`Bu paragraf “${catName(cat)}” notlarında zaten var.`);
    });
    const mo = new MutationObserver(() => { if ($('#modal').hidden) { clear(); mo.disconnect(); } });
    mo.observe($('#modal'), { attributes: true, attributeFilter: ['hidden'] });
  } else if (d.tool === 'pen') {
    if (d.pts.length < 2) return;
    const b = d.start || nearestBlk(d.pts[0][0], d.pts[0][1]); if (!b || !b.isConnected) return;
    const r = b.getBoundingClientRect(); if (!r.width || !r.height) return;
    const key = b.dataset.p + ':' + b.dataset.l;
    const stroke = { c: S.color, w: 2.6, pts: simplify(d.pts).map(([x, y]) => [+((x - r.left) / r.width).toFixed(4), +((y - r.top) / r.height).toFixed(4)]) };
    p.strokes = p.strokes || {};
    (p.strokes[key] = p.strokes[key] || []).push(stroke);
    S.undo.push({ pid: p.id, key, stroke, type: 'add' });

R.addEventListener('pointerup', finish);
R.addEventListener('pointercancel', finish);
function eraseAt(x, y) {
  const p = curPaper(); if (!p || !p.strokes) return; let changed = false;
  for (const b of $$('.blk', R)) {

    const r = b.getBoundingClientRect(); if (y < r.top - 120 || y > r.bottom + 120) continue;
    for (let k = arr.length - 1; k >= 0; k--) {
      const s = arr[k];
      if (s.pts.some(([fx, fy]) => Math.hypot(r.left + fx * r.width - x, r.top + fy * r.height - y) < 16)) {
        arr.splice(k, 1); S.undo.push({ pid: p.id, key, stroke: s, type: 'erase' }); changed = true;
      }
    }
    if (changed) drawInk(b, p);
  }
  if (changed) savePaper(p, 600);
}
function undo() {
  const u = S.undo.pop(); if (!u) { toast('Geri alınacak çizim yok.'); return; }
  const p = S.papers[u.pid]; if (!p) return;
  const arr = p.strokes[u.key] = p.strokes[u.key] || [];
  if (u.type === 'add') { const k = arr.indexOf(u.stroke); if (k >= 0) arr.splice(k, 1); } else arr.push(u.stroke);
  savePaper(p, 300);
  const [pi, l] = u.key.split(':');
  const b = R.querySelector(`.blk[data-p="${pi}"][data-l="${l}"]`); if (b) drawInk(b, p);
}

/* ---------- PDF upload ---------- */
async function importPdf(f, { arcItem = null } = {}) {
  if (!window.pdfjsLib) { toast('PDF okuyucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  closeModal();
  try {
    busy('PDF okunuyor…');
    const paras = await extractPdf(f, (i, n) => busy(`PDF okunuyor, sayfa ${i}/${n}`));
    if (paras.reduce((a, x) => a + x.t.length, 0) < 300) throw new Error('SCAN');
    const p = { id: 'p' + uid(), name: f.name.replace(/\.pdf$/i, ''), added: Date.now(), paras, tr: {}, strokes: {}, sections: [], skip: [], meta: {}, keywords: [] };
    let res = null;
    if (S.settings.key) {
      busy('Gemini bölümleri ve künyeyi belirliyor…');
      try { res = await analyze(p); } catch (err) { toast(errMsg(err) + ' Bölümler ayrılamadı, künyeyi elle girebilirsin.', 'err'); }
    } else toast('API anahtarı olmadığı için bölümler ayrılmadı. Ayarlar’dan ekleyebilirsin.', 'err');
    applyStructure(p, res);
    if (arcItem) { p.meta = JSON.parse(JSON.stringify(arcItem.meta || {})); p.keywords = (arcItem.keywords || []).slice(); p.arcId = arcItem.id; }
    else S.pendingFiles[p.id] = f;
    S.papers[p.id] = p; savePaper(p);
    busy(false); S.view = 'orig'; openPaper(p.id);
    if (arcItem) toast('Makale arşivden okumaya açıldı.'); else openMeta(p.id, true);
  } catch (err) {
    busy(false);
    toast(err.message === 'SCAN' ? 'Bu PDF’ten metin çıkarılamadı. Taranmış bir görüntü olabilir.' : errMsg(err), 'err');
  }
}
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importPdf(f);
});

  });
}

const GENEL = 'f-genel';
const ARC = {
  items: [], folders: [], ver: 0, dirty: LS.get('mo:arcDirty', false), busy: null, again: false,
  live() { return this.items.filter(x => !x.deleted); },
  get(id) { return this.items.find(x => x.id === id && !x.deleted) || null; },
  liveFolders() { return this.folders.filter(f => !f.deleted); },
  folder(id) { return this.folders.find(f => f.id === id && !f.deleted) || null; },
  fix() {

    const g = this.folders.find(f => f.id === GENEL); if (g.deleted) { delete g.deleted; g.updated = Date.now(); }

  save() { return Promise.all([DB.set('archive', this.items), DB.set('arcFolders', this.folders)]).catch(() => toast('Arşiv kaydedilemedi.', 'err')); },

    this.folders = mix(this.folders, remote && remote.folders);
    this.fix();

  async sync(quiet) {

    if (this.busy) { this.again = true; return this.busy; }
    this.busy = (async () => {
      try {
        const remote = await Drive.getJson(INDEX_NAME, 'indexId');
        this.merge(remote); const v = this.ver; await this.save();
        await Drive.putJson(INDEX_NAME, { app: 'makale-arsivi', v: 2, updated: Date.now(), items: this.items, folders: this.folders }, 'indexId');

async function saveArcItem({ item = null, meta, keywords, file = null, readId = null, folderId = null, fileName = null }) {
  const now = Date.now(); let upErr = null;
  if (!item) { item = { id: 'a' + uid(), added: now, fileId: null, fileName: '', folderId: GENEL }; if (readId) item.readId = readId; }
  const oldFolder = item.folderId || GENEL, oldName = item.fileName;
  Object.assign(item, { meta, keywords, updated: now });
  if (folderId && ARC.folder(folderId)) item.folderId = folderId;
  if (file) item.fileName = pdfName(fileName || file.name);
  else if (fileName) item.fileName = pdfName(fileName);
  try {
    if (file) {
      const parent = await Drive.ensureSub(item.folderId);
      const r = await Drive.upload(file, { name: item.fileName, parents: [parent], mimeType: 'application/pdf', description: arcDesc(item), appProperties: { arsivId: item.id } });
      item.fileId = r.id;
    } else if (item.fileId) {
      if (!Drive.ok()) { if (item.folderId !== oldFolder || item.fileName !== oldName) throw new Error('DRIVE_AUTH'); }
      else {
        await Drive.patch(item.fileId, { name: item.fileName, description: arcDesc(item) });
        if (item.folderId !== oldFolder) await Drive.moveFile(item.fileId, await Drive.ensureSub(item.folderId));
      }
    }
  } catch (e) { upErr = e; }
  const k = ARC.items.findIndex(x => x.id === item.id);
  if (k >= 0) ARC.items[k] = item; else ARC.items.push(item);

  return { item, upErr };
}

          if (Drive.ok()) { try { await Drive.patch(x.fileId, { trashed: true }); } catch { toast('PDF Drive’dan silinemedi, Drive’dan elle silebilirsin.', 'err'); } }
          else toast('Drive bağlı değil. PDF Drive’da duruyor, oradan silebilirsin.');
        }
        const k = ARC.items.indexOf(x); ARC.items[k] = { id: x.id, deleted: true, updated: Date.now() }; ARC.touch();
        for (const p of Object.values(S.papers)) if (p.arcId === x.id) { delete p.arcId; savePaper(p); }
        all();
      }
    });

async function readFromArchive(x) {
  const ex = Object.values(S.papers).find(p => p.arcId === x.id);
  if (ex) { closeModal(); S.view = 'orig'; openPaper(ex.id); return; }
  if (!Drive.ok()) { toast('PDF’i indirmek için Drive’a bağlan.', '', S.settings.clientId ? { label: 'Bağlan', fn: () => Drive.connect('archive') } : null); return; }
  busy('PDF Drive’dan indiriliyor…');
  try {
    const blob = await (await Drive.api(`files/${x.fileId}?alt=media`)).blob();
    busy(false);
    await importPdf(new File([blob], x.fileName || 'makale.pdf', { type: 'application/pdf' }), { arcItem: x });
  } catch (e) { busy(false); toast(errMsg(e), 'err'); }
}
$('#arcFile').addEventListener('change', async e => {
  const files = [...(e.target.files || [])]; e.target.value = ''; if (!files.length) return;
  const target = ARC.folder(S.arcTarget) ? S.arcTarget : GENEL; S.arcTarget = null;
  if (!window.pdfjsLib) { toast('PDF okuyucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  if (!S.settings.key) { openSettings(); toast('Künye çıkarmak için önce Gemini API anahtarını ekle.', 'err'); return; }
  if (files.length === 1) {
    const f = files[0]; closeModal();
    try { busy('Künye çıkarılıyor…'); const r = await metaFromPdf(f, t => busy(t)); busy(false); openArcEditor({ meta: r.meta, keywords: r.keywords, file: f, folderId: target }); }
    catch (err) { busy(false); toast(errMsg(err) + ' Künyeyi elle girebilirsin.', 'err'); openArcEditor({ meta: { title: f.name.replace(/\.pdf$/i, '') }, file: f, folderId: target }); }
    return;
  }
  const up = Drive.ok();
  if (!up && !confirm(`Drive bağlı değil. ${files.length} PDF yüklenmeden yalnızca künyeleri kaydedilsin mi?`)) return;
  closeModal(); let ok = 0, upFail = 0; const fail = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    busy(`Künye çıkarılıyor ${i + 1}/${files.length}: ${f.name}`);
    try {
      const r = await metaFromPdf(f);
      if (up) busy(`Drive’a yükleniyor ${i + 1}/${files.length}: ${f.name}`);
      const s = await saveArcItem({ meta: r.meta, keywords: r.keywords, file: up ? f : null, folderId: target, fileName: up ? null : f.name }); ok++; if (s.upErr) upFail++;
    } catch { fail.push(f.name); }
  }
  busy(false); arcQ = ''; S.arcFolder = target; LS.set('mo:arcFolder', target); openArchive();
  let msg = `${ok} makale “${folderName(target)}” klasörüne eklendi. Künyeleri kontrol etmeyi unutma.`;
  if (upFail) msg += ` ${upFail} PDF Drive’a yüklenemedi.`;
  if (fail.length) msg += ` Okunamayanlar: ${fail.join(', ')}`;
  toast(msg, fail.length || upFail ? 'err' : '');
});
$('#arcAttach').addEventListener('change', async e => {

function backupData() { return { app: 'makale-okuyucu', v: 2, papers: S.papers, notes: S.notes, cats: S.cats, archive: ARC.items, arcFolders: ARC.folders, style: S.settings.style }; }
async function restoreData(d) {
  if (!d || d.app !== 'makale-okuyucu') throw new Error('Bu dosya bir Makale Okuyucu yedeği değil.');
  for (const p of Object.values(d.papers || {})) { S.papers[p.id] = p; await DB.set('paper:' + p.id, p); }
  const cids = new Set(S.cats.map(c => c.id)); for (const c of (d.cats || [])) if (c && c.id && !cids.has(c.id)) S.cats.push(c);
  const ids = new Set(S.notes.map(n => n.id)); for (const n of (d.notes || [])) if (!ids.has(n.id)) S.notes.push(n);
  fixNotes(); saveCats(); saveNotes();
  if (Array.isArray(d.archive)) { ARC.merge({ items: d.archive, folders: d.arcFolders || [] }); ARC.touch(); }
}

      if (!needDrive()) return;
      busy('Yedek Drive’a kaydediliyor…');
      try { await Drive.putJson(BACKUP_NAME, backupData()); toast('Yedek Drive’daki “' + FOLDER_NAME + '” klasörüne kaydedildi.'); }
      catch (e) { toast(errMsg(e), 'err'); } finally { busy(false); }
    };
    $('#sDRs').onclick = async () => {
      if (!needDrive()) return;
      busy('Yedek Drive’dan alınıyor…');
      try {
        const d = await Drive.getJson(BACKUP_NAME); busy(false);
        if (!d) { toast('Drive’da yedek bulunamadı.'); return; }
        if (!confirm('Drive’daki yedekte bulunan makaleler, notlar ve kategoriler mevcut verilerine eklenecek. Devam edilsin mi?')) return;
        await restoreData(d); closeModal(); renderAll(); toast('Yedek Drive’dan yüklendi.');
      } catch (e) { busy(false); toast(errMsg(e), 'err'); }
    };
    $('#sBk').onclick = () => {
      downloadBlob(new Blob([JSON.stringify(backupData())], { type: 'application/json' }), `makale-okuyucu-yedek-${new Date().toISOString().slice(0, 10)}.json`);
    };
    $('#bkIn').onchange = async ev => {
      const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (!d || d.app !== 'makale-okuyucu') throw new Error('Bu dosya bir Makale Okuyucu yedeği değil.');
        if (!confirm('Yedekteki makaleler ve notlar mevcut verilerine eklenecek. Devam edilsin mi?')) return;
        await restoreData(d); closeModal(); renderAll(); toast('Yedek yüklendi.');
      } catch (e) { toast(errMsg(e), 'err'); }
    };
  });
}

/* ---------- Word export ---------- */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function buildDocx(set) {
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const X = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const run = (t, o = {}) => {
    const rp = (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '') + (o.color ? `<w:color w:val="${o.color}"/>` : '') + (o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : '');
    return `<w:r>${rp ? `<w:rPr>${rp}</w:rPr>` : ''}<w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  };
  const textRuns = t => String(t).split(/\n/).map((ln, k) => (k ? '<w:r><w:br/></w:r>' : '') + run(ln)).join('');
  const para = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 160}" w:line="${o.line || 360}" w:lineRule="auto"/>${o.ind || ''}${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}</w:pPr>${runs}</w:p>`;
  const sm = suffixMap(set.notes);
  let body = para(run(set.title, { b: true, sz: 32 }), { jc: 'center', after: 80 });
  body += para(run(new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }), { color: '666666', sz: 20 }), { jc: 'center', after: 360 });
  for (const g of exportGroups(set)) {
    if (g.name) body += para(run(g.name, { b: true, sz: 26 }), { before: 240, after: 160, keep: true });
    g.notes.forEach((n, k) => {
      body += para(run(`${k + 1}.`) + '<w:r><w:tab/></w:r>' + textRuns(noteWithCite(n, sm)), { ind: '<w:ind w:left="425" w:hanging="425"/>', after: 200 });
    });
  }
  const refs = citedPapers(set.notes);
  if (refs.length) {
    body += para(run('Kaynakça', { b: true }), { jc: 'center', before: 480, after: 240, keep: true });
    for (const p of refs) body += para(refParts(p, sm).map(([t, i]) => run(t, { i })).join(''), { ind: '<w:ind w:left="720" w:hanging="720"/>', line: 480, after: 0 });
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const zip = new JSZip();
  zip.file('[Content_Types].xml', types); zip.file('_rels/.rels', rels);
  zip.file('word/document.xml', doc); zip.file('word/styles.xml', styles); zip.file('word/_rels/document.xml.rels', docRels);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
const hasText = n => String(n.text || '').trim();
function exportSet(sel) {
  const notes = S.notes.filter(n => hasText(n) && (sel === 'all' || n.cat === sel));
  return { notes, title: sel === 'all' ? 'Notlarım' : catName(sel), grouped: sel === 'all' && new Set(notes.map(n => n.cat)).size > 1 };
}
function exportGroups(set) {
  if (!set.grouped) return [{ name: null, notes: set.notes }];
  return S.cats.map(c => ({ name: c.name, notes: set.notes.filter(n => n.cat === c.id) })).filter(g => g.notes.length);
}
function openExport() {
  if (!S.notes.some(hasText)) { toast('Önce birkaç not ekle.'); return; }
  if (!window.JSZip) { toast('Word oluşturucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  const cnt = id => S.notes.filter(n => hasText(n) && n.cat === id).length;
  let sel = S.catView !== 'all' && cnt(S.catView) ? S.catView : 'all';
  const slug = t => t.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-');
  modal(`<h3>Word’e aktar</h3><p class="hint">Notların sırasıyla, APA 7 metin içi atıflarıyla yazılır. Kaynakça en sonda alfabetik sıradadır ve yalnızca bu notlarda geçen makaleleri içerir.</p>
    <label>Hangi notlar?<select id="xCat"><option value="all">Tüm kategoriler (${S.notes.filter(hasText).length})</option>${S.cats.filter(c => cnt(c.id)).map(c => `<option value="${c.id}">${esc(c.name)} (${cnt(c.id)})</option>`).join('')}</select></label>
    <div class="docprev" id="xPrev"></div>
    <label>Dosya adı<input id="xName" autocapitalize="off" spellcheck="false"></label>
    <div class="mact"><button data-close>Kapat</button><button id="xShare">Paylaş</button><button class="primary" id="xDl">İndir (.docx)</button></div>`, () => {
    let ready = null, blob = null;
    const build = () => {
      const set = exportSet(sel); const sm = suffixMap(set.notes); const refs = citedPapers(set.notes);
      $('#xPrev').innerHTML = `<h4>${esc(set.title)}</h4>` + exportGroups(set).map(g => (g.name ? `<p style="font-weight:700;margin:14px 0 8px">${esc(g.name)}</p>` : '') + g.notes.map((n, k) => `<p class="n">${k + 1}. ${esc(noteWithCite(n, sm))}</p>`).join('')).join('')
        + (refs.length ? `<h4 style="margin-top:22px">Kaynakça</h4>${refs.map(p => `<p class="refp">${refHTML(p, sm)}</p>`).join('')}` : '');
      $('#xName').value = slug(set.title) + '-' + new Date().toISOString().slice(0, 10);
      blob = null; ready = buildDocx(set).then(b => { blob = b; return b; });
    };
    $('#xCat').value = sel; build();
    $('#xCat').onchange = e => { sel = e.target.value; build(); };
    const fname = () => ($('#xName').value.trim() || 'Notlarim').replace(/[\\/:*?"<>|]+/g, '-') + '.docx';
    $('#xDl').onclick = async () => { const b = blob || await ready; downloadBlob(b, fname()); toast('Word dosyası indirildi.'); };
    $('#xShare').onclick = async () => {
      const b = blob || await ready;
      const file = new File([b], fname(), { type: b.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: fname() }); } catch (e) { if (e.name !== 'AbortError') toast('Paylaşılamadı. İndir düğmesini kullan.', 'err'); }
      } else { downloadBlob(b, fname()); toast('Paylaşım desteklenmiyor, dosya indirildi.'); }
    };
  });
}

/* ---------- init ---------- */
async function init() {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const after = Drive.handleRedirect();
  try {
    await DB.open();
    for (const k of await DB.keys()) {
      if (String(k).startsWith('paper:')) { const p = await DB.get(k); if (p && p.id) { p.strokes = p.strokes || {}; p.tr = p.tr || {}; S.papers[p.id] = p; } }
    }
    S.notes = (await DB.get('notes')) || [];
    S.cats = (await DB.get('cats')) || [];
    ARC.items = (await DB.get('archive')) || [];
    ARC.folders = (await DB.get('arcFolders')) || [];
  } catch (e) {
    DB.db = null; toast('Tarayıcı depolaması kullanılamıyor. Veriler kaydedilmeyecek.', 'err');
  }
  fixNotes(); saveCats(); ARC.fix();
  if (innerWidth > 1050) document.body.classList.add('notes-open');
  resizeOv();
  const last = LS.get('mo:last', null);
  if (last && S.papers[last]) openPaper(last); else renderAll();
  if (after) {
    toast('Drive bağlandı. Arşiv eşitleniyor…');
    await ARC.sync(false);
    if (after === 'archive') openArchive(); else if (after === 'settings') openSettings('drive');
  } else if (Drive.ok()) ARC.sync(true);
}
init();
})();
</script>
