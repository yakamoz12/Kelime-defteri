<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tez Haritası">
<title>Tez Haritası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f5f2;--bg2:#fafaf8;--surface:#ffffff;--surface2:#eceef1;--ink:#1a2130;--muted:#5b6474;--line:#e1e4e8;
  --accent:#24508f;--accent-soft:#e5ecf7;--on-accent:#ffffff;
  --hl:#fff3bf;--trbg:#f1f5fb;--trbar:#8aa6d8;--danger:#b3261e;
  --shadow:0 12px 32px rgba(20,30,50,.14);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b;--bg2:#161a21;--surface:#1a1e26;--surface2:#232834;--ink:#e6e9ef;--muted:#98a1b0;--line:#2c323e;
  --accent:#8fb0f0;--accent-soft:#1f2a40;--on-accent:#0d1424;
  --hl:rgba(255,215,60,.26);--trbg:#182030;--trbar:#4f6fa8;--danger:#f2857b;
  --shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;-webkit-tap-highlight-color:transparent;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Rail (left menu) */
#app{height:100%;display:flex;flex-direction:row}
.rail{width:88px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;gap:6px;z-index:25}
.rail .mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:21px;margin-bottom:16px;flex:none}
.rail .grow{flex:1}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:74px;min-height:62px;padding:8px 0;border:0;border-radius:14px;background:transparent;color:var(--muted);font:600 12px var(--sans);white-space:normal;text-align:center}
.nv svg{width:26px;height:26px}
.nv.on{background:var(--accent-soft);color:var(--accent)}
.nv .badge{position:absolute;top:4px;right:8px;min-width:20px;padding:1px 6px;font-size:11px}
.nvNotes{display:none}
.work{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.work[hidden]{display:none}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;min-width:22px;text-align:center}

/* Reader column */
.main{flex:1;display:flex;min-height:0;position:relative}
.readcol{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:76px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.pname{flex:1;border:0;background:none;padding:0;min-height:0;display:block;text-align:left;min-width:0}
.pname b{display:block;font-family:var(--serif);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{display:block;color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;flex:none}
.seg[hidden]{display:none}
.seg button{border:0;background:transparent;min-height:40px;padding:4px 14px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.secbar{min-height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:8px 24px;background:var(--bg2);border-bottom:1px solid var(--line)}
.secbar[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1 1 auto;min-width:0;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;min-height:40px;padding:6px 16px;background:var(--surface2);border-color:transparent;flex:none}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.chip .ok{color:var(--accent);font-weight:700;margin-left:2px}
.chip.on .ok{color:inherit}
.ctrls{display:flex;gap:8px;align-items:center;flex:none}
.ctrls .primary{min-height:44px;border-radius:12px;padding:8px 18px}
.readbody{flex:1;min-height:0;display:flex;gap:20px;padding:20px 20px 0;position:relative}
.paper{flex:1;min-width:0;display:flex;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;overflow:hidden}
#reader{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:30px 30px 120px 26px}
.article{max-width:700px;margin:0 auto}
.sec-head{margin:0 0 22px;padding-left:16px}
.sec-head .orig{color:var(--muted);font-size:14px;font-style:italic;font-family:var(--serif)}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;margin:2px 0 0}
.notice{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.para{margin:0 0 16px}
.blk{position:relative;margin:0;padding:10px 54px 10px 16px;border-radius:10px;font-family:var(--serif);font-size:18.5px;line-height:1.68;transition:background-color .25s}
.blk p{margin:0;-webkit-hyphens:auto;hyphens:auto}
.blk.tr{background:var(--trbg);box-shadow:inset 3px 0 0 var(--trbar);margin-top:6px}
.blk.skipped{opacity:.5;font-size:15px}
.blk.noted,.blk.hl-live{background:var(--hl)}
.blk.tr.noted{box-shadow:inset 3px 0 0 var(--trbar)}
.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.addn{position:absolute;right:8px;top:10px;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.noted .addn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
svg.ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#reader.tooling .blk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.showskip{margin:18px 0 0;color:var(--muted);background:transparent}

/* Empty state */
.empty{max-width:560px;margin:5vh auto 0;text-align:left}
.empty h2{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.15;margin:0 0 10px}
.empty p.lead{color:var(--muted);font-size:17px;margin:0 0 24px}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.big{min-height:52px;padding:10px 22px;font-size:16px;border-radius:12px}
.steps{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.steps li span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}

/* Pencil palette (vertical) */
.toolbar{width:64px;flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(20,30,50,.08);z-index:20}
.toolbar[hidden]{display:none}
.tool{width:52px;height:52px;min-height:0;padding:0;border:0;background:transparent;border-radius:14px;color:var(--ink)}
.tool svg{width:24px;height:24px}
.tool span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tool.on{background:var(--accent);color:var(--on-accent)}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin:2px 0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.tsep{width:36px;height:1px;background:var(--line);margin:6px 0}
.selpill{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;z-index:21;box-shadow:var(--shadow);min-height:48px;border-radius:14px}
.selpill[hidden]{display:none}

/* Notes column */
.notes{width:340px;flex:none;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.nhead{height:76px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.nhead h3{margin:0;flex:1;font-family:var(--serif);font-size:21px;font-weight:600}
.nhead .outline{border-color:var(--accent);color:var(--accent);font-weight:600;min-height:44px;border-radius:12px}
#notesList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:12px}
.note-top{display:flex;align-items:center;gap:8px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.src{flex:1;min-width:0;border:0;background:none;padding:0;min-height:30px;justify-content:flex-start;color:var(--accent);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.src.free{color:var(--muted)}
.nact button{min-height:34px;width:34px;padding:0;border:0;background:transparent;color:var(--muted)}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;font-family:var(--serif);font-size:15.5px;line-height:1.55;padding:6px 0 0;outline:none;overflow:hidden;min-height:48px}
.cite{color:var(--muted);font-size:12.5px;margin-top:4px}
.empty-notes{color:var(--muted);text-align:center;padding:30px 10px;font-size:14.5px}
.empty-notes b{color:var(--ink)}
.nbottom{flex:none;padding:14px;border-top:1px solid var(--line);background:var(--surface)}
.nbottom button{width:100%;min-height:52px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:15.5px}
.nclose{display:none}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.pane[hidden]{display:none}
#bExport[hidden]{display:none}
#paneTabs button{min-height:40px;padding:4px 12px;font-size:14px}
.asklog{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:10px}
.askintro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.askintro b{font-family:var(--serif);font-size:17px}
.askintro p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.asksug{display:flex;flex-direction:column;gap:8px}
.asksug button{justify-content:flex-start;text-align:left;white-space:normal;min-height:46px;border-radius:12px;font-size:14.5px;background:var(--surface)}
.askbar{display:flex;justify-content:flex-end}
.link{border:0;background:none;color:var(--muted);font-size:13px;min-height:32px;padding:0 4px;text-decoration:underline}
.qbub{align-self:flex-end;max-width:88%;background:var(--accent);color:var(--on-accent);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.abub{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px}
.abub.err{border-color:var(--danger);color:var(--danger)}
.abub.wait{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px}
.atext{font-family:var(--serif);font-size:15.5px;line-height:1.6;white-space:pre-wrap}
.pref{display:inline-flex;min-height:24px;padding:0 7px;margin:0 2px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent);font:700 12px var(--sans);vertical-align:1px}
.aact{display:flex;gap:8px;margin-top:10px}
.aact button{min-height:38px;font-size:13.5px;border-radius:10px}
.askin{flex:none;display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface)}
.askin textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.4 var(--sans);background:var(--bg);color:var(--ink);max-height:140px}
.askin button{min-height:46px;border-radius:12px;padding:0 18px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
mark.qm.qpend{background:rgba(36,80,143,.16);text-decoration-color:var(--accent);cursor:pointer}
mark.qm.qadd{background:rgba(31,122,74,.16);text-decoration-color:#1f7a4a;cursor:pointer}
mark.qm.qfocus{animation:qf 2.6s ease-out}
@keyframes qf{0%,55%{background:#ffd84d;box-shadow:0 0 0 4px #ffd84d}100%{}}
mark.qm{background:rgba(36,80,143,.10);color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2.5px;text-underline-offset:4px;border-radius:3px;padding:1px 0}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;display:inline-block}
.chip.on .qdot{background:var(--on-accent)}
.abub.act{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.aintro{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.qitem{padding:10px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:2px}
.qitem blockquote{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.55;border-left:3px solid var(--accent);padding-left:10px}
.qitem.nf blockquote{border-left-color:var(--danger)}
.qmeta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.qwarn{color:var(--danger);font-weight:600}
.qadd{min-height:32px;padding:2px 10px;font-size:12.5px;border-radius:9px}
.qnote{margin-top:6px;font-size:13.5px;color:var(--muted)}
.asum{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.catbar{min-height:60px;flex-direction:column;align-items:stretch;gap:6px;overflow:visible}
.crow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.crow::-webkit-scrollbar{display:none}
.crow.sub{padding:6px 0 0;border-top:1px dashed var(--line)}
.crow.sub .chip{min-height:32px;font-size:13px}
.crow.sub{overflow:visible}
.cscroll{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.cscroll::-webkit-scrollbar{display:none}
.cedit{flex:none;min-height:34px;padding:4px 10px;gap:5px;font-size:13px;font-weight:600;border-radius:10px;color:var(--accent);border-color:var(--accent-soft)}
.quick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:58px;padding:8px 16px;margin-top:14px;border-color:var(--accent);background:var(--accent-soft);text-align:left;white-space:normal}
.quick small{font-size:12px;font-weight:600;color:var(--muted)}
.quick b{font-size:16px;color:var(--accent)}
.picklist button.direct{background:var(--surface2)}
.catbar .chip{min-height:36px;padding:4px 13px;font-size:13.5px;font-weight:600;background:transparent;color:var(--muted)}
.catbar .chip.on{background:var(--accent);color:var(--on-accent)}

/* Archive screen */
.arc{flex:1;min-height:0;display:flex}
.afold{width:240px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:22px 12px 16px;overflow-y:auto}
.afold h2{margin:0 6px 16px;font-family:var(--serif);font-weight:600;font-size:26px}
.fd{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;min-height:52px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:500;text-align:left;white-space:normal}
.fd svg{width:22px;height:22px;flex:none;color:var(--muted)}
.fd span{flex:1}
.fd small{font-size:13px;font-weight:600;color:var(--muted)}
.fd.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fd.on svg,.fd.on small{color:var(--accent)}
.fd.ghost{color:var(--muted)}
.astat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.astat b{display:block;font-weight:600}
.astat small{display:block;color:var(--muted);font-size:12px}
.astat button{min-height:38px;padding:4px 12px;margin-left:auto;font-size:13.5px}
.amain{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 22px 0}
.atop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asearch{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;border-radius:14px;background:var(--surface);border:2px solid var(--accent);min-width:0}
.asearch svg{flex:none;color:var(--accent)}
.asearch input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:500 17px var(--sans);color:var(--ink);padding:0;margin:0}
.atop .primary,.atop button{min-height:54px;border-radius:14px}
.afbar{display:none;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.afbar::-webkit-scrollbar{display:none}
.afbar .chip{min-height:38px;font-size:14px}
.afbar .chip small{opacity:.65;margin-left:4px;font-weight:600;font-size:12px}
.afbar .astat{flex:none;padding:4px 10px}
.alist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding-bottom:24px}
.arow{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid transparent;cursor:pointer}
.arow.on{background:var(--surface);border-color:var(--accent-soft);box-shadow:0 4px 14px rgba(20,30,50,.06)}
.ficon{flex:none;width:40px;height:50px;border-radius:5px 14px 5px 5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.ficon.none{background:var(--surface2);color:var(--muted)}
.arname{border:0;background:none;padding:0;min-height:0;display:block;text-align:left;white-space:normal;width:100%;color:var(--ink)}
.arname b{display:block;font-weight:600;font-size:16px;line-height:1.35;word-break:break-word}
.arname small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35;font-weight:400}
.arow .kw{margin:10px 0 0}
.adetail{width:320px;flex:none;background:var(--surface);border-left:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const PUNCT_END = /[.!?:]["”’)\]]?$/;

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DB = {
  db: null, mem: new Map(),
  open() { return new Promise((res, rej) => { const r = indexedDB.open('tez-haritasi', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(mode) { return this.db.transaction('kv', mode).objectStore('kv'); },
  get(k) { if (!this.db) return Promise.resolve(this.mem.get(k)); return new Promise((res, rej) => { const q = this.tx('readonly').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { if (!this.db) { this.mem.set(k, v); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  del(k) { if (!this.db) { this.mem.delete(k); return Promise.resolve(); } return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  keys() { if (!this.db) return Promise.resolve([...this.mem.keys()]); return new Promise((res, rej) => { const q = this.tx('readonly').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};

const S = {
  settings: Object.assign({ key: '', model: 'gemini-2.5-flash', style: 'en', clientId: '' }, LS.get('th:settings', {})),
  cats: [], catView: LS.get('th:catView', 'all'), pendingFiles: {}, attachFor: null,
  papers: {}, notes: [], cur: null, sec: 0, view: 'orig', tool: 'select', color: '#d9342b',
  undo: [], translating: false, trText: '', showSkipped: false, hinted: {}
};
const curPaper = () => S.papers[S.cur] || null;

const timers = {};
function savePaper(p, delay = 0) {
  clearTimeout(timers[p.id]);
  timers[p.id] = setTimeout(() => { DB.set('paper:' + p.id, p).catch(() => toast('Kaydedilemedi. Depolama dolu olabilir.', 'err')); }, delay);
}
function saveNotes() {
  clearTimeout(timers.notes);
  timers.notes = setTimeout(() => { DB.set('notes', S.notes).catch(() => toast('Notlar kaydedilemedi.', 'err')); }, 250);
}
function saveSettings() { LS.set('th:settings', S.settings); }
function saveCats() { DB.set('cats', S.cats).catch(() => toast('Kategoriler kaydedilemedi.', 'err')); }

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg, type = '', action = null) {
  const T = $('#toast');
  T.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  T.className = 'toast show ' + type;
  if (action) T.querySelector('button').onclick = () => { action.fn(); T.className = 'toast'; };
  clearTimeout(toastT);
  toastT = setTimeout(() => { T.className = 'toast'; }, action ? 6500 : (type === 'err' ? 5500 : 3000));
}
function busy(text) {
  const B = $('#busy');
  if (text === false) { B.hidden = true; return; }
  $('#busyText').textContent = text; B.hidden = false;
}
function modal(html, onMount) {
  const old = $('#mbox'); const box = old.cloneNode(false); old.replaceWith(box);
  box.innerHTML = html; $('#modal').hidden = false; if (onMount) onMount(box);
}
function closeModal() { $('#modal').hidden = true; $('#mbox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });

/* ---------- APA 7 ---------- */
const authorsOf = p => ((p.meta && p.meta.authors) || []).filter(a => a && (a.family || a.given));
function initials(given) {
  return String(given || '').trim().split(/\s+/).filter(Boolean).map(w =>
    w.split('-').map(part => { const c = part.replace(/[^\p{L}]/gu, '')[0]; return c ? c.toUpperCase() + '.' : ''; }).filter(Boolean).join('-')
  ).filter(Boolean).join(' ');
}
function suffixMap(notes = S.notes) {
  const groups = {};
  const ids = new Set(notes.map(n => n.paperId).filter(id => id && S.papers[id]));
  for (const id of ids) {
    const p = S.papers[id]; const A = authorsOf(p); if (!A.length) continue;
    const k = A.map(a => (a.family + '|' + initials(a.given)).toLocaleLowerCase('tr')).join(';') + '#' + String(p.meta.year || '').trim();
    (groups[k] = groups[k] || []).push(p);
  }
  const m = {};
  for (const g of Object.values(groups)) if (g.length > 1) {
    g.sort((a, b) => String(a.meta.title || '').localeCompare(String(b.meta.title || ''), 'tr'));
    g.forEach((p, i) => { m[p.id] = String.fromCharCode(97 + i); });
  }
  return m;
}
function yearLabel(p, sm) {
  const y = String((p.meta && p.meta.year) || '').trim() || (S.settings.style === 'tr' ? 't.y.' : 'n.d.');
  const suf = (sm || suffixMap())[p.id] || '';
  return y + (suf ? (/^\d/.test(y) ? suf : '-' + suf) : '');
}
function shortTitle(p) {
  const t = String((p.meta && p.meta.title) || p.name || 'Adsız').trim();
  const w = t.split(/\s+/); return '“' + (w.length > 4 ? w.slice(0, 4).join(' ') + '…' : t) + '”';
}
function inTextAuthors(p) {
  const A = authorsOf(p), tr = S.settings.style === 'tr';
  if (!A.length) return shortTitle(p);
  const f = a => a.family || a.given;
  if (A.length === 1) return f(A[0]);
  if (A.length === 2) return `${f(A[0])} ${tr ? 've' : '&'} ${f(A[1])}`;
  return `${f(A[0])} ${tr ? 'vd.' : 'et al.'}`;
}
const inText = (p, sm) => `${inTextAuthors(p)}, ${yearLabel(p, sm)}`;
function refAuthors(p) {
  const A = authorsOf(p).map(a => a.given && a.family ? `${a.family}, ${initials(a.given)}` : (a.family || a.given));
  const amp = S.settings.style === 'tr' ? 've' : '&';
  if (!A.length) return '';
  if (A.length === 1) return A[0];
  if (A.length <= 20) return A.slice(0, -1).join(', ') + `, ${amp} ` + A[A.length - 1];
  return A.slice(0, 19).join(', ') + ', . . . ' + A[A.length - 1];
}
const pagesFmt = s => String(s || '').trim().replace(/\s*[-‐‑–—]+\s*/g, '–');
function doiFmt(s) {
  s = String(s || '').trim(); if (!s) return '';
  const d = s.replace(/^https?:\/\/(dx\.)?doi\.org\//i, '').replace(/^doi:\s*/i, '');
  if (/^10\./.test(d)) return 'https://doi.org/' + d;
  return s;
}
function refParts(p, sm) {
  if (p.raw) return [[p.raw, false]];
  const m = p.meta || {}; const out = []; const add = (t, i = false) => { if (t) out.push([t, i]); };
  const au = refAuthors(p); const yr = `(${yearLabel(p, sm)}).`;
  let title = String(m.title || '').trim().replace(/\s+/g, ' ');
  if (title && !/[.?!]$/.test(title)) title += '.';
  if (au) { add(au + (/\.$/.test(au) ? '' : '.') + ' ' + yr + ' '); if (title) add(title + ' '); }
  else if (title) add(title + ' ' + yr + ' ');
  else add((p.name || 'Adsız') + '. ' + yr + ' ');
  const jo = String(m.journal || '').trim();
  if (jo) {
    add(jo, true);
    if (String(m.volume || '').trim()) { add(', '); add(String(m.volume).trim(), true); }
    if (String(m.issue || '').trim()) add(`(${String(m.issue).trim()})`);
    if (String(m.pages || '').trim()) add(', ' + pagesFmt(m.pages));
    add('. ');
  }
  const doi = doiFmt(m.doi); if (doi) add(doi);
  if (out.length) { const l = out[out.length - 1]; l[0] = l[0].replace(/\s+$/, ''); }
  return out;
}
const refHTML = (p, sm) => refParts(p, sm).map(([t, i]) => i ? `<i>${esc(t)}</i>` : esc(t)).join('');
const refSortKey = p => p.raw ? p.raw.toLocaleLowerCase('tr') : (refAuthors(p) || String(p.meta.title || p.name || '')).toLocaleLowerCase('tr');
const usesPaper = n => !(n.cites && n.cites.length && n.direct);
function citedPapers(notes = S.notes) {
  const sm = suffixMap(notes);
  const ids = [...new Set(notes.filter(n => n.paperId && S.papers[n.paperId] && usesPaper(n)).map(n => n.paperId))];
  const raws = [...new Set(notes.filter(n => n.direct && n.cites).flatMap(n => n.cites.map(c => c.ref).filter(Boolean)))].map(r => ({ raw: r }));
  return [...ids.map(id => S.papers[id]), ...raws].sort((a, b) =>
    refSortKey(a).localeCompare(refSortKey(b), 'tr') || (a.raw || b.raw ? 0 : yearLabel(a, sm).localeCompare(yearLabel(b, sm))));
}
function citeStr(n, p, sm) {
  if (n.cites && n.cites.length) {
    const list = n.cites.map(c => c.intext).filter(Boolean).join('; ');
    if (list) return n.direct ? `(${list})` : `(${list}, ${S.settings.style === 'tr' ? 'akt.' : 'as cited in'} ${inText(p, sm)})`;
  }
  return `(${inText(p, sm)})`;
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function inlineCite(t, n, p, sm) {
  if (!n.cites || !n.cites.length) return null;
  let done = 0; const akt = `, ${S.settings.style === 'tr' ? 'akt.' : 'as cited in'} ${inText(p, sm)}`;
  for (const c of n.cites) {
    const y = (c.intext.match(/\d{4}[a-z]?/) || [])[0]; const sur = (c.intext.match(/\p{Lu}[\p{L}'’\-]+/u) || [])[0];
    if (!y || !sur) continue;
    const re = new RegExp(`\\(([^()]*${escRe(sur)}[^()]*${y}[^()]*)\\)`, 'u');
    if (re.test(t)) { t = t.replace(re, (m, inner) => n.direct || /\b(akt\.|as cited in)/.test(inner) ? m : `(${inner.trim()}${akt})`); done++; continue; }
    const re2 = new RegExp(`(${escRe(sur)}[^()]{0,60}?)\\((${y}[^()]*)\\)`, 'u');
    if (re2.test(t)) { t = t.replace(re2, (m, a, inner) => n.direct || /\b(akt\.|as cited in)/.test(inner) ? m : `${a}(${inner}${akt})`); done++; }
  }
  return done ? t : null;
}
function noteWithCite(n, sm) {
  const p = S.papers[n.paperId]; const t = String(n.text || '').trim();
  if (!p) return t;
  const inl = inlineCite(t, n, p, sm); if (inl) return inl;
  const c = citeStr(n, p, sm);
  if (/[^.]\.$/.test(t)) return t.slice(0, -1) + ' ' + c + '.';
  return t + ' ' + c;
}

/* ---------- PDF extraction ---------- */
function joinT(a, b) {
  if (/[A-Za-zÀ-ɏ]-$/.test(a) && /^[a-zà-ɏ]/.test(b)) return a.slice(0, -1) + b;
  return a + ' ' + b;
}
/* Some PDFs (often Turkish ones) map letters like "i" to wrong Unicode characters.
   Find foreign characters that sit inside Latin words and map them back. */
const OK_CH = /[\u0000-\u036F\u0370-\u03FF\u2000-\u206F\u20A0-\u20CF\u2100-\u214F\u2190-\u23FF\u25A0-\u25FF\uFB00-\uFB06]/u;
const LAT_CH = /[A-Za-zÀ-ɏ]/;
function glyphMap(text) {
  const chars = Array.from(text); const stats = new Map();
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i]; if (OK_CH.test(c) || /\s/.test(c)) continue;
    const a = chars[i - 1] || ' ', b = chars[i + 1] || ' ';
    if (!LAT_CH.test(a) && !LAT_CH.test(b)) continue;
    const s = stats.get(c) || { n: 0, start: 0 }; s.n++; if (!LAT_CH.test(a)) s.start++; stats.set(c, s);
  }
  const cands = [...stats.entries()].filter(([, s]) => s.n >= 3).sort((x, y) => y[1].n - x[1].n);
  if (!cands.length) return null;
  const letters = (text.match(/[A-Za-zÀ-ɏ]/g) || []).length || 1;
  const cnt = ch => text.split(ch).length - 1;
  const tr = (text.match(/[ğşçöüĞŞÇÖÜ]/g) || []).length > letters * 0.01;
  const map = {}; const used = new Set();
  for (const [c, s] of cands) {
    if (s.start / s.n > 0.7) { const up = tr ? 'İ' : 'I'; if (!used.has(up)) { map[c] = up; used.add(up); } continue; }
    if (!used.has('i') && cnt('i') / letters < 0.035) { map[c] = 'i'; used.add('i'); continue; }
    if (tr && !used.has('ı') && cnt('ı') / letters < 0.01) { map[c] = 'ı'; used.add('ı'); }
  }
  return Object.keys(map).length ? map : null;
}
const applyGlyphs = (s, m) => { if (!m || !s) return s; for (const [a, b] of Object.entries(m)) s = s.split(a).join(b); return s; };
function isTurkishText(text) {
  const letters = (text.match(/[A-Za-zÀ-ɏ]/g) || []).length || 1;
  return (text.match(/[ğşıİĞŞ]/g) || []).length / letters > 0.012;
}
function repairPaper(p) {
  const m = glyphMap(p.paras.map(x => x.t).join('\n')); let changed = false;
  if (m) {
    p.paras.forEach(x => { x.t = applyGlyphs(x.t, m); });
    for (const k of Object.keys(p.tr || {})) p.tr[k] = applyGlyphs(p.tr[k], m);
    if (p.meta) for (const k of ['title', 'journal']) if (p.meta[k]) p.meta[k] = applyGlyphs(p.meta[k], m);
    for (const n of S.notes) if (n.paperId === p.id) n.text = applyGlyphs(n.text, m);
    changed = true;
  }
  if (!p.lang) { p.lang = isTurkishText(p.paras.slice(0, 60).map(x => x.t).join(' ')) ? 'tr' : 'xx'; changed = true; }
  const N = p.paras.length; const before = (p.skip || []).length;
  p.skip = (p.skip || []).filter(i => i >= 0 && i < N && p.paras[i].t.length < 200);
  if (p.skip.length !== before) changed = true;
  if (!p.boilerDone) { p.skip = [...new Set([...p.skip, ...boilerIdx(p)])].sort((a, b) => a - b); p.boilerDone = true; changed = true; }
  return changed;
}
async function extractPdf(file, onProg, maxPages = Infinity) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const paras = [];
  const last = Math.min(pdf.numPages, maxPages);
  for (let pn = 1; pn <= last; pn++) {
    onProg(pn, last);
    const page = await pdf.getPage(pn);
    const tc = await page.getTextContent();
    const lines = []; let cur = null;
    const push = () => { if (cur && cur.text.trim()) lines.push(cur); cur = null; };
    for (const it of tc.items) {

function eraseAt(x, y) {

}

/* A paragraph that stops mid-sentence at a page break continues after the page header/number. */
function mergeBroken(paras) {
  const hdr = t => t.length < 110 && /\bdoi\b|\bsayı\s*:?\s*\d|\bvol\.?\s*\d|\bcilt\b|\bissn\b|\bjournal\b|dergisi/i.test(t);
  const mark = () => { junk.clear(); boilerIdx({ paras }).forEach(k => junk.add(k)); paras.forEach((x, k) => { if (hdr(x.t)) junk.add(k); }); };
  const junk = new Set(); mark();
  for (let i = 0; i < paras.length - 1; i++) {
    const a = paras[i].t.trim();
    if (junk.has(i) || a.split(/\s+/).length < 8 || /[.!?:;…)\]”"’]$/.test(a)) continue;
    let j = i + 1; while (j < paras.length && j - i <= 4 && (junk.has(j) || paras[j].t.trim().length < 4)) j++;
    if (j >= paras.length || j - i > 4) continue;
    if (/^[a-zçğıöşü(]/.test(paras[j].t.trim())) { paras[i].t = joinT(paras[i].t, paras[j].t); paras.splice(j, 1); mark(); i--; }
  }
  return paras;
}
async function importPdf(f, { arcItem = null } = {}) {
  if (!window.pdfjsLib) { toast('PDF okuyucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  closeModal();
  try {
    busy('PDF okunuyor…');
    const paras = mergeBroken(await extractPdf(f, (i, n) => busy(`PDF okunuyor, sayfa ${i}/${n}`)));
    if (paras.reduce((a, x) => a + x.t.length, 0) < 300) throw new Error('SCAN');
    const p = { id: 'p' + uid(), name: f.name.replace(/\.pdf$/i, ''), added: Date.now(), paras, tr: {}, strokes: {}, sections: [], skip: [], meta: {}, keywords: [] };
    let res = null;
    if (S.settings.key) {
      busy('Gemini bölümleri ve künyeyi belirliyor…');
      try { res = await analyze(p); } catch (err) { toast(errMsg(err) + ' Bölümler ayrılamadı, künyeyi elle girebilirsin.', 'err'); }
    } else toast('API anahtarı olmadığı için bölümler ayrılmadı. Ayarlar’dan ekleyebilirsin.', 'err');
    applyStructure(p, res); repairPaper(p);
    if (arcItem) { p.meta = JSON.parse(JSON.stringify(arcItem.meta || {})); p.keywords = (arcItem.keywords || []).slice(); p.arcId = arcItem.id; }
    else S.pendingFiles[p.id] = f;

}

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FOLDER_NAME = 'Tez Haritası', BACKUP_NAME = 'tez-haritasi-yedek.json';
const Drive = {
  tok: LS.get('th:dtok', null), folder: LS.get('th:dfolder', null), indexId: LS.get('th:dindex', null),
  ok() { return !!(this.tok && this.tok.t && this.tok.exp > Date.now() + 60000); },
  web() { return /^https?:$/.test(location.protocol); },
  redirectUri() { return location.origin + location.pathname; },
  minsLeft() { return this.ok() ? Math.max(1, Math.round((this.tok.exp - Date.now()) / 60000)) : 0; },
  async connect(after) {

    if (!S.settings.clientId) { openSettings('drive'); toast('Önce Google Client ID’yi ekle.'); return; }
    busy('Google’a yönlendiriliyor…');
    await flushSaves();
    const state = uid(); LS.set('th:dstate', state); LS.set('th:after', after || 'connected');
    const q = new URLSearchParams({ client_id: S.settings.clientId, redirect_uri: this.redirectUri(), response_type: 'token', scope: DRIVE_SCOPE, include_granted_scopes: 'true', state });
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString();
  },
  handleRedirect() {

    const h = new URLSearchParams(raw);
    history.replaceState(null, '', location.pathname + location.search);
    const st = LS.get('th:dstate', null); LS.set('th:dstate', null);
    const after = LS.get('th:after', null); LS.set('th:after', null);
    if (h.get('error')) { setTimeout(() => toast(h.get('error') === 'access_denied' ? 'Drive izni verilmedi.' : 'Drive bağlantısı kurulamadı: ' + h.get('error'), 'err'), 300); return null; }
    if (!st || h.get('state') !== st) { setTimeout(() => toast('Drive bağlantısı doğrulanamadı. Tekrar dene.', 'err'), 300); return null; }
    this.tok = { t: h.get('access_token'), exp: Date.now() + (parseInt(h.get('expires_in'), 10) || 3600) * 1000 };
    LS.set('th:dtok', this.tok);
    return after || 'connected';
  },
  disconnect() {

    this.tok = null; LS.set('th:dtok', null);
  },
  async api(url, opts = {}) {
    if (!this.ok()) throw new Error('DRIVE_AUTH');
    const r = await fetch(/^https:/.test(url) ? url : 'https://www.googleapis.com/drive/v3/' + url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + this.tok.t }, opts.headers || {}) }));
    if (r.status === 401) { this.tok = null; LS.set('th:dtok', null); throw new Error('DRIVE_AUTH'); }
    if (!r.ok) { const d = await r.json().catch(() => ({})); const e = new Error('Drive: ' + ((d.error && d.error.message) || ('HTTP ' + r.status))); e.status = r.status; throw e; }
    return r;
  },
  async json(url, opts) { return (await this.api(url, opts)).json(); },
  qs: s => encodeURIComponent(s),
  async ensureFolder() {
    if (this.folder) {
      try { const f = await this.json(`files/${this.folder}?fields=id,trashed`); if (!f.trashed) return this.folder; }
      catch (e) { if (e.message === 'DRIVE_AUTH') throw e; }
    }

  if (e.target.closest('[data-acp]')) { try { await navigator.clipboard.writeText(plain); toast('Cevap kopyalandı.'); } catch { toast('Kopyalanamadı.', 'err'); } return; }
  const qi = e.target.closest('[data-qnote]');
  if (qi && m.r) { const it = m.r.items[+qi.closest('[data-j]').dataset.j]; pickCategory({ sub: 'Alıntı, makalenin atfıyla birlikte not olarak eklenecek.' }, cat => { quoteNote(p, it, cat); notesChanged(); pulseNotes(); toast(`Alıntı “${catName(cat)}” notlarına eklendi.`); }); return; }
  if (e.target.closest('[data-qall]') && m.r) { const ok = m.r.items.filter(it => it.r); if (!ok.length) { toast('Metinde doğrulanan alıntı yok.'); return; } pickCategory({ sub: `${ok.length} alıntı ayrı ayrı not olarak eklenecek.` }, cat => { ok.forEach(it => quoteNote(p, it, cat)); notesChanged(); pulseNotes(); toast(`${ok.length} alıntı “${catName(cat)}” notlarına eklendi.`); }); return; }
  if (e.target.closest('[data-anote]')) {
    const first = (m.a.match(/\[(\d+)/) || [])[1]; const para = first !== undefined && p.paras[+first] ? +first : 0;
    pickCategory({ sub: 'Cevap, makalenin atfıyla birlikte not olarak eklenecek.' }, cat => { quoteNote(p, { p: para, quote: plain }, cat); notesChanged(); pulseNotes(); toast(`Cevap “${catName(cat)}” notlarına eklendi.`); });
  }
});

    { code: '2.6.3', title: 'KKT’nin Temel Süreçleri', level: 3, src: true, pages: '~2 sayfa', tip: 'Her süreç için aynı yapı: tanım → yaşlılıktaki karşılığı → örnek teknik veya metafor → müdahale programındaki yeri.', paras: [{ title: 'Süreçler', points: ['Kabul: İstenmeyen duygu ve düşüncelere mücadele etmeden yer açmak; yaşlılıkta değiştirilemeyen kayıpların kabulü.', 'Bilişsel ayrışma: Düşünceleri gerçeğin kendisi değil, zihnin ürünleri olarak görmek (ör. “Zihnim bana ... düşüncesini veriyor” tekniği).', 'Şimdiki anla temas: Farkındalık temelli egzersizler; geçmişe dair pişmanlık ve geleceğe dair kaygıdan uzaklaşma.', 'Bağlam olarak benlik: Gözlemleyen benlik; satranç tahtası metaforu; rol kayıplarına rağmen benliğin sürekliliği.', 'Değerler: Yaşamda neyin önemli olduğunun belirlenmesi; yaşlılık döneminde anlam bulma.', 'Kararlı eylem: Değerler doğrultusunda somut, ulaşılabilir hedefler ve davranış değişikliği.'] }] },

    { code: '2.7', title: 'Kabul ve Kararlılık Terapisi ve Hemşirelik', level: 2, src: true, pages: '~3,5 sayfa' },

async function scanPaper(p, { onStage } = {}) {

  for (const part of parts) {
    if (!planTargets().some(t => part.test(t.node.code))) { done++; continue; }
    if (onStage) onStage(parts.length > 1 ? `${part.label} için düşünülüyor (${done + 1}/${parts.length})…` : `${part.label} için derinlemesine okunuyor…`);

      if (!ids.length) { lost++; continue; }

      if (keep.some(s => s.paperId === p.id && s.target === t.key && s.para === para && s.r[0] === r[0])) continue;
      const uk = `${para}:${r[0]}`; if ((uses.get(uk) || 0) >= 2) continue; uses.set(uk, (uses.get(uk) || 0) + 1);

        strength: /olası/i.test(str(it.strength)) ? 'olası' : 'güçlü', role: ROLES.includes(str(it.role)) ? str(it.role) : 'sonuç/etki', reason: str(it.reason).slice(0, 220),

}

/* Word: headings in plan order, your paragraphs, then the quotes behind each paragraph, then the reference list */
async function exportDesk() {
  if (!window.JSZip) { toast('Word oluşturucu yüklenemedi. İnternet bağlantını kontrol et.', 'err'); return; }
  const included = [];
  const blocks = [];
  for (const n of S.plan.nodes) {
    const paras = n.paras || [];
    const items = paras.map((pa, k) => {
      const key = `${n.code}#${k + 1}`; const draft = (S.drafts[key] || '').trim(); const ns = targetNotes(key);
      const used = ns.filter(x => usedInDraft(x, draft)); const qs = used.length ? used : ns;
      qs.forEach(x => included.push(x));
      return { pa, draft, qs, usedOnly: !!used.length };
    });
    blocks.push({ n, items });
  }
  if (!included.length && !Object.values(S.drafts).some(Boolean)) { toast('Henüz yazdığın bir paragraf ya da eklediğin alıntı yok.'); return; }
  const blob = await buildDocx({ notes: included, title: 'Tez Metni', custom: ({ run, para, textRuns, sm }) => {
    let b = para(run(S.plan.topic, { i: true, color: '444444' }), { jc: 'center', after: 360 });
    for (const { n, items } of blocks) {
      const head = `${n.code}${n.level === 1 ? '.' : ''} ${n.title}`;
      b += para(run(head, { b: true, sz: n.level === 1 ? 30 : n.level === 2 ? 26 : 24 }), { before: n.level === 1 ? 400 : 240, after: 120, keep: true });
      for (const it of items) {
        if (items.length > 1) b += para(run(it.pa.title, { b: true, sz: 22, color: '24508F' }), { before: 120, after: 60, keep: true });
        if (it.draft) for (const chunk of it.draft.split(/\n\s*\n/)) b += para(textRuns(chunk.trim()), { jc: 'both', ind: '<w:ind w:firstLine="709"/>', line: 360, after: 120 });
        if (it.qs.length) {
          b += para(run(it.usedOnly ? 'Kullandığım alıntılar' : 'Bu paragraf için toplanan alıntılar', { b: true, sz: 19, color: '666666' }), { before: 80, after: 40, keep: true });
          it.qs.forEach((x, j) => { b += para(run(`${j + 1}.`, { sz: 19, color: '555555' }) + '<w:r><w:tab/></w:r>' + run(noteWithCite(x, sm), { sz: 19, color: '555555' }), { ind: '<w:ind w:left="425" w:hanging="425"/>', after: 60, line: 276 }); });
        }
      }
    }
    return b;
  } });
  downloadBlob(blob, `tez-metni-${new Date().toISOString().slice(0, 10)}.docx`);
  toast('Word indirildi: başlıklar, yazdığın paragraflar, altlarında alıntılar ve kaynakça.');
}

async function restoreData(d) {

  const ids = new Set(S.notes.map(n => n.id)); for (const n of (d.notes || [])) if (!ids.has(n.id)) S.notes.push(n);

  if (Array.isArray(d.sugs)) { const k = new Set(S.sugs.map(x => x.id)); d.sugs.forEach(x => { if (!k.has(x.id)) S.sugs.push(x); }); saveSugs(); }

  if (d.drafts) { for (const [k, v] of Object.entries(d.drafts)) if (!S.drafts[k]) S.drafts[k] = v; saveDrafts(); }
  if (d.orders) { S.orders = Object.assign({}, d.orders, S.orders); saveOrders(); }
}

function downloadBlob(blob, name) {

  };
  const textRuns = t => String(t).split(/\n/).map((ln, k) => (k ? '<w:r><w:br/></w:r>' : '') + run(ln)).join('');
  const para = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 160}" w:line="${o.line || 360}" w:lineRule="auto"/>${o.ind || ''}${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}</w:pPr>${runs}</w:p>`;
  const sm = suffixMap(set.notes);
  let body = para(run(set.title, { b: true, sz: 32 }), { jc: 'center', after: 80 });
  body += para(run(new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }), { color: '666666', sz: 20 }), { jc: 'center', after: 360 });
  if (set.custom) body += set.custom({ run, para, textRuns, sm });
  else for (const g of exportGroups(set)) {
    if (g.name) body += para(run(g.name, { b: true, sz: g.level === 1 ? 28 : g.level === 3 ? 22 : 24, i: g.level >= 2, color: g.level === 3 ? '24508F' : undefined }), { before: g.level === 1 ? 320 : g.level === 3 ? 140 : 200, after: g.level === 3 ? 80 : 140, keep: true });
    g.notes.forEach((n, k) => {
      body += para(run(`${k + 1}.`) + '<w:r><w:tab/></w:r>' + textRuns(noteWithCite(n, sm)), { ind: '<w:ind w:left="425" w:hanging="425"/>', after: 200 });
    });
  }
  const refs = citedPapers(set.notes);
  if (refs.length) {
    body += para(run('Kaynakça', { b: true }), { jc: 'center', before: 480, after: 240, keep: true });
    for (const p of refs) body += para(refParts(p, sm).map(([t, i]) => run(t, { i })).join(''), { ind: '<w:ind w:left="720" w:hanging="720"/>', line: 480, after: 0 });
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const zip = new JSZip();
  zip.file('[Content_Types].xml', types); zip.file('_rels/.rels', rels);
  zip.file('word/document.xml', doc); zip.file('word/styles.xml', styles); zip.file('word/_rels/document.xml.rels', docRels);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
const hasText = n => String(n.text || '').trim();

  const notes = S.notes.filter(n => hasText(n) && (sel === 'all' || inCat(n, sel))).sort((a, b) => rank(a) - rank(b));
  return { notes, sel, title: sel === 'all' ? 'Notlarım' : catName(sel) };
}
function exportGroups(set) {
  const ns = set.notes; const out = [];
  const block = (m, withHead) => {
    const direct = ns.filter(n => n.cat === m.id);
    const subs = subsOf(m.id).map(c => ({ c, notes: ns.filter(n => n.cat === c.id) })).filter(x => x.notes.length);
    if (!direct.length && !subs.length) return;
    const lv = withHead ? 2 : 1;
    if (withHead) out.push({ name: m.name, level: 1, notes: subs.length ? [] : direct });
    if (subs.length) {
      if (direct.length) out.push({ name: 'Genel', level: lv, notes: direct });
      subs.forEach(x => out.push({ name: x.c.name, level: lv, notes: x.notes }));
    } else if (!withHead) out.push({ name: null, level: 0, notes: direct });
  };
  if (set.sel === 'all') {
    const used = mains().filter(m => ns.some(n => inCat(n, m.id)));
    used.forEach(m => block(m, used.length > 1));
  } else {
    const c = catOf(set.sel);
    if (c && !c.parent) block(c, false); else out.push({ name: null, level: 0, notes: ns });
  }
  const base = out.length ? out : [{ name: null, level: 0, notes: ns }];
  const res = [];
  for (const g of base) {
    const by = new Map();
    for (const n of g.notes) { const t = n.plan && targetOf(n.plan.target); const k = t && t.para.title !== 'İçerik' ? t.para.title : ''; if (!by.has(k)) by.set(k, []); by.get(k).push(n); }
    if (!g.notes.length || (by.size === 1 && by.has(''))) { res.push(g); continue; }
    res.push({ ...g, notes: by.get('') || [] });
    for (const [k, list] of by) if (k) res.push({ name: k, level: 3, notes: list });
  }
  return res;
}
function openExport() {
  if (!S.notes.some(hasText)) { toast('Önce birkaç not ekle.'); return; }
  if (!window.JSZip) { toast('Word oluşturucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  const cnt = id => S.notes.filter(n => hasText(n) && inCat(n, id)).length;
  let sel = S.catView !== 'all' && cnt(S.catView) ? S.catView : 'all';
  const slug = t => t.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-');
  modal(`<h3>Word’e aktar</h3><p class="hint">Notların sırasıyla, APA 7 metin içi atıflarıyla yazılır. Kaynakça en sonda alfabetik sıradadır ve yalnızca bu notlarda geçen makaleleri içerir.</p>
    <label>Hangi notlar?<select id="xCat"><option value="all">Tüm kategoriler (${S.notes.filter(hasText).length})</option>${mains().filter(m => cnt(m.id)).map(m => `<option value="${m.id}">${esc(m.name)} (${cnt(m.id)})</option>` + subsOf(m.id).filter(c => cnt(c.id)).map(c => `<option value="${c.id}">   ${esc(m.name)} › ${esc(c.name)} (${cnt(c.id)})</option>`).join('')).join('')}</select></label>
    <div class="docprev" id="xPrev"></div>
    <label>Dosya adı<input id="xName" autocapitalize="off" spellcheck="false"></label>
    <div class="mact"><button data-close>Kapat</button><button id="xShare">Paylaş</button><button class="primary" id="xDl">İndir (.docx)</button></div>`, () => {
    let ready = null, blob = null;
    const build = () => {
      const set = exportSet(sel); const sm = suffixMap(set.notes); const refs = citedPapers(set.notes);
      $('#xPrev').innerHTML = `<h4>${esc(set.title)}</h4>` + exportGroups(set).map(g => (g.name ? `<p style="font-weight:700;margin:${g.level === 1 ? '20px 0 8px;font-size:17px' : g.level === 3 ? '8px 0 4px;font-size:13.5px;color:var(--accent)' : '12px 0 6px;font-style:italic'}">${esc(g.name)}</p>` : '') + g.notes.map((n, k) => `<p class="n">${k + 1}. ${esc(noteWithCite(n, sm))}</p>`).join('')).join('')
        + (refs.length ? `<h4 style="margin-top:22px">Kaynakça</h4>${refs.map(p => `<p class="refp">${refHTML(p, sm)}</p>`).join('')}` : '');
      $('#xName').value = slug(set.title) + '-' + new Date().toISOString().slice(0, 10);
      blob = null; ready = buildDocx(set).then(b => { blob = b; return b; });
    };
    $('#xCat').value = sel; build();
    $('#xCat').onchange = e => { sel = e.target.value; build(); };
    const fname = () => ($('#xName').value.trim() || 'Notlarim').replace(/[\\/:*?"<>|]+/g, '-') + '.docx';
    $('#xDl').onclick = async () => { const b = blob || await ready; downloadBlob(b, fname()); toast('Word dosyası indirildi.'); };
    $('#xShare').onclick = async () => {
      const b = blob || await ready;
      const file = new File([b], fname(), { type: b.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: fname() }); } catch (e) { if (e.name !== 'AbortError') toast('Paylaşılamadı. İndir düğmesini kullan.', 'err'); }
      } else { downloadBlob(b, fname()); toast('Paylaşım desteklenmiyor, dosya indirildi.'); }
    };
  });
}

/* ---------- init ---------- */
async function init() {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  S.booting = true;
  const after = Drive.handleRedirect();
  try {
    await DB.open();
    for (const k of await DB.keys()) {
      if (String(k).startsWith('paper:')) { const p = await DB.get(k); if (p && p.id) { p.strokes = p.strokes || {}; p.tr = p.tr || {}; S.papers[p.id] = p; } }
    }
    S.notes = (await DB.get('notes')) || [];
    for (const p of Object.values(S.papers)) if (repairPaper(p)) await DB.set('paper:' + p.id, p);
    S.plan = (await DB.get('plan')) || null;
    S.sugs = (await DB.get('sugs')) || [];
    S.scans = (await DB.get('scans')) || {};
    S.drafts = (await DB.get('drafts')) || {};
    S.orders = (await DB.get('orders')) || {};
    S.cats = (await DB.get('cats')) || [];
  } catch (e) {
    DB.db = null; toast('Tarayıcı depolaması kullanılamıyor. Veriler kaydedilmeyecek.', 'err');
  }
  if (!S.plan) { S.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN)); S.plan.ver = 1; savePlan(); }
  /* The plan now covers only Giriş (1) and Genel Bilgiler (2): drop everything else from older saved plans. */
  const keepTop = code => ['1', '2'].includes(String(code).split('.')[0]);
  if (S.plan.nodes.some(n => !keepTop(n.code))) {
    S.plan.nodes = S.plan.nodes.filter(n => keepTop(n.code)); savePlan();
    S.sugs = S.sugs.filter(x => keepTop(String(x.target).split('#')[0]) || x.status === 'added'); saveSugs();
    const used = new Set(S.notes.map(n => n.cat));
    S.cats = S.cats.filter(c => !/^pc-/.test(c.id) || keepTop(c.id.slice(3)) || used.has(c.id) || S.cats.some(k => k.parent === c.id && used.has(k.id)));
    if (!keepTop(S.planSel)) { S.planSel = '1.1'; LS.set('th:planSel', '1.1'); }
  }
  if (!S.plan.noDisc) {
    S.plan.nodes = S.plan.nodes.filter(n => topCode(n.code) !== '5'); S.plan.noDisc = true; savePlan();
    S.sugs = S.sugs.filter(x => topCode(x.target) !== '5' || x.status === 'added'); saveSugs();
    S.cats = S.cats.filter(c => !/^pc-5(\.|$)/.test(c.id) || S.notes.some(n => inCat(n, c.id)));
  }
  /* suggestions whose article is no longer in this app’s own library are dropped */
  const orphan = x => !S.papers[x.paperId];
  if (S.sugs.some(orphan)) { S.sugs = S.sugs.filter(x => !orphan(x)); saveSugs(); }
  for (const id of Object.keys(S.scans)) if (!S.papers[id]) delete S.scans[id];
  if (!LS.get('th:clean1', false)) {
    for (const n of S.notes) { if (!n.plan) continue; const p = S.papers[n.paperId]; let t = n.text; const h = p ? headingPrefix(t, p) : 0; if (h) t = t.slice(h); if (n.cites && n.cites.length) t = stripNumRefs(t); n.text = t; }
    const seen = new Set(); S.notes = S.notes.filter(n => { if (!n.plan) return true; const k = `${n.paperId}|${n.cat}|${String(n.text).replace(/\s+/g, ' ').trim()}`; if (seen.has(k)) return false; seen.add(k); return true; });
    saveNotes(); LS.set('th:clean1', true);
  }
  fixNotes(); syncPlanCats(); S.pane = 'sug';
  resizeOv();
  const last = LS.get('th:last', null);
  if (last && S.papers[last]) openPaper(last); else renderAll();
  openDesk();
  S.booting = false;
  if (after) {
    toast('Drive bağlandı.');
    if (!Object.keys(S.papers).length) {
      try {
        const d = await Drive.getJson(BACKUP_NAME, 'indexId');
        if (d && Object.keys(d.papers || {}).length && confirm(`Drive’da ${Object.keys(d.papers).length} makalelik bir Tez Haritası yedeği bulundu. Geri yüklensin mi?`)) { await restoreData(d); renderAll(); refreshMap(); toast('Yedek Drive’dan geri yüklendi.'); }
      } catch (e) { toast(errMsg(e), 'err'); }
    }
    await DSync.push(true);
    if (after === 'settings') openSettings('drive');
  } else if (Drive.ok() && DSync.dirty) DSync.push(true);
}
init();
})();
</script>
