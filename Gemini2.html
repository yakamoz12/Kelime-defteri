<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Makale Okuyucu">
<title>Tez Haritası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f4f5f2;--bg2:#fafaf8;--surface:#ffffff;--surface2:#eceef1;--ink:#1a2130;--muted:#5b6474;--line:#e1e4e8;
  --accent:#24508f;--accent-soft:#e5ecf7;--on-accent:#ffffff;
  --hl:#fff3bf;--trbg:#f1f5fb;--trbar:#8aa6d8;--danger:#b3261e;
  --shadow:0 12px 32px rgba(20,30,50,.14);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b;--bg2:#161a21;--surface:#1a1e26;--surface2:#232834;--ink:#e6e9ef;--muted:#98a1b0;--line:#2c323e;
  --accent:#8fb0f0;--accent-soft:#1f2a40;--on-accent:#0d1424;
  --hl:rgba(255,215,60,.26);--trbg:#182030;--trbar:#4f6fa8;--danger:#f2857b;
  --shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;-webkit-tap-highlight-color:transparent;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Rail (left menu) */
#app{height:100%;display:flex;flex-direction:row}
.rail{width:88px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;gap:6px;z-index:25}
.rail .mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:21px;margin-bottom:16px;flex:none}
.rail .grow{flex:1}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:74px;min-height:62px;padding:8px 0;border:0;border-radius:14px;background:transparent;color:var(--muted);font:600 12px var(--sans);white-space:normal;text-align:center}
.nv svg{width:26px;height:26px}
.nv.on{background:var(--accent-soft);color:var(--accent)}
.nv .badge{position:absolute;top:4px;right:8px;min-width:20px;padding:1px 6px;font-size:11px}
.nvNotes{display:none}
.work{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.work[hidden]{display:none}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;min-width:22px;text-align:center}

/* Reader column */
.main{flex:1;display:flex;min-height:0;position:relative}
.readcol{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:76px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.pname{flex:1;border:0;background:none;padding:0;min-height:0;display:block;text-align:left;min-width:0}
.pname b{display:block;font-family:var(--serif);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{display:block;color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;flex:none}
.seg[hidden]{display:none}
.seg button{border:0;background:transparent;min-height:40px;padding:4px 14px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.secbar{min-height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:8px 24px;background:var(--bg2);border-bottom:1px solid var(--line)}
.secbar[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1 1 auto;min-width:0;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;min-height:40px;padding:6px 16px;background:var(--surface2);border-color:transparent;flex:none}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.chip .ok{color:var(--accent);font-weight:700;margin-left:2px}
.chip.on .ok{color:inherit}
.ctrls{display:flex;gap:8px;align-items:center;flex:none}
.ctrls .primary{min-height:44px;border-radius:12px;padding:8px 18px}
.readbody{flex:1;min-height:0;display:flex;gap:20px;padding:20px 20px 0;position:relative}
.paper{flex:1;min-width:0;display:flex;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;overflow:hidden}
#reader{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:30px 30px 120px 26px}
.article{max-width:700px;margin:0 auto}
.sec-head{margin:0 0 22px;padding-left:16px}
.sec-head .orig{color:var(--muted);font-size:14px;font-style:italic;font-family:var(--serif)}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;margin:2px 0 0}
.notice{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.para{margin:0 0 16px}
.blk{position:relative;margin:0;padding:10px 54px 10px 16px;border-radius:10px;font-family:var(--serif);font-size:18.5px;line-height:1.68;transition:background-color .25s}
.blk p{margin:0;-webkit-hyphens:auto;hyphens:auto}
.blk.tr{background:var(--trbg);box-shadow:inset 3px 0 0 var(--trbar);margin-top:6px}
.blk.skipped{opacity:.5;font-size:15px}
.blk.noted,.blk.hl-live{background:var(--hl)}
.blk.tr.noted{box-shadow:inset 3px 0 0 var(--trbar)}
.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.addn{position:absolute;right:8px;top:10px;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.noted .addn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
svg.ink{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#reader.tooling .blk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.showskip{margin:18px 0 0;color:var(--muted);background:transparent}

/* Empty state */
.empty{max-width:560px;margin:5vh auto 0;text-align:left}
.empty h2{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.15;margin:0 0 10px}
.empty p.lead{color:var(--muted);font-size:17px;margin:0 0 24px}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.big{min-height:52px;padding:10px 22px;font-size:16px;border-radius:12px}
.steps{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.steps li span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}

/* Pencil palette (vertical) */
.toolbar{width:64px;flex:none;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(20,30,50,.08);z-index:20}
.toolbar[hidden]{display:none}
.tool{width:52px;height:52px;min-height:0;padding:0;border:0;background:transparent;border-radius:14px;color:var(--ink)}
.tool svg{width:24px;height:24px}
.tool span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tool.on{background:var(--accent);color:var(--on-accent)}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin:2px 0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.tsep{width:36px;height:1px;background:var(--line);margin:6px 0}
.selpill{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;z-index:21;box-shadow:var(--shadow);min-height:48px;border-radius:14px}
.selpill[hidden]{display:none}

/* Notes column */
.notes{width:340px;flex:none;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.nhead{height:76px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.nhead h3{margin:0;flex:1;font-family:var(--serif);font-size:21px;font-weight:600}
.nhead .outline{border-color:var(--accent);color:var(--accent);font-weight:600;min-height:44px;border-radius:12px}
#notesList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:12px}
.note-top{display:flex;align-items:center;gap:8px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700}
.src{flex:1;min-width:0;border:0;background:none;padding:0;min-height:30px;justify-content:flex-start;color:var(--accent);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.src.free{color:var(--muted)}
.nact button{min-height:34px;width:34px;padding:0;border:0;background:transparent;color:var(--muted)}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;font-family:var(--serif);font-size:15.5px;line-height:1.55;padding:6px 0 0;outline:none;overflow:hidden;min-height:48px}
.cite{color:var(--muted);font-size:12.5px;margin-top:4px}
.empty-notes{color:var(--muted);text-align:center;padding:30px 10px;font-size:14.5px}
.empty-notes b{color:var(--ink)}
.nbottom{flex:none;padding:14px;border-top:1px solid var(--line);background:var(--surface)}
.nbottom button{width:100%;min-height:52px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:15.5px}
.nclose{display:none}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.pane[hidden]{display:none}
#bExport[hidden]{display:none}
#paneTabs button{min-height:40px;padding:4px 12px;font-size:14px}
.asklog{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:10px}
.askintro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.askintro b{font-family:var(--serif);font-size:17px}
.askintro p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.asksug{display:flex;flex-direction:column;gap:8px}
.asksug button{justify-content:flex-start;text-align:left;white-space:normal;min-height:46px;border-radius:12px;font-size:14.5px;background:var(--surface)}
.askbar{display:flex;justify-content:flex-end}
.link{border:0;background:none;color:var(--muted);font-size:13px;min-height:32px;padding:0 4px;text-decoration:underline}
.qbub{align-self:flex-end;max-width:88%;background:var(--accent);color:var(--on-accent);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.abub{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px}
.abub.err{border-color:var(--danger);color:var(--danger)}
.abub.wait{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px}
.atext{font-family:var(--serif);font-size:15.5px;line-height:1.6;white-space:pre-wrap}
.pref{display:inline-flex;min-height:24px;padding:0 7px;margin:0 2px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent);font:700 12px var(--sans);vertical-align:1px}
.aact{display:flex;gap:8px;margin-top:10px}
.aact button{min-height:38px;font-size:13.5px;border-radius:10px}
.askin{flex:none;display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface)}
.askin textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.4 var(--sans);background:var(--bg);color:var(--ink);max-height:140px}
.askin button{min-height:46px;border-radius:12px;padding:0 18px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
mark.qm{background:rgba(36,80,143,.10);color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2.5px;text-underline-offset:4px;border-radius:3px;padding:1px 0}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;display:inline-block}
.chip.on .qdot{background:var(--on-accent)}
.abub.act{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.aintro{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.qitem{padding:10px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:2px}
.qitem blockquote{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.55;border-left:3px solid var(--accent);padding-left:10px}
.qitem.nf blockquote{border-left-color:var(--danger)}
.qmeta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.qwarn{color:var(--danger);font-weight:600}
.qadd{min-height:32px;padding:2px 10px;font-size:12.5px;border-radius:9px}
.qnote{margin-top:6px;font-size:13.5px;color:var(--muted)}
.asum{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.catbar{min-height:60px;flex-direction:column;align-items:stretch;gap:6px;overflow:visible}
.crow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.crow::-webkit-scrollbar{display:none}
.crow.sub{padding:6px 0 0;border-top:1px dashed var(--line)}
.crow.sub .chip{min-height:32px;font-size:13px}
.crow.sub{overflow:visible}
.cscroll{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.cscroll::-webkit-scrollbar{display:none}
.cedit{flex:none;min-height:34px;padding:4px 10px;gap:5px;font-size:13px;font-weight:600;border-radius:10px;color:var(--accent);border-color:var(--accent-soft)}
.quick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:58px;padding:8px 16px;margin-top:14px;border-color:var(--accent);background:var(--accent-soft);text-align:left;white-space:normal}
.quick small{font-size:12px;font-weight:600;color:var(--muted)}
.quick b{font-size:16px;color:var(--accent)}
.picklist button.direct{background:var(--surface2)}
.catbar .chip{min-height:36px;padding:4px 13px;font-size:13.5px;font-weight:600;background:transparent;color:var(--muted)}
.catbar .chip.on{background:var(--accent);color:var(--on-accent)}

/* Archive screen */
.arc{flex:1;min-height:0;display:flex}
.afold{width:240px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:22px 12px 16px;overflow-y:auto}
.afold h2{margin:0 6px 16px;font-family:var(--serif);font-weight:600;font-size:26px}
.fd{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;min-height:52px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:500;text-align:left;white-space:normal}
.fd svg{width:22px;height:22px;flex:none;color:var(--muted)}
.fd span{flex:1}
.fd small{font-size:13px;font-weight:600;color:var(--muted)}
.fd.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fd.on svg,.fd.on small{color:var(--accent)}
.fd.ghost{color:var(--muted)}
.astat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.astat b{display:block;font-weight:600}
.astat small{display:block;color:var(--muted);font-size:12px}
.astat button{min-height:38px;padding:4px 12px;margin-left:auto;font-size:13.5px}
.amain{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 22px 0}
.atop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asearch{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;border-radius:14px;background:var(--surface);border:2px solid var(--accent);min-width:0}
.asearch svg{flex:none;color:var(--accent)}
.asearch input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:500 17px var(--sans);color:var(--ink);padding:0;margin:0}
.atop .primary,.atop button{min-height:54px;border-radius:14px}
.afbar{display:none;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.afbar::-webkit-scrollbar{display:none}
.afbar .chip{min-height:38px;font-size:14px}
.afbar .chip small{opacity:.65;margin-left:4px;font-weight:600;font-size:12px}
.afbar .astat{flex:none;padding:4px 10px}
.alist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding-bottom:24px}
.arow{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid transparent;cursor:pointer}
.arow.on{background:var(--surface);border-color:var(--accent-soft);box-shadow:0 4px 14px rgba(20,30,50,.06)}
.ficon{flex:none;width:40px;height:50px;border-radius:5px 14px 5px 5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.ficon.none{background:var(--surface2);color:var(--muted)}
.arname{border:0;background:none;padding:0;min-height:0;display:block;text-align:left;white-space:normal;width:100%;color:var(--ink)}
.arname b{display:block;font-weight:600;font-size:16px;line-height:1.35;word-break:break-word}
.arname small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35;font-weight:400}
.arow .kw{margin:10px 0 0}
.adetail{width:320px;flex:none;background:var(--surface);border-left:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.adetail h3{margin:0;font-size:17px;font-weight:600;word-break:break-word}
.adetail .lb{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.adetail .refp{margin:0}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Overlay canvas, modal, busy, toast */

.llast{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;margin-bottom:4px}

.trnote{color:var(--muted);font-size:13.5px;font-weight:600}

.stags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.sok{color:#1f7a4a}
.spoint{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.scard blockquote{margin:6px 0;font-family:var(--serif);font-size:15.5px;line-height:1.55;border-left:3px solid var(--accent);padding-left:10px}
.smeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.srole{background:var(--surface2);border-radius:999px;padding:3px 9px;font-weight:600}
.sreason{font-size:13.5px;color:var(--ink);margin-top:6px}
.swarn{font-size:12.5px;color:#8a5a00;background:#fff4d6;border-radius:8px;padding:6px 9px;margin-top:6px}

.swarnt{color:#8a5a00}
.sfilt button{font-size:13px;padding:4px 8px}

.warnt{color:#8a5a00}
.plegend{display:inline-flex;align-items:center;gap:6px;margin-left:auto}

.pcrumb{font-size:12.5px;color:var(--muted);font-weight:600}

.ptip{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.ptip.muted{background:var(--surface2);color:var(--muted)}

.pshead b{font-size:15.5px}

.kwsout .kw{margin-top:8px}

.scite{background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:13px}

</style>
</head>

const OK_CH = /[\u0000-\u036F\u0370-\u03FF\u2000-\u206F\u20A0-\u20CF\u2100-\u214F\u2190-\u23FF\u25A0-\u25FF\uFB00-\uFB06]/u;

async function extractPdf(file, onProg, maxPages = Infinity) {

async function gemini(prompt, { json = true, temperature = 0.2 } = {}) {
  const parts = Array.isArray(prompt) ? prompt : [{ text: prompt }];
  const key = String(S.settings.key || '').trim(); if (!key) throw new Error('NOKEY');
  const model = String(S.settings.model || '').trim() || 'gemini-2.5-flash';
  const gc = { temperature };
  if (json) gc.responseMimeType = 'application/json';
  if (/2\.5-flash/.test(model)) gc.thinkingConfig = { thinkingBudget: 0 };
  let last = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    const wait = gemNext - Date.now(); if (wait > 0) await sleep(wait);
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: gc })
    });
    const data = await r.json().catch(() => ({}));
    gemNext = Date.now() + gemGap;
    if (r.status === 429 || r.status === 503 || r.status === 500) {
      const det = (data.error && data.error.details) || [];
      if (r.status === 429 && /PerDay|per day|daily/i.test(JSON.stringify(det) + ((data.error && data.error.message) || ''))) throw new Error('DAILY_QUOTA');
      last = new Error((data.error && data.error.message) || ('HTTP ' + r.status + ' RESOURCE_EXHAUSTED'));
      if (r.status === 429) gemGap = Math.max(gemGap, 6500);
      const ri = det.find(d => /RetryInfo/.test(d['@type'] || ''));
      const ms = Math.min(90000, (ri && parseFloat(ri.retryDelay) * 1000) || 8000 * (attempt + 1)) + 1000;
      const sec = Math.round(ms / 1000);
      if (gemWaitCb) gemWaitCb(sec);
      if (!$('#busy').hidden) busy(`Gemini ücretsiz sınırına takıldı, ${sec} sn bekleyip devam edeceğim…`);
      await sleep(ms); continue;
    }
    if (!r.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + r.status));
    const c = data.candidates && data.candidates[0];
    const txt = ((c && c.content && c.content.parts) || []).map(p => p.text || '').join('');
    if (!txt) throw new Error('Gemini boş yanıt döndürdü' + (c && c.finishReason ? ` (${c.finishReason})` : '') + '.');
    return json ? parseJSON(txt) : txt;
  }
  throw last || new Error('Gemini yanıt vermedi.');
}
function errMsg(e) {
  const m = String((e && e.message) || e);
  if (m === 'NOKEY') return 'Gemini API anahtarı eklenmemiş. Ayarlar’dan ekle.';
  if (/API key not valid|API_KEY_INVALID|API key expired/i.test(m)) return 'API anahtarı geçersiz. Ayarlar’dan kontrol et.';
  if (m === 'DAILY_QUOTA') return 'Gemini’nin günlük ücretsiz kotası doldu. Yarın tekrar dene ya da Ayarlar’dan “Flash-Lite” modelini seç.';
  if (/429|quota|RESOURCE_EXHAUSTED|rate/i.test(m)) return 'Ücretsiz kullanım sınırına ulaşıldı. Bir dakika bekleyip tekrar dene.';
  if (m === 'DRIVE_AUTH') return 'Drive oturumu sona erdi. Arşiv’den ya da Ayarlar’dan tekrar bağlan.';
  if (/^Drive/.test(m)) return m.replace(/^Drive: /, 'Drive hatası: ');
  if (/not found|is not supported|404/i.test(m)) return 'Model bulunamadı. Ayarlar’dan başka bir model seç.';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Bağlantı kurulamadı. İnternetini kontrol et.';
  return 'Hata: ' + m;
}

async function listModels(key) {
  const all = []; let tok = '';

    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''), { headers: { 'x-goog-api-key': key } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
    all.push(...(d.models || [])); tok = d.nextPageToken || '';

  const notText = /embedding|imagen|veo|tts|image|audio|aqa|live|robotics|computer-use|lyria/i;
  const gem = id => /^gemini/.test(id) ? 1 : 0;
  return all.filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && !notText.test(m.name || ''))
    .map(m => ({ id: String(m.name).replace(/^models\//, ''), label: m.displayName || String(m.name).replace(/^models\//, '') }))

  secs.forEach((s, i) => { s.end = i < secs.length - 1 ? secs[i + 1].start - 1 : N - 1; });

async function translateBatch(texts) {

async function translateCurrent() {
  const p = curPaper(); if (!p || S.translating) return;
  if (!S.settings.key) { openSettings(); toast('Önce Gemini API anahtarını ekle.'); return; }
  const todo = trTodo(p, S.sec);
  if (!todo.length) return;
  const batches = []; let cur = [], len = 0;
  for (const i of todo) {
    const l = p.paras[i].t.length;
    if (cur.length && (len + l > 4500 || cur.length >= 18)) { batches.push(cur); cur = []; len = 0; }
    cur.push(i); len += l;
  }
  if (cur.length) batches.push(cur);
  S.translating = true; let done = 0;
  S.trText = `Çevriliyor 0/${todo.length}`; renderSectionBar();
  gemWaitCb = sec => { S.trText = `Sınır: ${sec} sn bekleniyor`; renderSectionBar(); };
  try {
    for (const b of batches) {
      const out = await translateBatch(b.map(i => p.paras[i].t));
      b.forEach((i, k) => { if (out[k] && out[k].trim()) p.tr[i] = out[k].trim(); });
      done += b.length; S.trText = `Çevriliyor ${done}/${todo.length}`;
      savePaper(p, 300);
      if (S.cur === p.id) { if (S.view === 'orig') S.view = 'both'; renderReader(true); }
      renderSectionBar();

/* ---------- categories (two levels: main › sub) ---------- */

const subsOf = id => S.cats.filter(c => c.parent === id);

const inCat = (n, id) => { if (n.cat === id) return true; const c = catOf(n.cat); return !!(c && c.parent === id); };
const catCount = id => S.notes.filter(n => inCat(n, id)).length;
const visibleNotes = () => S.catView === 'all' ? S.notes : S.notes.filter(n => inCat(n, S.catView));
const selMain = () => { const c = catOf(S.catView); return c ? (c.parent || c.id) : null; };
function newCat(name, parent = null) { const c = { id: 'c' + uid(), name: name.trim(), parent }; S.cats.push(c); saveCats(); return c; }
function setCatView(v) { S.catView = v; LS.set('th:catView', v); renderNotes(); }
function fixNotes() {
  if (!S.cats.length) S.cats.push({ id: 'c-genel', name: 'Genel', parent: null });

  }

function catNameModal(title, value, onOk, hint = '') {

function editCat(id) {

  const kids = subsOf(id); const family = new Set([id, ...kids.map(k => k.id)]);
  const others = S.cats.filter(x => !family.has(x.id)); const cnt = catCount(id);

        <label>Notları şuraya taşı<select id="cTo">${others.map(o => `<option value="${o.id}">${esc(catName(o.id))}</option>`).join('')}</select></label>
        <div class="mact"><button class="danger" id="cAll">Notlarla birlikte sil</button><button data-close>Vazgeç</button><button class="primary" id="cMove">Taşı ve sil</button></div>`, () => {
        $('#cMove').onclick = () => { const to = $('#cTo').value; S.notes.forEach(n => { if (family.has(n.cat)) n.cat = to; }); saveNotes(); closeModal(); drop(); toast(`Notlar “${catName(to)}” kategorisine taşındı.`); };
        $('#cAll').onclick = () => { if (!confirm(`${cnt} not kalıcı olarak silinecek. Emin misin?`)) return; S.notes = S.notes.filter(n => !family.has(n.cat)); saveNotes(); closeModal(); drop(); toast('Kategori ve notları silindi.'); };

}
function pickCategory({ title = 'Hangi nota eklensin?', sub = '', has = [], onRemove = null } = {}, done) {
  const last = catOf(LS.get('th:lastCat', null));
  const finish = id => { LS.set('th:lastCat', id); closeModal(); renderCatBar(); done(id); };
  const step = (mainId) => {
    const m = mainId ? catOf(mainId) : null;
    const items = m ? [m, ...subsOf(m.id)] : mains();
    const lab = c => m && c.id === m.id ? `Doğrudan “${c.name}”` : c.name;
    const meta = c => has.includes(c.id) ? 'Ekli ✓' : (!m && subsOf(c.id).length ? `${subsOf(c.id).length} alt kategori ›` : catCount(c.id) + ' not');
    modal(`<h3>${esc(m ? m.name : title)}</h3>${sub && !m ? `<p class="hint">${esc(sub)}</p>` : ''}
      ${!m && last && !has.includes(last.id) ? `<button class="quick" data-pick="${last.id}"><small>Son kullanılan</small><b>${esc(catName(last.id))}</b></button>` : ''}
      <div class="picklist">${items.map(c => `<button data-pick="${c.id}" ${has.includes(c.id) ? 'disabled' : ''} class="${m && c.id === m.id ? 'direct' : ''}"><span>${esc(lab(c))}</span><small>${meta(c)}</small></button>`).join('')}</div>
      <div class="newcat"><input id="pkNew" placeholder="${m ? `“${esc(m.name)}” altında yeni alt kategori` : 'Yeni ana kategori (ör. Tez)'}" autocomplete="off"><button id="pkAdd">Oluştur ve ekle</button></div>
      <div class="mact">${onRemove ? '<button class="danger" id="pkDel">Notlardan çıkar</button>' : ''}${m ? '<button id="pkBack">‹ Geri</button>' : ''}<button data-close>Vazgeç</button></div>`, box => {
      box.addEventListener('click', e => {

/* ---------- notes ---------- */
function addNoteFromBlk(p, b, text, cat) {
  const i = +b.dataset.p, l = b.dataset.l;
  const full = l === 't' ? p.tr[i] : p.paras[i].t;
  const t = String(text || full || '').trim(); if (!t) return false;
  if (!text && S.notes.some(n => n.paperId === p.id && n.para === i && n.lang === l && !n.partial && n.cat === cat)) return false;
  const s = secOf(p, i);
  S.notes.push({ id: uid(), paperId: p.id, para: i, lang: l, secTitle: s ? s.title : '', text: t, partial: !!text, cat, created: Date.now() });
  return true;
}
function notesChanged() { saveNotes(); renderNotes(); refreshNoted(); renderHeader(); }
function removeNoteAt(k) {
  const [n] = S.notes.splice(k, 1); notesChanged();
  toast('Not silindi.', '', { label: 'Geri al', fn: () => { S.notes.splice(k, 0, n); notesChanged(); } });
}
function swapNotes(a, b) { const i = S.notes.indexOf(a), j = S.notes.indexOf(b); S.notes[i] = b; S.notes[j] = a; saveNotes(); renderNotes(); }
function pulseNotes() {
  const b = $('#bNotes'); b.animate && b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 380 });
}
function jumpTo(n) {
  const p = S.papers[n.paperId]; if (!p) return;
  if (S.cur !== p.id) openPaper(p.id);
  const k = p.sections.findIndex(s => n.para >= s.start && n.para <= s.end);
  if (k >= 0 && k !== S.sec) { S.sec = k; p.lastSec = k; }
  if ((n.lang === 't' && S.view === 'orig') || (n.lang === 'o' && S.view === 'tr')) S.view = 'both';
  renderSectionBar(); renderReader();
  const b = R.querySelector(`.blk[data-p="${n.para}"][data-l="${n.lang}"]`) || R.querySelector(`.blk[data-p="${n.para}"]`);
  if (b) { b.scrollIntoView({ block: 'center', behavior: 'smooth' }); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 1700); }
  if (innerWidth <= 1100) document.body.classList.remove('notes-open');
}
$('#notesList').addEventListener('click', e => {
  const card = e.target.closest('.note'); if (!card) return;

    blks.forEach(b => b.classList.add('hl-live'));

      clear();
      let added = 0; for (const b of blks) if (addNoteFromBlk(p, b, null, cat)) added++;
      if (added) { notesChanged(); pulseNotes(); toast(`${added === 1 ? 'Paragraf' : added + ' paragraf'} “${catName(cat)}” notlarına eklendi.`); }

    const r = b.getBoundingClientRect(); if (!r.width || !r.height) return;

R.addEventListener('pointerup', finish);

function eraseAt(x, y) {
  const p = curPaper(); if (!p || !p.strokes) return; let changed = false;
  for (const b of $$('.blk', R)) {
    const key = b.dataset.p + ':' + b.dataset.l; const arr = p.strokes[key]; if (!arr || !arr.length) continue;

    for (let k = arr.length - 1; k >= 0; k--) {
      const s = arr[k];
      if (s.pts.some(([fx, fy]) => Math.hypot(r.left + fx * r.width - x, r.top + fy * r.height - y) < 16)) {
        arr.splice(k, 1); S.undo.push({ pid: p.id, key, stroke: s, type: 'erase' }); changed = true;
      }

  }
  if (changed) savePaper(p, 600);
}

  const u = S.undo.pop(); if (!u) { toast('Geri alınacak çizim yok.'); return; }

  const b = R.querySelector(`.blk[data-p="${pi}"][data-l="${l}"]`); if (b) drawInk(b, p);

async function importPdf(f, { arcItem = null } = {}) {
  if (!window.pdfjsLib) { toast('PDF okuyucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  closeModal();
  try {
    busy('PDF okunuyor…');
    const paras = await extractPdf(f, (i, n) => busy(`PDF okunuyor, sayfa ${i}/${n}`));
    if (paras.reduce((a, x) => a + x.t.length, 0) < 300) throw new Error('SCAN');
    const p = { id: 'p' + uid(), name: f.name.replace(/\.pdf$/i, ''), added: Date.now(), paras, tr: {}, strokes: {}, sections: [], skip: [], meta: {}, keywords: [] };
    let res = null;
    if (S.settings.key) {
      busy('Gemini bölümleri ve künyeyi belirliyor…');
      try { res = await analyze(p); } catch (err) { toast(errMsg(err) + ' Bölümler ayrılamadı, künyeyi elle girebilirsin.', 'err'); }
    } else toast('API anahtarı olmadığı için bölümler ayrılmadı. Ayarlar’dan ekleyebilirsin.', 'err');
    applyStructure(p, res); repairPaper(p);
    if (arcItem) { p.meta = JSON.parse(JSON.stringify(arcItem.meta || {})); p.keywords = (arcItem.keywords || []).slice(); p.arcId = arcItem.id; }
    else S.pendingFiles[p.id] = f;
    S.papers[p.id] = p; savePaper(p);
    busy(false); S.view = 'orig'; openPaper(p.id);
    if (arcItem) toast('Makale arşivden okumaya açıldı.'); else openMeta(p.id, true);
  } catch (err) {
    busy(false);
    toast(err.message === 'SCAN' ? 'Bu PDF’ten metin çıkarılamadı. Taranmış bir görüntü olabilir.' : errMsg(err), 'err');
  }
}
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importPdf(f);
});

/* ---------- Google Drive ---------- */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FOLDER_NAME = 'Makale Arşivi', INDEX_NAME = 'arsiv-dizini.json', BACKUP_NAME = 'tez-haritasi-yedek.json';
const Drive = {
  tok: LS.get('th:dtok', null), folder: LS.get('th:dfolder', null), indexId: LS.get('th:dindex', null),
  ok() { return !!(this.tok && this.tok.t && this.tok.exp > Date.now() + 60000); },
  web() { return /^https?:$/.test(location.protocol); },
  redirectUri() { return location.origin + location.pathname; },
  minsLeft() { return this.ok() ? Math.max(1, Math.round((this.tok.exp - Date.now()) / 60000)) : 0; },
  async connect(after) {
    if (!this.web()) { toast('Drive bağlantısı için uygulamanın bir https adresinden açılması gerekiyor. Ayarlar’daki kurulum adımlarına bak.', 'err'); return; }
    if (!S.settings.clientId) { openSettings('drive'); toast('Önce Google Client ID’yi ekle.'); return; }
    busy('Google’a yönlendiriliyor…');
    await flushSaves();
    const state = uid(); LS.set('th:dstate', state); LS.set('th:after', after || 'connected');
    const q = new URLSearchParams({ client_id: S.settings.clientId, redirect_uri: this.redirectUri(), response_type: 'token', scope: DRIVE_SCOPE, include_granted_scopes: 'true', state });
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + q.toString();
  },
  handleRedirect() {
    const raw = location.hash.slice(1);
    if (!/(^|&)(access_token|error)=/.test(raw)) return null;
    const h = new URLSearchParams(raw);
    history.replaceState(null, '', location.pathname + location.search);
    const st = LS.get('th:dstate', null); LS.set('th:dstate', null);
    const after = LS.get('th:after', null); LS.set('th:after', null);
    if (h.get('error')) { setTimeout(() => toast(h.get('error') === 'access_denied' ? 'Drive izni verilmedi.' : 'Drive bağlantısı kurulamadı: ' + h.get('error'), 'err'), 300); return null; }
    if (!st || h.get('state') !== st) { setTimeout(() => toast('Drive bağlantısı doğrulanamadı. Tekrar dene.', 'err'), 300); return null; }
    this.tok = { t: h.get('access_token'), exp: Date.now() + (parseInt(h.get('expires_in'), 10) || 3600) * 1000 };
    LS.set('th:dtok', this.tok);
    return after || 'connected';
  },
  disconnect() {
    if (this.tok && this.tok.t) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(this.tok.t), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }).catch(() => {});
    this.tok = null; LS.set('th:dtok', null);
  },
  async api(url, opts = {}) {
    if (!this.ok()) throw new Error('DRIVE_AUTH');
    const r = await fetch(/^https:/.test(url) ? url : 'https://www.googleapis.com/drive/v3/' + url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + this.tok.t }, opts.headers || {}) }));
    if (r.status === 401) { this.tok = null; LS.set('th:dtok', null); throw new Error('DRIVE_AUTH'); }
    if (!r.ok) { const d = await r.json().catch(() => ({})); const e = new Error('Drive: ' + ((d.error && d.error.message) || ('HTTP ' + r.status))); e.status = r.status; throw e; }
    return r;
  },
  async json(url, opts) { return (await this.api(url, opts)).json(); },
  qs: s => encodeURIComponent(s),
  async ensureFolder() {
    if (this.folder) {
      try { const f = await this.json(`files/${this.folder}?fields=id,trashed`); if (!f.trashed) return this.folder; }
      catch (e) { if (e.message === 'DRIVE_AUTH') throw e; }

    let id = res.files && res.files[0] && res.files[0].id;
    if (!id) id = (await this.json('files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }) })).id;
    this.folder = id; LS.set('th:dfolder', id); return id;
  },
  async findFile(name) {
    const folder = await this.ensureFolder();
    const res = await this.json(`files?q=${this.qs(`name='${name}' and '${folder}' in parents and trashed=false`)}&fields=files(id)&spaces=drive`);
    return (res.files && res.files[0]) || null;
  },
  async upload(blob, meta, fileId) {
    const type = blob.type || 'application/octet-stream';

    const r = await this.api(base + '?uploadType=resumable&fields=id,name', { method: fileId ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': type }, body: JSON.stringify(meta || {}) });
    const loc = r.headers.get('Location');
    if (loc) {

    const b = 'mo' + uid();

  },
  async getJson(name, idKey) {

    const f = await this.findFile(name); if (!f) return null;
    if (idKey) { this[idKey] = f.id; LS.set('th:dindex', f.id); }
    return (await this.api(`files/${f.id}?alt=media`)).json().catch(() => null);
  }
};

  if (e.target.closest('[data-qshow]')) { S.qk[p.id] = k; renderAsk(); refreshMarks(); toast('Alıntıların altı metinde çizildi.'); return; }
  const plain = m.a.replace(/\*\*(.+?)\*\*/g, '$1').replace(/\s*\[(\d+)(?:\s*[,–-]\s*(\d+))*\]/g, '').trim();
  if (e.target.closest('[data-acp]')) { try { await navigator.clipboard.writeText(plain); toast('Cevap kopyalandı.'); } catch { toast('Kopyalanamadı.', 'err'); } return; }
  const qi = e.target.closest('[data-qnote]');
  if (qi && m.r) { const it = m.r.items[+qi.closest('[data-j]').dataset.j]; pickCategory({ sub: 'Alıntı, makalenin atfıyla birlikte not olarak eklenecek.' }, cat => { quoteNote(p, it, cat); notesChanged(); pulseNotes(); toast(`Alıntı “${catName(cat)}” notlarına eklendi.`); }); return; }
  if (e.target.closest('[data-qall]') && m.r) { const ok = m.r.items.filter(it => it.r); if (!ok.length) { toast('Metinde doğrulanan alıntı yok.'); return; } pickCategory({ sub: `${ok.length} alıntı ayrı ayrı not olarak eklenecek.` }, cat => { ok.forEach(it => quoteNote(p, it, cat)); notesChanged(); pulseNotes(); toast(`${ok.length} alıntı “${catName(cat)}” notlarına eklendi.`); }); return; }
  if (e.target.closest('[data-anote]')) {
    const first = (m.a.match(/\[(\d+)/) || [])[1]; const para = first !== undefined && p.paras[+first] ? +first : 0;
    pickCategory({ sub: 'Cevap, makalenin atfıyla birlikte not olarak eklenecek.' }, cat => { quoteNote(p, { p: para, quote: plain }, cat); notesChanged(); pulseNotes(); toast(`Cevap “${catName(cat)}” notlarına eklendi.`); });
  }
});

    { code: '2.7.3', title: 'Araştırmanın Kuramsal Çerçevesi', level: 3, src: true, pages: '~1¼ sayfa', tip: 'Jüri, müdahalenin bir hemşirelik kuramına dayandırılmasını sıklıkla bekler. Kuram seçimini danışmanınızla yapın ve aynı kuramı Tartışma’da da kullanın.', paras: [{ title: 'İçerik', points: ['Reed’in Öz-Aşkınlık Kuramı: yaşlılık, kırılganlık ve iyi oluş ilişkisi; pozitif yaşlanma ve KKT ile güçlü uyum.', 'Roy Adaptasyon Modeli: yaşlılıktaki değişimlere psikososyal uyum.', 'Peplau’nun Kişilerarası İlişkiler Kuramı: terapötik ilişki ve grup süreci.', 'Kuram kavramlarının KKT süreçleri ve araştırma değişkenleriyle eşleştirilmesi.'] }] }
  ]
};

/* ---------- thesis map: plan, suggestions, scanning ---------- */
const ROLES = ['tanım', 'kuram', 'istatistik', 'risk faktörü', 'sonuç/etki', 'müdahale: etkili', 'müdahale: etkisiz/farklı', 'yöntem/ölçek', 'uygulama'];
S.plan = null; S.sugs = []; S.scans = {}; S.planSel = LS.get('th:planSel', '1.1'); S.sugFilter = 'pending';
const saveSugs = () => DB.set('sugs', S.sugs).catch(() => toast('Öneriler kaydedilemedi.', 'err'));
const saveScans = () => DB.set('scans', S.scans).catch(() => {});
const savePlan = () => DB.set('plan', S.plan).catch(() => toast('Plan kaydedilemedi.', 'err'));
const planNode = code => S.plan.nodes.find(n => n.code === code) || null;
const topCode = code => String(code).split('.')[0];
function planTargets(all = false) {
  const out = [];
  for (const n of S.plan.nodes) (n.paras || []).forEach((p, k) => {
    if (!all && (!n.src || p.src === false)) return;
    out.push({ key: `${n.code}#${k + 1}`, node: n, para: p, k });
  });
  return out;
}
const targetOf = key => { const [c, k] = String(key).split('#'); const n = planNode(c); const p = n && n.paras && n.paras[+k - 1]; return p ? { key, node: n, para: p, k: +k - 1 } : null; };
const targetLabel = t => t ? `${t.node.code} ${t.node.title}${t.node.paras.length > 1 || !/^İçerik$/.test(t.para.title) ? ' › ' + t.para.title : ''}` : 'Bilinmeyen başlık';
function shortTarget(key) { const t = targetOf(key); if (!t) return key; const m = t.para.title.match(/^(Paragraf|Adım) (\d+)/); return t.node.code + (m ? ` ${m[1]} ${m[2]}` : ''); }
const targetGoal = t => Math.max(2, Math.ceil((t.para.points || []).length * 0.8));
const paperYear = p => parseInt((p && p.meta && p.meta.year) || '', 10) || null;

/* plan headings become note categories: main = chapter, sub = section */
function syncPlanCats() {
  const tops = S.plan.nodes.filter(n => n.level === 1 && n.src);
  for (const t of tops) {
    const id = 'pc-' + t.code; const name = `${t.code}. ${t.title}`;
    const c = catOf(id); if (c) c.name = name; else S.cats.push({ id, name, parent: null });
  }
  for (const n of S.plan.nodes) {
    if (n.level === 1 || !n.paras || !n.paras.length || !n.src) continue;
    const id = 'pc-' + n.code; const name = `${n.code} ${n.title}`; const parent = 'pc-' + topCode(n.code);
    if (!catOf(parent)) continue;
    const c = catOf(id); if (c) { c.name = name; c.parent = parent; } else S.cats.push({ id, name, parent });
  }
  saveCats();
}
const catForTarget = t => t.node.level === 1 ? 'pc-' + t.node.code : 'pc-' + t.node.code;

/* ---------- scanning an article against the plan ---------- */
function planPrompt() {
  return planTargets().map(t => `[${t.key}] ${t.node.code} ${t.node.title} › ${t.para.title}\n${(t.para.points || []).map((x, i) => `   (${i + 1}) ${x}`).join('\n')}`).join('\n');
}
async function scanPaper(p, { quiet = false } = {}) {
  if (!S.settings.key) throw new Error('NOKEY');
  const sk = new Set(p.skip || []); const lines = [];
  p.sections.forEach((s, k) => {
    if (isNoTr(s) && !/başlık ve künye/i.test(s.title)) return;
    for (let i = s.start; i <= s.end; i++) if (!sk.has(i) && wordy(p.paras[i].t)) lines.push(`[${i}] (${s.title}) ${p.paras[i].t}`);
  });
  let body = lines.join('\n'); if (body.length > 400000) body = body.slice(0, 400000);
  const prompt = `Sen bir hemşirelik doktora tezi danışmanı gibi çalışan akademik asistansın. Aşağıda öğrencinin TEZ KONUSU, tez planındaki başlıklar ve her başlığın paragraf iskeleti (maddeler) var. Ardından bir makalenin numaralandırılmış paragrafları var.
Görevin: Bu makalede, tezin belirli bir paragrafında kaynak olarak kullanılabilecek cümleleri bulmak.
Kurallar:
- Her öneri için: "p" makale paragraf numarası; "quote" makaleden HARFİ HARFİNE cümle(ler) (tek paragraftan, kelime değiştirme, kısaltma ya da çeviri yok); "target" önerinin gideceği iskelet kimliği (köşeli parantezdeki, ör. "2.3.2#1"); "point" o iskeletteki uygun madde numarası (yoksa 0); "role" şunlardan biri: ${ROLES.join(', ')}; "reason" en fazla 20 kelimelik Türkçe gerekçe; "cites" cümle başka bir kaynağa atıf yapıyorsa o kaynak(lar) APA metin içi biçimde (ör. ["Hayes vd., 2006"]), makalenin kendi ifadesi ya da bulgusuysa boş liste.
- Makalenin KENDİ bulgularını, tanımlarını ve sonuçlarını tercih et. Makalenin başka çalışmalardan aktardığı cümleleri ancak çok değerliyse öner ve "cites" alanını mutlaka doldur.
- İstatistik ve yaygınlık verilerinde yılı ve ülkeyi içeren cümleleri seç.
- Yalnızca güçlü ve doğrudan işe yarayacak eşleşmeleri öner; zayıf ya da genel bağlantıları ekleme. Aynı cümle en fazla iki farklı hedefe önerilebilir (ör. Giriş’te kısa, Genel Bilgiler’de ayrıntılı kullanım). En fazla 30 öneri.
- Özet (Abstract) bölümündeki cümleler yerine, aynı bilgiyi veren gövde cümlelerini tercih et.
Yalnızca şu yapıda JSON döndür: {"items":[{"p":0,"quote":"","target":"","point":0,"role":"","reason":"","cites":[]}]}

TEZ KONUSU: ${S.plan.topic}
TASARIM: ${S.plan.design || ''}
TEZ PLANI (kaynak alabilecek iskeletler):
${planPrompt()}

MAKALE: ${p.meta.title || p.name} (${inText(p)})
PARAGRAFLAR:
${body}`;
  const res = await gemini(prompt, { temperature: 0.1 });
  const now = Date.now(); let added = 0;
  const keep = S.sugs.filter(s => s.paperId !== p.id || s.status !== 'pending');
  const items = res && Array.isArray(res.items) ? res.items : [];
  for (const it of items) {
    const t = targetOf(str(it && it.target)); const n = parseInt(it && it.p, 10); const quote = str(it && it.quote);
    if (!t || !p.paras[n] || !quote) continue;
    let f = findQuote(p.paras[n].t, quote); let pi = n;
    if (!f) for (let i = Math.max(0, n - 3); i <= Math.min(p.paras.length - 1, n + 3) && !f; i++) { if (i === n) continue; const g = findQuote(p.paras[i].t, quote); if (g) { f = g; pi = i; } }
    if (!f) continue;
    const exact = p.paras[pi].t.slice(f.r[0], f.r[1]);
    if (keep.some(s => s.paperId === p.id && s.target === t.key && s.para === pi && Math.abs(s.r[0] - f.r[0]) < 20)) continue;
    const role = ROLES.includes(str(it.role)) ? str(it.role) : 'sonuç/etki';
    keep.push({ id: 's' + uid(), paperId: p.id, para: pi, r: f.r, quote: exact, target: t.key, point: Math.max(0, parseInt(it.point, 10) || 0), role, reason: str(it.reason).slice(0, 220),
      cites: (Array.isArray(it.cites) ? it.cites : []).map(str).filter(Boolean).slice(0, 4), status: 'pending', at: now });
    added++;
  }
  S.sugs = keep; saveSugs();
  S.scans[p.id] = { at: now, ver: S.plan.ver || 1, n: added }; saveScans();
  return added;
}
async function scanWithUi(p) {
  if (!p) return;
  if (!S.settings.key) { openSettings(); toast('Önce Gemini API anahtarını ekle.', 'err'); return; }
  busy(`“${(p.meta.title || p.name).slice(0, 60)}” tez planına göre taranıyor…`);
  try { const n = await scanPaper(p); busy(false); toast(n ? `${n} öneri bulundu. Öneriler sekmesinden ya da metindeki etiketlerden incele.` : 'Bu makalede planına uyan güçlü bir eşleşme bulunamadı.'); }
  catch (e) { busy(false); toast(errMsg(e), 'err'); }

}

  let ok = 0, tot = 0; const fail = [];

}
const needsScan = p => !S.scans[p.id] || (S.scans[p.id].ver || 1) !== (S.plan.ver || 1);

/* ---------- accept / reject ---------- */
function acceptSug(s) {
  const p = S.papers[s.paperId]; const t = targetOf(s.target); if (!p || !t) return;
  syncPlanCats();
  const sec = secOf(p, s.para);
  const n = { id: uid(), paperId: p.id, para: s.para, lang: 'o', secTitle: sec ? sec.title : '', text: s.quote, partial: true, cat: catForTarget(t), created: Date.now(), plan: { target: s.target, point: s.point, role: s.role } };
  const cs = sugCites(s); if (cs.length) { n.cites = cs.map(c => ({ intext: c.intext, ref: c.ref })); n.direct = false; }
  S.notes.push(n); s.status = 'added'; s.noteId = n.id; saveSugs(); notesChanged(); pulseNotes();
  toast(`Eklendi: ${t.node.code} ${t.para.title !== 'İçerik' ? t.para.title : t.node.title}`, '', { label: 'Geri al', fn: () => undoSug(s) });
  refreshMap();
}
function rejectSug(s) { s.status = 'rejected'; saveSugs(); refreshMap(); toast('Öneri reddedildi.', '', { label: 'Geri al', fn: () => undoSug(s) }); }
function undoSug(s) {
  if (s.noteId) { S.notes = S.notes.filter(n => n.id !== s.noteId); delete s.noteId; notesChanged(); }
  s.status = 'pending'; saveSugs(); refreshMap();
}
function refreshMap() {
  if (curPaper()) { renderReader(true); renderSectionBar(); }
  if (S.pane === 'sug') renderSugPane();
  if (S.screen === 'arc' && $('#mapMain')) renderPlanMain();
  if ($('#planTree')) renderPlanTree();
}

/* ---------- cited sources inside a suggested sentence ---------- */
const foldRef = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ı/g, 'i');
function refEntries(p) {
  if (p._refs) return p._refs;
  let idx = [];
  p.sections.forEach(s => { if (/kaynak|referen|bibliograph/i.test(`${s.title} ${s.original || ''}`)) for (let i = s.start; i <= s.end; i++) idx.push(i); });
  if (!idx.length) for (let i = p.paras.length - 1; i > p.paras.length * 0.5; i--) if (/^(kaynak(ça|lar)|references|bibliography)\b/i.test(p.paras[i].t.trim())) { for (let j = i + 1; j < p.paras.length; j++) idx.push(j); break; }
  const joined = idx.map(i => p.paras[i].t.trim()).filter(t => !/^(kaynak(ça|lar)|references|bibliography)$/i.test(t)).join('\n');
  const parts = joined.split(/\n(?=\p{Lu}[\p{L}'’\-]+,?\s)|(?<=[.)])\s+(?=\p{Lu}[\p{L}'’\-]+,\s+(?:\p{Lu}\.|\p{Lu}\p{Ll}))/u);
  p._refs = parts.map(x => x.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim()).filter(x => x.length > 20 && /\b(1[89]\d\d|20\d\d)/.test(x));
  return p._refs;
}
const citeKey = c => ({ sur: (String(c).match(/\p{Lu}[\p{L}'’\-]+/u) || [])[0] || '', year: (String(c).match(/\b(1[89]\d\d|20\d\d)[a-z]?\b/) || [])[0] || '' });
function findRefFor(p, cite) {
  const { sur, year } = citeKey(cite); if (!sur || !year) return '';
  const fs = foldRef(sur); const y = year.slice(0, 4);
  const es = refEntries(p);
  const hit = es.find(e => foldRef(e.slice(0, 50)).startsWith(fs) && e.includes(y)) || es.find(e => foldRef(e.slice(0, 90)).includes(fs) && e.slice(0, 200).includes(y));
  return hit ? hit.slice(0, 700) : '';
}
/* in-text citations written in the sentence itself, in case the model missed one */
function citesInText(q) {
  const out = []; let m;
  const re = /\(([^()]*?\b(?:1[89]\d\d|20\d\d)[a-z]?[^()]*)\)/g;
  while ((m = re.exec(q))) for (const part of m[1].split(';')) { const t = part.replace(/^\s*(akt\.?|aktaran|bkz\.?|ör\.?|e\.g\.|as cited in)?[\s,]*/i, '').trim(); if (/\p{Lu}/u.test(t) && /\d{4}/.test(t)) out.push(t); }
  const re2 = /(\p{Lu}[\p{L}'’\-]+(?:\s+(?:ve|&|and)\s+\p{Lu}[\p{L}'’\-]+)?(?:\s+(?:vd\.|ve ark\.|ve arkadaşları(?:nın)?|et al\.))?)\s*\((\d{4}[a-z]?)\)/gu;
  while ((m = re2.exec(q))) out.push(`${m[1].replace(/ve arkadaşları(nın)?/, 'vd.')}, ${m[2]}`);
  return out;
}
function sugCites(s) {
  if (s._cr) return s._cr;
  const p = S.papers[s.paperId]; if (!p) return [];
  const list = [...(s.cites || [])];
  for (const c of citesInText(s.quote)) { const k = citeKey(c); if (!list.some(x => { const j = citeKey(x); return foldRef(j.sur) === foldRef(k.sur) && j.year.slice(0, 4) === k.year.slice(0, 4); })) list.push(c); }
  s._cr = list.map(c => ({ intext: c.replace(/\s+/g, ' ').trim(), ref: findRefFor(p, c) }));
  return s._cr;
}
function citeBlock(s) {
  const cs = sugCites(s); if (!cs.length) return '';
  return `<div class="scites">${cs.map(c => `<div class="scite"><div class="sch">Bu cümlede atıf yapılan kaynak: <b>${esc(c.intext)}</b></div>${c.ref
    ? `<p class="sref">${esc(c.ref)}</p><div class="srefact"><button data-copyref="${esc(c.ref)}">Künyeyi kopyala</button><a class="btn" href="https://scholar.google.com/scholar?q=${encodeURIComponent(c.ref.slice(0, 250))}" target="_blank" rel="noopener">Google Akademik’te bul</a></div>`
    : '<div class="qwarn">Makalenin kaynakçasında bu atfın künyesi bulunamadı. Kullanmadan önce bu kaynağın gerçekten var olduğunu doğrula.</div>'}</div>`).join('')}</div>`;
}

/* ---------- warnings that follow the plan’s own rules ---------- */
function sugWarnings(s) {
  const w = []; const p = S.papers[s.paperId]; const y = paperYear(p); const now = new Date().getFullYear();
  if (sugCites(s).length) w.push('Bu bilgi makalenin kendi bulgusu değil. Eklersen atıf “akt.” ile yapılır; asıl kaynağı okuyunca notunda tek dokunuşla doğrudan atfa çevirebilirsin.');
  if (y && s.role === 'istatistik' && now - y > 5) w.push(`Veri ${y} yılına ait. Planın en güncel veriyi (TÜİK, DSÖ) istiyor.`);
  else if (y && now - y > 10 && !['kuram', 'tanım'].includes(s.role)) w.push(`Kaynak ${now - y} yıllık. Plan son 5–10 yılın kaynaklarını istiyor (klasik kuram kaynakları hariç).`);
  const top = topCode(s.target);
  if (top === '1' || top === '2') {
    const other = S.sugs.find(o => o !== s && o.status === 'added' && o.paperId === s.paperId && o.para === s.para && topCode(o.target) !== top && ['1', '2'].includes(topCode(o.target)));
    if (other) w.push(`Bu cümle ${other.target.split('#')[0]} başlığında da kullanıldı. Plan, Giriş’teki bilgiyi Genel Bilgiler’de aynen tekrarlamamanı istiyor: birinde kısa, diğerinde ayrıntılı ver.`);
  }
  return w;
}

/* ---------- reader integration: underline + tags ---------- */
const paperSugs = p => S.sugs.filter(s => s.paperId === p.id && s.status !== 'rejected');
function sugTags(p, i) {

}

    <div class="sact">${s.status === 'pending' ? '<button class="primary" data-acc>Ekle</button><button data-rej>Reddet</button>' : `<button data-undo>${s.status === 'added' ? 'Eklemeyi geri al' : 'Geri al'}</button>`}</div>
  </div>`;

function gotoSug(s) {

function bindSugActions(root, inModal) {
  root.addEventListener('click', e => {
    const cr = e.target.closest('[data-copyref]');

    const card = e.target.closest('[data-sid]'); const g = e.target.closest('[data-goto]');

}

/* ---------- right pane: suggestions for the open article ---------- */
function renderSugPane() {
  const L = $('#sugLog'); const p = curPaper();
  if (!p) { L.innerHTML = '<div class="empty-notes">Önerileri görmek için bir makale aç.</div>'; return; }
  const all = S.sugs.filter(s => s.paperId === p.id);
  const sc = S.scans[p.id];

function coverage(t) {
  const added = S.sugs.filter(s => s.target === t.key && s.status === 'added').length;
  const pending = S.sugs.filter(s => s.target === t.key && s.status === 'pending').length;
  const goal = targetGoal(t);
  return { added, pending, goal, cls: added === 0 ? 'c0' : added < goal ? 'c1' : 'c2' };
}
function nodeCoverage(n) {
  const ts = planTargets().filter(t => t.node.code === n.code || t.node.code.startsWith(n.code + '.'));
  if (!ts.length) return null;
  const cs = ts.map(coverage);
  return { added: cs.reduce((a, c) => a + c.added, 0), pending: cs.reduce((a, c) => a + c.pending, 0), cls: cs.some(c => c.cls === 'c0') ? (cs.every(c => c.cls === 'c0') ? 'c0' : 'c1') : (cs.some(c => c.cls === 'c1') ? 'c1' : 'c2') };
}
function renderPlanTree() {

/* ---------- plan editing (plain text outline) ---------- */
function planToText(pl) {
  let s = `KONU: ${pl.topic}\nTASARIM: ${pl.design || ''}\n\n`;
  for (const n of pl.nodes) {
    s += `${'#'.repeat(n.level)} ${n.code} ${n.title}${n.pages ? ' {' + n.pages + '}' : ''}${n.src ? '' : ' [kaynaksız]'}\n`;
    if (n.tip) s += `ipucu: ${n.tip}\n`;
    for (const p of (n.paras || [])) { s += `> ${p.title}${p.pages ? ' {' + p.pages + '}' : ''}${p.src === false ? ' [kaynaksız]' : ''}\n`; for (const x of p.points) s += `- ${x}\n`; }
    s += '\n';
  }
  return s;
}
function textToPlan(txt, old) {
  const pl = { topic: old.topic, design: old.design, rules: old.rules, nodes: [], ver: old.ver || 1 }; let n = null, pa = null;
  for (const raw of String(txt).split('\n')) {
    const l = raw.trim(); if (!l) continue;
    let m;
    if ((m = l.match(/^KONU:\s*(.*)$/i))) { pl.topic = m[1].trim(); continue; }
    if ((m = l.match(/^TASARIM:\s*(.*)$/i))) { pl.design = m[1].trim(); continue; }
    const flags = s => ({ src: !/\[kaynaksız\]/i.test(s), pages: ((s.match(/\{([^}]*)\}/) || [])[1] || '').trim(), clean: s.replace(/\{[^}]*\}|\[kaynaksız\]/gi, '').trim() });
    if ((m = l.match(/^(#{1,3})\s+(.+)$/))) {
      const f = flags(m[2]); const mm = f.clean.match(/^(\d+(?:\.\d+)*)\.?\s+(.*)$/);
      n = { code: mm ? mm[1] : 'x' + pl.nodes.length, title: mm ? mm[2] : f.clean, level: m[1].length, src: f.src, pages: f.pages || undefined, paras: [] }; pa = null; pl.nodes.push(n);
      const o = old.nodes.find(x => x.code === n.code); if (o && o.disc) n.disc = o.disc;
      continue;
    }
    if (!n) continue;
    if ((m = l.match(/^ipucu:\s*(.*)$/i))) { n.tip = m[1]; continue; }
    if ((m = l.match(/^>\s*(.+)$/))) { const f = flags(m[1]); pa = { title: f.clean, pages: f.pages || undefined, points: [] }; if (!f.src) pa.src = false; n.paras.push(pa); continue; }
    if ((m = l.match(/^[-•*]\s*(.+)$/))) { if (!pa) { pa = { title: 'İçerik', points: [] }; n.paras.push(pa); } pa.points.push(m[1].trim()); continue; }
    if (pa && pa.points.length) pa.points[pa.points.length - 1] += ' ' + l;
  }
  return pl;
}

async function exportDraft() {
  if (!window.JSZip) { toast('Word oluşturucu yüklenemedi. İnternet bağlantını kontrol et.', 'err'); return; }
  const notes = S.notes.filter(n => n.plan && hasText(n));
  const blob = await buildDocx({ notes, title: 'Tez Taslağı: Kaynak Haritası', custom: ({ run, para, textRuns, sm }) => {
    let b = para(run(S.plan.topic, { i: true, color: '444444' }), { jc: 'center', after: 360 });
    for (const n of S.plan.nodes) {
      const head = `${n.code !== '0' && n.code !== '7' ? n.code + ' ' : ''}${n.title}`;
      b += para(run(head, { b: true, sz: n.level === 1 ? 30 : n.level === 2 ? 26 : 24 }), { before: n.level === 1 ? 400 : 240, after: 120, keep: true });
      (n.paras || []).forEach((pa, k) => {
        const key = `${n.code}#${k + 1}`; const ns = notes.filter(x => x.plan.target === key);
        b += para(run(pa.title + (pa.pages ? ` (${pa.pages})` : ''), { b: true, sz: 22, color: '24508F' }), { before: 120, after: 60, keep: true });
        pa.points.forEach(x => { b += para(run('• ' + x, { i: true, color: '666666', sz: 20 }), { after: 40, ind: '<w:ind w:left="284"/>' }); });
        ns.forEach((x, j) => { b += para(run(`${j + 1}.`) + '<w:r><w:tab/></w:r>' + textRuns(noteWithCite(x, sm)), { ind: '<w:ind w:left="425" w:hanging="425"/>', after: 120, before: j ? 0 : 80 }); });
      });
    }
    return b;
  } });
  downloadBlob(blob, `tez-taslagi-${new Date().toISOString().slice(0, 10)}.docx`);
  toast('Taslak indirildi: başlıklar, iskelet maddeleri ve eklediğin alıntılar atıflarıyla.');
}

async function restoreData(d) {
  if (!d || d.app !== 'tez-haritasi') throw new Error('Bu dosya bir Tez Haritası yedeği değil.');
  for (const p of Object.values(d.papers || {})) { S.papers[p.id] = p; await DB.set('paper:' + p.id, p); }
  const cids = new Set(S.cats.map(c => c.id)); for (const c of (d.cats || [])) if (c && c.id && !cids.has(c.id)) S.cats.push(c);
  const ids = new Set(S.notes.map(n => n.id)); for (const n of (d.notes || [])) if (!ids.has(n.id)) S.notes.push(n);
  fixNotes(); saveCats(); saveNotes();
  if (d.plan && d.plan.nodes) { S.plan = d.plan; savePlan(); }
  if (Array.isArray(d.sugs)) { const k = new Set(S.sugs.map(x => x.id)); d.sugs.forEach(x => { if (!k.has(x.id)) S.sugs.push(x); }); saveSugs(); }
  if (d.scans) { S.scans = Object.assign({}, d.scans, S.scans); saveScans(); }
  if (Array.isArray(d.archive)) { ARC.merge({ items: d.archive, folders: d.arcFolders || [] }); ARC.touch(); }
}

        <li><b>OAuth consent screen</b> (Google Auth Platform) bölümünde uygulamaya bir ad ver, kullanıcı türünü <b>External</b> seç ve <b>Test users</b> kısmına kendi Gmail adresini ekle.</li>
        <li><b>Credentials → Create credentials → OAuth client ID</b>, tür <b>Web application</b>. <b>Authorized JavaScript origins</b>’e ve <b>Authorized redirect URIs</b>’e aşağıdaki adresleri ekle.</li>
        <li>Oluşan Client ID’yi yukarıya yapıştır, <b>Kaydet</b>’e dokun, sonra <b>Drive’a bağlan</b>.</li></ol>
        ${web ? `<p class="hint">JavaScript origin:</p><span class="code">${esc(location.origin)}</span><p class="hint">Redirect URI:</p><span class="code" id="sRedir">${esc(Drive.redirectUri())}</span><div class="row"><button id="sCopy">Redirect URI’yi kopyala</button></div>` : ''}
        <p class="hint">Uygulama yalnızca kendi oluşturduğu dosyalara erişir. Drive’ındaki diğer dosyaları göremez. Oturum bir saat geçerlidir, sonra tek dokunuşla tekrar bağlanırsın.</p></details></div>
    <div class="field"><div class="flabel">Yedek</div>
      <p class="hint">Makaleler, notlar ve kategoriler bu cihazın tarayıcısında saklanır. Ara sıra yedek al.</p>
      <div class="row"><button id="sBk">Yedeği indir</button><label class="btn" for="bkIn">Yedeği yükle</label><input type="file" id="bkIn" class="vh" accept="application/json,.json"></div></div>
    <div class="mact"><button id="sTest">Anahtarı test et</button><button class="primary" id="sSave">Kaydet</button></div>`, box => {
    const fill = (list, cur) => {
      const opts = list.slice(); if (cur && !opts.some(m => m.id === cur)) opts.unshift({ id: cur, label: cur + ' (kayıtlı)' });
      $('#sModel').innerHTML = opts.map(m => `<option value="${esc(m.id)}" ${m.id === cur ? 'selected' : ''}>${esc(m.label)}${m.label !== m.id ? ' (' + esc(m.id) + ')' : ''}</option>`).join('');
    };
    const hint = t => { const h = $('#sMHint'); if (h) h.textContent = t; };
    fill(cached || DEFAULT_MODELS, S.settings.model);
    hint(cached ? 'Liste son getirildiği hâliyle. Güncellemek için Yenile’ye dokun.' : 'API anahtarını girince kullanabileceğin modeller burada listelenir.');
    let seq = 0;
    const load = async () => {
      const key = $('#sKey').value.trim(); if (!key) { hint('Modelleri görmek için önce API anahtarını gir.'); return; }
      const my = ++seq; hint('Modeller getiriliyor…'); $('#sRefresh').disabled = true;
      try {
        const list = await listModels(key); if (my !== seq || !$('#sModel')) return;
        LS.set('th:models', list); fill(list, $('#sModel').value || S.settings.model);
        hint(`Bu anahtarla ${list.length} metin modeli kullanılabiliyor. Sınır hatası alırsan “Flash” ya da “Flash-Lite” modellerinden birini seç.`);
      } catch (e) { if (my === seq) hint(errMsg(e)); }
      finally { const b = $('#sRefresh'); if (b) b.disabled = false; }
    };
    if (S.settings.key) load();
    $('#sKey').addEventListener('change', load);
    $('#sRefresh').onclick = load;
    $('#sShow').onclick = () => { const k = $('#sKey'); k.type = k.type === 'password' ? 'text' : 'password'; $('#sShow').textContent = k.type === 'password' ? 'Göster' : 'Gizle'; };
    $('#sStyle').onclick = e => { const b = e.target.closest('[data-style]'); if (!b) return; style = b.dataset.style; $$('#sStyle button').forEach(x => x.classList.toggle('on', x === b)); };
    const apply = () => { S.settings.key = $('#sKey').value.trim(); S.settings.model = $('#sModel').value || 'gemini-2.5-flash'; S.settings.style = style; S.settings.clientId = $('#sCid').value.trim(); saveSettings(); };
    if (focus === 'drive') setTimeout(() => $('#sDrive').scrollIntoView({ block: 'start', behavior: 'smooth' }), 50);
    $('#sTest').onclick = async () => {
      apply(); const b = $('#sTest'); b.disabled = true; b.textContent = 'Deneniyor…';
      try { await gemini('Sadece "tamam" yaz.', { json: false }); toast(`Anahtar çalışıyor (${S.settings.model}).`); }
      catch (e) { toast(errMsg(e), 'err'); }
      finally { b.disabled = false; b.textContent = 'Anahtarı test et'; }
    };
    $('#sSave').onclick = () => { apply(); closeModal(); renderAll(true); toast('Ayarlar kaydedildi.'); };
    if ($('#sConn')) $('#sConn').onclick = () => { apply(); Drive.connect('settings'); };
    if ($('#sDisc')) $('#sDisc').onclick = () => { Drive.disconnect(); apply(); openSettings('drive'); toast('Drive bağlantısı kesildi.'); };
    if ($('#sCopy')) $('#sCopy').onclick = async () => { try { await navigator.clipboard.writeText(Drive.redirectUri()); toast('Redirect URI kopyalandı.'); } catch { toast('Kopyalanamadı. Adresi elle seç.', 'err'); } };
    const needDrive = () => { if (Drive.ok()) return true; apply(); toast('Önce Drive’a bağlan.', '', S.settings.clientId && Drive.web() ? { label: 'Bağlan', fn: () => Drive.connect('settings') } : null); return false; };
    $('#sDBk').onclick = async () => {
      if (!needDrive()) return;
      busy('Yedek Drive’a kaydediliyor…');
      try { await Drive.putJson(BACKUP_NAME, backupData()); toast('Yedek Drive’daki “' + FOLDER_NAME + '” klasörüne kaydedildi.'); }
      catch (e) { toast(errMsg(e), 'err'); } finally { busy(false); }
    };
    $('#sDRs').onclick = async () => {
      if (!needDrive()) return;
      busy('Yedek Drive’dan alınıyor…');
      try {
        const d = await Drive.getJson(BACKUP_NAME); busy(false);
        if (!d) { toast('Drive’da yedek bulunamadı.'); return; }
        if (!confirm('Drive’daki yedekte bulunan makaleler, notlar ve kategoriler mevcut verilerine eklenecek. Devam edilsin mi?')) return;
        await restoreData(d); closeModal(); renderAll(); toast('Yedek Drive’dan yüklendi.');
      } catch (e) { busy(false); toast(errMsg(e), 'err'); }
    };
    $('#sBk').onclick = () => {
      downloadBlob(new Blob([JSON.stringify(backupData())], { type: 'application/json' }), `tez-haritasi-yedek-${new Date().toISOString().slice(0, 10)}.json`);
    };
    $('#bkIn').onchange = async ev => {
      const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (!d || d.app !== 'tez-haritasi') throw new Error('Bu dosya bir Tez Haritası yedeği değil.');
        if (!confirm('Yedekteki makaleler ve notlar mevcut verilerine eklenecek. Devam edilsin mi?')) return;
        await restoreData(d); closeModal(); renderAll(); toast('Yedek yüklendi.');
      } catch (e) { toast(errMsg(e), 'err'); }
    };
  });
}

/* ---------- Word export ---------- */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function buildDocx(set) {
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const X = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const run = (t, o = {}) => {
    const rp = (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '') + (o.color ? `<w:color w:val="${o.color}"/>` : '') + (o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : '');
    return `<w:r>${rp ? `<w:rPr>${rp}</w:rPr>` : ''}<w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  };
  const textRuns = t => String(t).split(/\n/).map((ln, k) => (k ? '<w:r><w:br/></w:r>' : '') + run(ln)).join('');
  const para = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 160}" w:line="${o.line || 360}" w:lineRule="auto"/>${o.ind || ''}${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}</w:pPr>${runs}</w:p>`;
  const sm = suffixMap(set.notes);
  let body = para(run(set.title, { b: true, sz: 32 }), { jc: 'center', after: 80 });
  body += para(run(new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }), { color: '666666', sz: 20 }), { jc: 'center', after: 360 });
  if (set.custom) body += set.custom({ run, para, textRuns, sm });
  else for (const g of exportGroups(set)) {
    if (g.name) body += para(run(g.name, { b: true, sz: g.level === 1 ? 28 : 24, i: g.level === 2 }), { before: g.level === 1 ? 320 : 200, after: 140, keep: true });
    g.notes.forEach((n, k) => {
      body += para(run(`${k + 1}.`) + '<w:r><w:tab/></w:r>' + textRuns(noteWithCite(n, sm)), { ind: '<w:ind w:left="425" w:hanging="425"/>', after: 200 });
    });
  }
  const refs = citedPapers(set.notes);
  if (refs.length) {
    body += para(run('Kaynakça', { b: true }), { jc: 'center', before: 480, after: 240, keep: true });
    for (const p of refs) body += para(refParts(p, sm).map(([t, i]) => run(t, { i })).join(''), { ind: '<w:ind w:left="720" w:hanging="720"/>', line: 480, after: 0 });
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="${W}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const zip = new JSZip();
  zip.file('[Content_Types].xml', types); zip.file('_rels/.rels', rels);
  zip.file('word/document.xml', doc); zip.file('word/styles.xml', styles); zip.file('word/_rels/document.xml.rels', docRels);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
const hasText = n => String(n.text || '').trim();
function exportSet(sel) {
  const notes = S.notes.filter(n => hasText(n) && (sel === 'all' || inCat(n, sel)));
  return { notes, sel, title: sel === 'all' ? 'Notlarım' : catName(sel) };
}
function exportGroups(set) {
  const ns = set.notes; const out = [];
  const block = (m, withHead) => {
    const direct = ns.filter(n => n.cat === m.id);
    const subs = subsOf(m.id).map(c => ({ c, notes: ns.filter(n => n.cat === c.id) })).filter(x => x.notes.length);
    if (!direct.length && !subs.length) return;
    const lv = withHead ? 2 : 1;
    if (withHead) out.push({ name: m.name, level: 1, notes: subs.length ? [] : direct });
    if (subs.length) {
      if (direct.length) out.push({ name: 'Genel', level: lv, notes: direct });
      subs.forEach(x => out.push({ name: x.c.name, level: lv, notes: x.notes }));
    } else if (!withHead) out.push({ name: null, level: 0, notes: direct });
  };
  if (set.sel === 'all') {
    const used = mains().filter(m => ns.some(n => inCat(n, m.id)));
    used.forEach(m => block(m, used.length > 1));
  } else {
    const c = catOf(set.sel);
    if (c && !c.parent) block(c, false); else out.push({ name: null, level: 0, notes: ns });
  }
  return out.length ? out : [{ name: null, level: 0, notes: ns }];
}
function openExport() {
  if (!S.notes.some(hasText)) { toast('Önce birkaç not ekle.'); return; }
  if (!window.JSZip) { toast('Word oluşturucu yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', 'err'); return; }
  const cnt = id => S.notes.filter(n => hasText(n) && inCat(n, id)).length;
  let sel = S.catView !== 'all' && cnt(S.catView) ? S.catView : 'all';
  const slug = t => t.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-');
  modal(`<h3>Word’e aktar</h3><p class="hint">Notların sırasıyla, APA 7 metin içi atıflarıyla yazılır. Kaynakça en sonda alfabetik sıradadır ve yalnızca bu notlarda geçen makaleleri içerir.</p>
    <label>Hangi notlar?<select id="xCat"><option value="all">Tüm kategoriler (${S.notes.filter(hasText).length})</option>${mains().filter(m => cnt(m.id)).map(m => `<option value="${m.id}">${esc(m.name)} (${cnt(m.id)})</option>` + subsOf(m.id).filter(c => cnt(c.id)).map(c => `<option value="${c.id}">   ${esc(m.name)} › ${esc(c.name)} (${cnt(c.id)})</option>`).join('')).join('')}</select></label>
    <div class="docprev" id="xPrev"></div>
    <label>Dosya adı<input id="xName" autocapitalize="off" spellcheck="false"></label>
    <div class="mact"><button data-close>Kapat</button><button id="xShare">Paylaş</button><button class="primary" id="xDl">İndir (.docx)</button></div>`, () => {
    let ready = null, blob = null;
    const build = () => {
      const set = exportSet(sel); const sm = suffixMap(set.notes); const refs = citedPapers(set.notes);
      $('#xPrev').innerHTML = `<h4>${esc(set.title)}</h4>` + exportGroups(set).map(g => (g.name ? `<p style="font-weight:700;margin:${g.level === 1 ? '20px 0 8px;font-size:17px' : '12px 0 6px;font-style:italic'}">${esc(g.name)}</p>` : '') + g.notes.map((n, k) => `<p class="n">${k + 1}. ${esc(noteWithCite(n, sm))}</p>`).join('')).join('')
        + (refs.length ? `<h4 style="margin-top:22px">Kaynakça</h4>${refs.map(p => `<p class="refp">${refHTML(p, sm)}</p>`).join('')}` : '');
      $('#xName').value = slug(set.title) + '-' + new Date().toISOString().slice(0, 10);
      blob = null; ready = buildDocx(set).then(b => { blob = b; return b; });
    };
    $('#xCat').value = sel; build();
    $('#xCat').onchange = e => { sel = e.target.value; build(); };
    const fname = () => ($('#xName').value.trim() || 'Notlarim').replace(/[\\/:*?"<>|]+/g, '-') + '.docx';
    $('#xDl').onclick = async () => { const b = blob || await ready; downloadBlob(b, fname()); toast('Word dosyası indirildi.'); };
    $('#xShare').onclick = async () => {
      const b = blob || await ready;
      const file = new File([b], fname(), { type: b.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: fname() }); } catch (e) { if (e.name !== 'AbortError') toast('Paylaşılamadı. İndir düğmesini kullan.', 'err'); }
      } else { downloadBlob(b, fname()); toast('Paylaşım desteklenmiyor, dosya indirildi.'); }
    };
  });
}

/* ---------- init ---------- */
async function init() {
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const after = Drive.handleRedirect();
  try {
    await DB.open();
    for (const p of await loadArticleLibrary()) { p.strokes = p.strokes || {}; p.tr = p.tr || {}; S.papers[p.id] = p; }
    S.notes = (await DB.get('notes')) || [];
    for (const p of Object.values(S.papers)) repairPaper(p);
    S.plan = (await DB.get('plan')) || null;
    S.sugs = (await DB.get('sugs')) || [];
    S.scans = (await DB.get('scans')) || {};
    S.cats = (await DB.get('cats')) || [];
    ARC.items = (await DB.get('archive')) || [];
    ARC.folders = (await DB.get('arcFolders')) || [];
  } catch (e) {
    DB.db = null; toast('Tarayıcı depolaması kullanılamıyor. Veriler kaydedilmeyecek.', 'err');
  }
  if (!S.plan) { S.plan = JSON.parse(JSON.stringify(DEFAULT_PLAN)); S.plan.ver = 1; savePlan(); }
  /* The plan now covers only Giriş (1) and Genel Bilgiler (2): drop everything else from older saved plans. */
  const keepTop = code => ['1', '2'].includes(String(code).split('.')[0]);
  if (S.plan.nodes.some(n => !keepTop(n.code))) {
    S.plan.nodes = S.plan.nodes.filter(n => keepTop(n.code)); savePlan();
    S.sugs = S.sugs.filter(x => keepTop(String(x.target).split('#')[0]) || x.status === 'added'); saveSugs();
    const used = new Set(S.notes.map(n => n.cat));
    S.cats = S.cats.filter(c => !/^pc-/.test(c.id) || keepTop(c.id.slice(3)) || used.has(c.id) || S.cats.some(k => k.parent === c.id && used.has(k.id)));
    if (!keepTop(S.planSel)) { S.planSel = '1.1'; LS.set('th:planSel', '1.1'); }
  }
  if (!S.plan.noDisc) {
    S.plan.nodes = S.plan.nodes.filter(n => topCode(n.code) !== '5'); S.plan.noDisc = true; savePlan();
    S.sugs = S.sugs.filter(x => topCode(x.target) !== '5' || x.status === 'added'); saveSugs();
    S.cats = S.cats.filter(c => !/^pc-5(\.|$)/.test(c.id) || S.notes.some(n => inCat(n, c.id)));
  }
  fixNotes(); syncPlanCats(); ARC.fix(); S.pane = 'sug';
  resizeOv();
  const last = LS.get('th:last', null);
  if (last && S.papers[last]) openPaper(last); else renderAll();
  if (after) {
    toast('Drive bağlandı. Arşiv eşitleniyor…');
    await ARC.sync(false);
    if (after === 'archive') openArchive(); else if (after === 'settings') openSettings('drive');
  } else if (Drive.ok()) ARC.sync(true);
}
init();
})();
